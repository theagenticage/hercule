<!doctype html>
<html lang="en" data-theme="paper">
<head>
<script src="../../shared/page.js"></script>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../system.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New thread · Hercule</title>
<style>
  .mhead { padding-left: 8px; }
  .mhead .projpick { margin-left: auto; margin-right: 8px; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border-radius: var(--r-pill); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; font-weight: 560; }
  .mhead .projpick .i { width: 12px; height: 12px; color: var(--faint); }

  .body { flex: 1; min-height: 0; overflow: auto; padding: 26px 20px 0; }
  .ask-h { font-size: var(--fs-title); font-weight: 600; line-height: 1.3; letter-spacing: var(--track-title); }
  .ask-h u { text-decoration: none; box-shadow: inset 0 -3px 0 var(--p-webshop); }
  .where { margin-top: 8px; font-size: 14px; color: var(--muted); }

  .label { margin: 34px 0 10px; }
  .starts { display: flex; flex-direction: column; border-top: 1px solid var(--line-soft); }
  .srow { display: grid; grid-template-columns: 4px 1fr auto; column-gap: 12px; align-items: center; min-height: 58px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); text-align: left; }
  .srow .kbar { height: 34px; align-self: center; }
  .srow .t { font-size: 15px; font-weight: 560; line-height: 1.3; }
  .srow .s { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: var(--fs-small); color: var(--muted); }
  .srow .s .b { width: 12px; height: 12px; color: var(--ink); }
  .nw { white-space: nowrap; }
  .srow > .i { width: 14px; height: 14px; color: var(--faint); }

  .voice { flex: none; padding: 12px 0 40px; }
  .chips { display: flex; gap: 6px; padding: 0 16px 16px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, #000 84%, transparent); mask-image: linear-gradient(90deg, #000 84%, transparent); }
  .chips span { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: var(--r-pill); background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; font-weight: 520; white-space: nowrap; }
  .chips .i, .chips .b { width: 13px; height: 13px; color: var(--muted); }
  .mic-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 28px; }
  .side-btn { justify-self: start; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line), var(--shadow-1); }
  .side-btn:last-child { justify-self: end; }
  .side-btn .i { width: 20px; height: 20px; }
  .bigmic { position: relative; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); box-shadow: 0 0 0 7px color-mix(in oklab, var(--ink) 8%, transparent), var(--shadow-2); }
  .bigmic .i { width: 32px; height: 32px; stroke-width: 1.5; }
  .mic-hint { margin-top: 14px; text-align: center; font-size: 13px; color: var(--muted); }
  .mic-hint b { color: var(--ink); font-weight: 600; }
  .voice .haptic { display: flex; width: max-content; margin: 10px auto 0; }
</style>
</head>
<body>
<script src="../marks.js"></script>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="island"></span><span class="sys"><svg class="sig"><use href="#sb-signal"/></svg><svg class="wifi"><use href="#sb-wifi"/></svg><svg class="bat"><use href="#sb-battery"/></svg></span></div>

  <header class="mhead">
    <a class="mback"><svg class="i"><use href="#i-chev-l"/></svg>Threads</a>
    <button class="projpick"><span class="proj proj--webshop">webshop</span><svg class="i"><use href="#i-chev-d"/></svg></button>
  </header>

  <div class="body">
    <h1 class="ask-h">What should the agent do in <u>webshop</u>?</h1>
    <p class="where">Its own worktree, on a new branch from main.</p>

    <div class="label">Or start from your docket <span class="num">3 for webshop</span></div>
    <div class="starts">
      <button class="srow kind-proposal"><i class="kbar"></i><span><span class="t">Checkout fails for EU cards with <span class="nw">3-D Secure</span></span><span class="s"><span class="prio" data-p="4"><i></i><i></i><i></i><i></i></span><svg class="b"><use href="#b-sentry"/></svg>412 events · Fix bug</span></span><svg class="i"><use href="#i-chev-r"/></svg></button>
      <button class="srow kind-proposal"><i class="kbar"></i><span><span class="t">Add iDEAL as a payment method</span><span class="s"><span class="prio" data-p="1"><i></i><i></i><i></i><i></i></span><svg class="b"><use href="#b-intercom"/></svg>5 requests</span></span><svg class="i"><use href="#i-chev-r"/></svg></button>
      <button class="srow kind-unsure"><i class="kbar"></i><span><span class="t">App is slow on Android</span><span class="s"><svg class="b"><use href="#b-intercom"/></svg>7 conversations · Investigate</span></span><svg class="i"><use href="#i-chev-r"/></svg></button>
    </div>
  </div>

  <div class="voice">
    <div class="chips">
      <span><svg class="b"><use href="#b-claude"/></svg>Opus 5.5</span>
      <span><svg class="i"><use href="#i-hand"/></svg>Auto-accept edits</span>
      <span><svg class="i"><use href="#i-machine"/></svg>studio-mac</span>
      <span><svg class="i"><use href="#i-worktree"/></svg>new worktree</span>
    </div>
    <div class="mic-row">
      <button class="side-btn" aria-label="Attach"><svg class="i"><use href="#i-plus"/></svg></button>
      <button class="bigmic" aria-label="Hold to talk"><svg class="i"><use href="#i-mic"/></svg></button>
      <button class="side-btn" aria-label="Type instead"><svg class="i"><use href="#i-keyboard"/></svg></button>
    </div>
    <p class="mic-hint"><b>Hold to talk</b> · let go to start the thread</p>
    <span class="haptic"><svg class="i"><use href="#i-wave"/></svg>tick on press · double tick on start</span>
  </div>
  <div class="homebar"></div>
</div>
</body>
</html>
