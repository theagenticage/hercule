<!doctype html>
<!-- PROTOTYPE - one screen, side by side in all ten design systems.
     compare.html?screen=desktop/intake.html&theme=dark -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compare - Hercule design systems</title>
    <script src="designs.js"></script>
    <link rel="stylesheet" href="shared/frames.css" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f2;
        --ink: #18181a;
        --muted: #66666c;
        --line: rgb(0 0 0 / 0.09);
        --card: #fff;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      }
      :root[data-theme="dark"] {
        --bg: #121213;
        --ink: #ececee;
        --muted: #9a9aa2;
        --line: rgb(255 255 255 / 0.08);
        --card: #1b1b1d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 32px;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--line);
      }
      .bar a,
      .bar select,
      .bar button {
        height: 30px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        cursor: pointer;
      }
      .bar button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
      }
      .bar .spacer {
        flex: 1;
      }
      .bar strong {
        font-weight: 600;
        margin-right: 6px;
      }
      .grid {
        display: grid;
        gap: 40px 32px;
        padding: 32px;
      }
      .grid.desktop,
      .grid.web {
        grid-template-columns: repeat(auto-fill, minmax(640px, 1fr));
      }
      .grid.mobile {
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }
      .f {
        --f-chrome: var(--card);
        --f-chrome-ink: var(--muted);
      }
      .f-caption small {
        color: var(--muted);
        opacity: 1;
      }
      .today img {
        width: 100%;
        border-radius: 12px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <a href="index.html">&larr; Gallery</a>
      <strong style="margin-left: 8px">Compare</strong>
      <select id="screen" aria-label="Screen"></select>
      <span class="spacer"></span>
      <button data-theme-option="light">Light</button>
      <button data-theme-option="dark">Dark</button>
    </div>
    <div class="grid" id="grid"></div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var screen = params.get("screen") || "desktop/intake.html";
        var theme = params.get("theme") || "dark";
        var kind = screen.split("/")[0];
        document.documentElement.dataset.theme = theme;

        var select = document.getElementById("screen");
        Object.keys(window.SCREENS).forEach(function (k) {
          var group = document.createElement("optgroup");
          group.label = k === "desktop" ? "Desktop app" : k === "web" ? "Web" : "Mobile";
          window.SCREENS[k].forEach(function (s) {
            var o = document.createElement("option");
            o.value = k + "/" + s[0];
            o.textContent = s[1];
            o.selected = o.value === screen;
            group.appendChild(o);
          });
          select.appendChild(group);
        });
        select.onchange = function () {
          params.set("screen", select.value);
          location.search = params.toString();
        };

        var grid = document.getElementById("grid");
        grid.className = "grid " + kind;
        if (screen === "desktop/intake.html") {
          var today = document.createElement("figure");
          today.className = "f today";
          today.innerHTML =
            '<img alt="Intake today" src="shared/baseline/intake-view-' + theme + '.png">' +
            '<figcaption class="f-caption"><span>00 Today<small>The baseline prototype</small></span></figcaption>';
          grid.appendChild(today);
        }
        window.DESIGNS.forEach(function (d) {
          var fig = document.createElement("figure");
          fig.dataset.frame = kind;
          fig.dataset.src = d.id + "/" + screen;
          fig.dataset.caption = d.id.slice(0, 2) + " " + d.name;
          fig.dataset.note = d.thesis;
          if (kind === "web") fig.dataset.url = "hercule.home.arpa";
          grid.appendChild(fig);
        });
      })();
    </script>
    <script src="shared/book.js"></script>
    <script>
      // Keeps the baseline image in step with the theme buttons, which book.js handles.
      document.addEventListener("click", function (e) {
        var b = e.target.closest("[data-theme-option]");
        var img = document.querySelector(".today img");
        if (b && img) img.src = "shared/baseline/intake-view-" + b.dataset.themeOption + ".png";
      });
    </script>
  </body>
</html>
