<!doctype html>
<html lang="en" data-theme="dawn">
  <head>
    <script src="../../shared/page.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New thread · webshop · Hercule</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../system.css" />
    <script src="../marks.js"></script>
  </head>
  <body>
    <div class="phone">
      <div class="field">
        <i class="webshop" style="--x: 50%; --y: 34%; --w: 560px; --h: 460px; --o: 0.8"></i>
        <i class="own" style="--x: 100%; --y: 100%; --w: 480px; --h: 360px; --o: 0.6"></i>
        <i class="calm" style="--x: 0%; --y: 90%; --w: 360px; --o: 0.45"></i>
      </div>
      <div class="statusbar"><span class="sb-time">9:41</span><span class="icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M1.3 4.3a10 10 0 0 1 13.4 0"/><path d="M3.9 7.1a6.2 6.2 0 0 1 8.2 0"/><circle cx="8" cy="10.2" r="1.3" fill="currentColor" stroke="none"/></svg><svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="9" rx="2.4" fill="currentColor"/><path d="M25 4.3v4.4a2.3 2.3 0 0 0 0-4.4z" fill="currentColor" opacity="0.45"/></svg></span></div>
      <div class="island"></div>
      <header class="ph-head back">
        <button class="ph-btn" title="Threads"><svg class="i"><use href="#m-chev-l" /></svg></button>
        <div class="ph-tt">
          <b>New thread</b>
          <span><i class="pdot webshop"></i>webshop<span class="dot-sep"></span>not started</span>
        </div>
        <button class="ph-btn glass-thin" title="More"><svg class="i"><use href="#m-more" /></svg></button>
      </header>

      <div class="thread">
        <div class="draft-stage">
          <span class="draft-mark"><svg class="i s24"><use href="#m-compose" /></svg></span>
          <h1 class="draft-h">What should the agent do in <u class="webshop">webshop</u>?</h1>
          <p class="draft-where">Its own worktree, on a new branch from main.</p>

          <div class="ph-starts" aria-label="Start from">
            <button class="ph-start glass-thin">
              <i class="orb burn"></i>
              <span><span class="kind">Fix</span><span class="t">Checkout fails for EU cards</span></span>
              <span class="marks"><svg class="brand"><use href="#b-sentry" /></svg><svg class="brand"><use href="#b-gmail" /></svg></span>
            </button>
            <button class="ph-start glass-thin">
              <i class="orb wait"></i>
              <span><span class="kind">Investigate</span><span class="t">Stripe webhook retries rising</span></span>
              <span class="marks"><svg class="brand"><use href="#b-stripe" /></svg></span>
            </button>
            <button class="ph-start glass-thin">
              <i class="orb"></i>
              <span><span class="kind">Build</span><span class="t">Add iDEAL as a payment method</span></span>
              <span class="marks"><svg class="brand"><use href="#b-intercom" /></svg></span>
            </button>
          </div>
          <p class="starts-note"><svg class="i s12"><use href="#m-intake" /></svg>From Intake · nothing runs until you send</p>
        </div>

        <div class="composer-wrap">
          <div class="composer">
            <div class="card glass-strong">
              <textarea class="input" rows="2" placeholder="Say what you want done…"></textarea>
              <div class="c-row">
                <button class="icon-btn" title="Attach"><svg class="i"><use href="#m-plus" /></svg></button>
                <button class="sel"><svg class="i s14"><use href="#m-shield" /></svg>Auto-accept edits</button>
                <span class="grow"></span>
                <button class="sel model"><svg class="brand"><use href="#b-claude" /></svg>Opus 5.5</button>
                <button class="send mic" title="Hold to talk"><svg class="i"><use href="#m-mic" /></svg></button>
              </div>
            </div>
            <div class="lip">
              <button class="item"><svg class="i"><use href="#m-worktree" /></svg>New worktree</button>
              <button class="item"><svg class="i"><use href="#m-branch" /></svg>from <span class="mono">main</span></button>
              <button class="item right"><svg class="i"><use href="#m-machine" /></svg>studio-mac</button>
            </div>
          </div>
        </div>
      </div>
      <span class="haptic ph-note" style="right: 16px; top: 712px; --px: calc(100% - 30px); --py: calc(100% + 10px)"><svg class="i"><use href="#m-haptic" /></svg>hold to talk · light tap on start and stop</span>
      <div class="homebar"></div>
    </div>
  </body>
</html>
