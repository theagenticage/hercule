<!--
  PROTOTYPE - throwaway. Ticket: https://github.com/rogierpennink/hydra/issues/1 -> #20
  ROUND 3. Round 2 verdict: right language, wrong level. This round is intent-level:
  the unit is the strand of delegated work (task / standing workflow / one-off ask),
  execution detail (runs, sessions, steps) only behind progressive disclosure.
  Shared principles across all variants:
    - provenance-first ranking: you asked > standing > routine schedule
    - aggregate by default (routine workflows collapse to one row per workflow)
    - decisions are questions: phrased as a question, answers are the buttons
    - mark system: [equalizer] agent working · [diamond] decision wanted · [circular arrow] routine · glyph outcomes
    - outcomes live on strands + one rolled-up digest line; no event feed
    - assistants/fleet/intake = ambient pulse, never stat cards
    - calm/busy dataset toggle to prove the shape survives a 6-runner fleet
  The variants differ on WHERE DECISIONS LIVE:
    A Briefing - focus queue, one decision at a time, work below
    B Ledger   - all decisions visible as a pinned lane above the book
    C Strands  - decisions attach to the strand that raised them; ranked list, pulse rail
  Switch: floating bar, arrow keys, ?variant=A|B|C · dataset: "d" or the calm/busy
  button · theme: "t" or the half-circle button. Rounds 1-2 in git history (71c0dff, fd86bea).
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydra Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ============ tokens: pinned Midnight (docs/design-language.md) ============ */
  :root {
    --bg:      oklch(94.5% 0.0156 265);
    --surface: oklch(96.7% 0.0125 265);
    --raised:  oklch(100% 0.0078 265);
    --ink:     oklch(23% 0.0100 265);
    --muted:   oklch(48% 0.0156 265);
    --faint:   oklch(66% 0.0156 265);
    --line:      oklch(23% 0.0100 265 / 0.10);
    --line-soft: oklch(23% 0.0100 265 / 0.055);
    --card-shadow: 0 1px 2px rgba(23,26,33,0.05);
    --lift-shadow: 0 1px 2px rgba(23,26,33,0.06), 0 4px 14px rgba(23,26,33,0.06);
    --attn: #8a6116; --fail: #a34e46; --ok: #48745a; --live: #48717f;
    --attn-soft: rgba(138,97,22,0.09);
    --proj-hydra: #7d7ab0; --proj-ops: #a67f92;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:      oklch(20%   0.0288 265);
      --surface: oklch(22.2% 0.0288 265);
      --raised:  oklch(25.5% 0.0259 265);
      --ink:     oklch(90% 0.0080 265);
      --muted:   oklch(68% 0.0288 265);
      --faint:   oklch(50% 0.0288 265);
      --line:      oklch(90% 0.0288 265 / 0.10);
      --line-soft: oklch(90% 0.0288 265 / 0.06);
      --card-shadow: 0 1px 2px rgba(0,0,0,0.35);
      --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05),
                     0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
      --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8;
      --attn-soft: rgba(208,161,71,0.12);
      --proj-hydra: #9490c9; --proj-ops: #bd93a8;
    }
  }
  :root[data-theme="dark"] {
    --bg:      oklch(20%   0.0288 265);
    --surface: oklch(22.2% 0.0288 265);
    --raised:  oklch(25.5% 0.0259 265);
    --ink:     oklch(90% 0.0080 265);
    --muted:   oklch(68% 0.0288 265);
    --faint:   oklch(50% 0.0288 265);
    --line:      oklch(90% 0.0288 265 / 0.10);
    --line-soft: oklch(90% 0.0288 265 / 0.06);
    --card-shadow: 0 1px 2px rgba(0,0,0,0.35);
    --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05),
                   0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
    --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8;
    --attn-soft: rgba(208,161,71,0.12);
    --proj-hydra: #9490c9; --proj-ops: #bd93a8;
  }
  :root {
    --sans: "Onest", -apple-system, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --w-emph: 500;
    --w-urgent: 600;
  }

  /* ============ base ============ */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--mono); }
  .app { display: flex; min-height: 100vh; }

  /* ---------- chrome (shared shell) ---------- */
  .side {
    width: 204px; flex: none;
    background: var(--surface);
    border-right: 1px solid var(--line-soft);
    display: flex; flex-direction: column;
    padding: 16px 10px;
    position: sticky; top: 0; height: 100vh;
  }
  .logo { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px 16px; }
  .logo b { font-size: 15px; letter-spacing: 0.01em; font-weight: var(--w-emph); }
  .logo span { font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav a {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 10px; border-radius: 6px;
    color: var(--muted); text-decoration: none; font-size: 13px;
  }
  .nav a.on { background: var(--line-soft); color: var(--ink); font-weight: var(--w-emph); }
  .nav a:not(.on):hover { background: var(--line-soft); }
  .nav a:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .nav .count { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .nav .sep { height: 1px; background: var(--line-soft); margin: 8px 10px; }
  .proto-badge {
    margin-top: auto;
    border: 1px dashed var(--attn); color: var(--attn); background: var(--attn-soft);
    border-radius: 8px; padding: 8px 10px;
    font-family: var(--mono); font-size: 10px; line-height: 1.5;
  }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: baseline; gap: 14px; padding: 24px 32px 0; }
  .topbar h1 { font-size: 18px; margin: 0; letter-spacing: -0.015em; font-weight: var(--w-emph); }
  .topbar .when { color: var(--muted); font-size: 13px; }
  #stage { padding: 16px 32px 130px; }

  /* ============ shared atoms ============ */
  .lane-label {
    text-transform: uppercase; letter-spacing: 0.1em;
    font-size: 10.5px; font-weight: var(--w-emph); color: var(--faint);
    display: flex; align-items: center; gap: 8px;
  }
  .lane-label .n { font-family: var(--mono); font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }

  /* the headline: one calm sentence, never stat cards */
  .headline { font-size: 13.5px; color: var(--muted); padding-bottom: 20px; }
  .headline b { color: var(--ink); font-weight: var(--w-emph); font-variant-numeric: tabular-nums; }
  .headline .warm { color: var(--attn); font-weight: var(--w-emph); }

  /* the pulse: ambient system state as quiet text lines */
  .pulseline {
    display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline;
    color: var(--faint); font-size: 12px; padding-top: 26px;
  }
  .pulseline .k { text-transform: uppercase; letter-spacing: 0.1em; font-size: 10px; font-weight: var(--w-emph); margin-right: 2px; }
  .pulseline b { color: var(--muted); font-weight: var(--w-emph); }
  .pulseline .warm { color: var(--attn); }

  /* ---- mark system (proposed design-language extension) ---- */
  /* agent working: tiny equalizer in the live hue */
  .eq { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 10px; width: 11px; flex: none; }
  .eq i { width: 2.5px; border-radius: 1px; background: var(--live); height: 4px; animation: eqb 1.15s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: 0.22s; }
  .eq i:nth-child(3) { animation-delay: 0.44s; }
  @keyframes eqb { 0%, 100% { height: 3px; } 50% { height: 9px; } }
  @media (prefers-reduced-motion: reduce) {
    .eq i { animation: none !important; }
    .eq i:nth-child(1) { height: 4px; } .eq i:nth-child(2) { height: 8px; } .eq i:nth-child(3) { height: 5px; }
    .dot, .prog i { animation: none !important; }
  }
  /* decision wanted: a small diamond in the attention hue */
  .dmark { color: var(--attn); font-size: 9px; flex: none; position: relative; top: -1px; }
  /* routine / scheduled */
  .rmark { color: var(--faint); font-size: 12px; flex: none; }
  /* outcome glyphs */
  .okg { color: var(--ok); } .failg { color: var(--fail); } .cang { color: var(--faint); }
  /* queued / idle */
  .qmark { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; display: inline-block; }
  .markcell { width: 16px; flex: none; display: inline-flex; justify-content: center; align-items: center; font-size: 12px; }

  /* multi-step progress: segments, shape not color */
  .prog { display: inline-flex; align-items: center; gap: 2px; flex: none; }
  .prog i { width: 8px; height: 3px; border-radius: 2px; background: var(--line); }
  .prog i.d { background: var(--muted); }
  .prog i.c { background: var(--live); animation: pulse 2.4s ease-in-out infinite; }
  .prog .t { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-left: 5px; font-variant-numeric: tabular-nums; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  /* priority bars (pinned) */
  .pri { display: inline-flex; align-items: center; flex: none; }
  .pri .bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 9px; }
  .pri .bars i { width: 2.5px; border-radius: 1px; background: var(--line); }
  .pri .bars i:nth-child(1) { height: 3.5px; }
  .pri .bars i:nth-child(2) { height: 6px; }
  .pri .bars i:nth-child(3) { height: 9px; }
  .pri[data-pri="low"]    .bars i:nth-child(1) { background: var(--faint); }
  .pri[data-pri="normal"] .bars i:nth-child(-n+2) { background: var(--muted); }
  .pri[data-pri="high"]   .bars i { background: var(--muted); }
  .pri[data-pri="urgent"] .bars i { background: var(--ink); }

  /* waiting-time (pinned): darkens, then warms */
  .age {
    font-family: var(--mono); font-size: 11.5px; white-space: nowrap;
    color: var(--faint); flex: none; font-variant-numeric: tabular-nums;
  }
  .age[data-age="recent"] { color: var(--muted); }
  .age[data-age="stale"]  { color: var(--ink); }
  .age[data-age="old"]    { color: var(--attn); font-weight: 500; }

  /* quiet decision affordances (pinned) */
  .qbtn {
    font-family: var(--sans); font-size: 12px; line-height: 1; font-weight: var(--w-emph);
    border: 0; background: none; color: var(--muted);
    padding: 6px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .qbtn:hover { background: var(--line-soft); color: var(--ink); }
  .qbtn.first { color: var(--ink); }
  .qbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }

  code {
    font-family: var(--mono); font-size: 12px;
    background: var(--line-soft); padding: 1px 5px; border-radius: 4px; font-weight: 400;
  }

  /* ---- strand row: one line of intent, detail behind a click ---- */
  .strand {
    border-top: 1px solid var(--line-soft);
    padding: 9px 2px;
  }
  .strand:first-of-type { border-top: 0; }
  .strand .row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .strand .name { font-weight: var(--w-emph); font-size: 13.5px; letter-spacing: -0.004em; white-space: nowrap; }
  .strand[data-pri="urgent"] .name { font-weight: var(--w-urgent); }
  .strand[data-done="1"] { opacity: 0.66; }
  .strand .sub { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strand .note { color: var(--muted); font-size: 12.5px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strand .note[data-tone="warn"] { color: var(--attn); }
  .strand .note[data-tone="fail"] { color: var(--fail); }
  .strand .detail { display: none; }
  .strand.open .detail {
    display: flex; flex-direction: column; gap: 6px;
    margin: 8px 0 4px 26px; padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: 8px;
    font-size: 12.5px; color: var(--muted);
  }
  .strand .detail .dl { display: flex; align-items: center; gap: 9px; }
  .strand .detail .dl .mono { font-size: 11px; color: var(--faint); }
  .strand .detail .acts { display: flex; gap: 2px; margin-left: -9px; }

  /* ---- decision item: always a question; answers are the buttons ---- */
  .dcard {
    background: var(--raised); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--lift-shadow);
    padding: 14px 18px 11px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .dcard .over { display: flex; align-items: baseline; gap: 10px; font-size: 12px; color: var(--muted); }
  .dcard .over .prov { text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; color: var(--faint); font-weight: var(--w-emph); }
  .dcard .q { font-size: 15px; font-weight: var(--w-emph); letter-spacing: -0.008em; display: flex; align-items: baseline; gap: 9px; }
  .dcard[data-pri="urgent"] .q { font-size: 16px; font-weight: var(--w-urgent); }
  .dcard .why { color: var(--muted); font-size: 12.5px; }
  .dcard .acts { display: flex; gap: 4px; margin-top: 8px; margin-left: -9px; align-items: center; }

  .drow {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px;
    background: var(--raised); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--card-shadow);
  }
  .drow .q { font-weight: var(--w-emph); font-size: 13.5px; white-space: nowrap; }
  .drow[data-pri="urgent"] .q { font-weight: var(--w-urgent); }
  .drow .why { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drow .acts { display: flex; gap: 2px; margin-left: auto; }

  /* ---- landed digest: one line, expandable ---- */
  .digestline {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    color: var(--muted); font-size: 12.5px; padding: 2px 2px;
  }
  .digestline b { font-weight: var(--w-emph); color: var(--ink); font-variant-numeric: tabular-nums; }
  .digestline .chev { color: var(--faint); font-size: 10px; }
  .digest { display: none; flex-direction: column; opacity: 0.82; padding-top: 6px; }
  .digest.open { display: flex; }
  .ditem { display: flex; gap: 12px; align-items: baseline; padding: 5px 2px; font-size: 12.5px; }
  .ditem .when { font-family: var(--mono); font-size: 11px; color: var(--faint); width: 44px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .ditem .glyph { flex: none; width: 14px; text-align: center; font-size: 11.5px; }
  .ditem .more { color: var(--faint); }

  /* ============ Variant A: briefing ============ */
  .va { max-width: 760px; display: flex; flex-direction: column; }
  .va .lane { margin-bottom: 30px; }
  .va .lane > .lane-label { margin-bottom: 10px; }
  .va .focuswrap { display: flex; flex-direction: column; gap: 8px; }
  .va .focusnav {
    display: flex; align-items: center; gap: 8px;
    color: var(--faint); font-size: 12px;
  }
  .va .focusnav .ct { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
  .va .focusnav .qbtn { padding: 4px 8px; }
  .va .nextpeek { color: var(--faint); font-size: 12px; padding: 2px 4px; }
  .va .nextpeek b { color: var(--muted); font-weight: var(--w-emph); }
  .va .alldone {
    border: 1px solid var(--line-soft); border-radius: 10px; padding: 14px 18px;
    color: var(--muted); font-size: 13px; background: var(--surface);
  }
  .va .tier { margin-top: 14px; }
  .va .tier:first-of-type { margin-top: 0; }
  .va .tier > .lane-label { margin-bottom: 2px; }

  /* ============ Variant B: ledger ============ */
  .vb { max-width: 1000px; display: flex; flex-direction: column; gap: 26px; }
  .vb .decisions { display: flex; flex-direction: column; gap: 6px; }
  .vb .decisions > .lane-label { margin-bottom: 4px; }
  .vb .book {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--card-shadow); overflow: hidden;
  }
  .vb .book h2 {
    margin: 0; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); padding: 9px 16px 7px; border-bottom: 1px solid var(--line-soft);
    display: flex; gap: 9px; align-items: center; font-weight: var(--w-emph);
  }
  .vb .book h2 .n { font-family: var(--mono); color: var(--faint); letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .vb .book .strand { padding: 9px 16px; }
  .vb .book .strand.open .detail { margin-left: 26px; background: var(--bg); }
  .vb .landedlane { padding: 4px 2px 0; }

  /* ============ Variant C: strands + pulse rail ============ */
  .vc { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 40px; align-items: start; max-width: 1080px; }
  .vc .maincol { display: flex; flex-direction: column; }
  .vc .maincol .lane { margin-bottom: 28px; }
  .vc .maincol .lane > .lane-label { margin-bottom: 10px; }
  .vc .needstrand { display: flex; flex-direction: column; gap: 8px; }
  .vc .cstrand {
    background: var(--raised); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--lift-shadow);
    padding: 11px 16px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .vc .cstrand .top { display: flex; align-items: center; gap: 10px; }
  .vc .cstrand .name { font-weight: var(--w-emph); font-size: 13.5px; }
  .vc .cstrand[data-pri="urgent"] .name { font-weight: var(--w-urgent); }
  .vc .cstrand .sub { color: var(--faint); font-size: 12px; }
  .vc .cstrand .ask { display: flex; align-items: center; gap: 9px; margin-top: 5px; }
  .vc .cstrand .ask .q { font-weight: var(--w-emph); font-size: 13.5px; color: var(--ink); }
  .vc .cstrand .ask .acts { display: flex; gap: 2px; margin-left: auto; }
  .vc .rail { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 22px; }
  .vc .pblock { display: flex; flex-direction: column; gap: 5px; }
  .vc .pblock > .lane-label { margin-bottom: 3px; }
  .vc .pline { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .vc .pline .mono { font-size: 11px; color: var(--faint); }
  .vc .pline b { font-weight: var(--w-emph); color: var(--ink); }
  .vc .pline .warm { color: var(--attn); }
  .vc .pline .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); flex: none; animation: pulse 2.4s ease-in-out infinite; }
  .vc .pline .idledot { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; }

  /* ============ switcher (not part of the design) ============ */
  .sw {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #17161a; color: #fff;
    border-radius: 999px; padding: 6px 8px;
    display: flex; align-items: center; gap: 4px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    z-index: 50; font-family: var(--mono);
  }
  .sw .label { font-size: 12px; font-weight: 500; padding: 0 8px; min-width: 130px; text-align: center; }
  .sw button {
    background: none; border: 0; color: #fff; cursor: pointer;
    font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px;
  }
  .sw button:hover { background: rgba(255,255,255,0.14); }
  .sw button:focus-visible { outline: 2px solid #9a94e8; outline-offset: 1px; }
  .sw .ds { font-size: 11px; color: #c9c6d0; }
</style>

/* ---------- atom helpers ---------- */
const eqEl = '<span class="eq" title="agent working"><i></i><i></i><i></i></span>';
const dmarkEl = '<span class="dmark" title="decision wanted">◆</span>';
const rmarkEl = '<span class="rmark" title="routine">↻</span>';
const priEl = (pri) => `
  <span class="pri" data-pri="${pri}" title="priority: ${pri}">
    <span class="bars"><i></i><i></i><i></i></span>
  </span>`;
const progEl = (p) => `
  <span class="prog" title="step ${p.done + 1} of ${p.total}">
    ${Array.from({ length: p.total }, (_, i) =>
      `<i class="${i < p.done ? "d" : i === p.done ? "c" : ""}"></i>`).join("")}
    <span class="t">${p.done + 1}/${p.total}</span>
  </span>`;
const qbtns = (arr) =>
  arr.map((a, i) => `<button class="qbtn ${i === 0 ? "first" : ""}">${a}</button>`).join("");
const markFor = (s) => {
  if (s.act === "working") return eqEl;
  if (s.act === "queued") return '<span class="qmark" title="queued"></span>';
  if (s.act === "paused") return '<span class="rmark" style="color:var(--attn)" title="paused">↻</span>';
  if (s.act === "failed") return '<span class="failg">✕</span>';
  return '<span class="okg">✓</span>';
};
const detailMark = (m) => ({
  eq: eqEl, dmark: dmarkEl, ok: '<span class="okg">✓</span>',
  fail: '<span class="failg">✕</span>', q: '<span class="qmark"></span>',
  ref: '<span class="rmark" style="font-size:10px">#</span>',
}[m] || "");
const provWord = { you: "you asked", standing: "standing", routine: "routine" };

function data() { return DATASETS[get("data") === "busy" ? "busy" : "calm"]; }

/* one calm sentence, never stat cards */
function headline(d) {
  const working = d.youAsked.filter((s) => s.act === "working").length +
    d.routine.filter((s) => s.act === "working").length;
  const landed = d.landed.counts.ok + d.landed.counts.fail + d.landed.counts.cancelled;
  const n = d.decisions.length;
  return `<div class="headline">
    ${n ? `<span class="warm">${n} decision${n > 1 ? "s" : ""} wait</span>` : "Nothing needs you"}
    · <b>${working}</b> strands in motion · <b>${landed}</b> outcomes today</div>`;
}

function pulseline(d) {
  const line = (arr) => arr.map((p) =>
    `${p.t}${p.warm ? ` <span class="warm">· ${p.warm}</span>` : ""}`).join(" · ");
  return `<div class="pulseline">
    <span><span class="k">Fleet</span> ${line(d.pulse.fleet)}</span>
    <span><span class="k">Assistants</span> ${line(d.pulse.assistants)}</span>
    <span><span class="k">Intake</span> ${line(d.pulse.intake)}</span>
  </div>`;
}

/* strand row: one line; click expands execution detail */
function strandEl(s, i, tier) {
  const noteQ = (s.ask !== undefined ? dmarkEl + " " : "") + (s.note || "");
  const mid = s.prog ? progEl(s.prog) : "";
  const detail = (s.detail || []).map((dl) => `
    <div class="dl">${detailMark(dl.m)}<span${dl.m === "ref" ? ' class="mono"' : ""}>${dl.t}</span>
      ${dl.acts ? `<span class="acts" style="margin-left:auto">${qbtns(dl.acts)}</span>` : ""}</div>`).join("");
  const dacts = s.dacts ? `<div class="dl"><span class="acts">${qbtns(s.dacts)}</span></div>` : "";
  return `
  <div class="strand" data-pri="${s.pri || "normal"}" data-k="${tier}${i}">
    <div class="row" data-toggle="1">
      <span class="markcell">${markFor(s)}</span>
      <span class="name">${s.name}</span>
      ${s.pri ? priEl(s.pri) : ""}
      <span class="sub">${s.sub}</span>
      ${mid}
      <span class="note"${s.tone ? ` data-tone="${s.tone}"` : ""}>${noteQ}</span>
      <span class="age" data-age="${s.bucket}">${s.age}</span>
    </div>
    <div class="detail">${detail}${dacts}</div>
  </div>`;
}

function landedEl(d) {
  const c = d.landed.counts;
  const items = d.landed.items.map((l) => l.more
    ? `<div class="ditem"><span class="when"></span><span class="glyph"></span><span class="more">${l.t}</span></div>`
    : `<div class="ditem">
        <span class="when">${l.when}</span>
        <span class="glyph ${l.tone === "ok" ? "okg" : l.tone === "fail" ? "failg" : "cang"}">${l.g}</span>
        <span>${l.t}</span>
      </div>`).join("");
  return `
    <div class="digestline" data-digest="1">
      <span class="chev">▸</span>
      <span><b>${c.ok + c.fail + c.cancelled}</b> outcomes today ·
        <span class="okg">✓</span> ${c.ok}${c.fail ? ` · <span class="failg">✕</span> ${c.fail}` : ""}${c.cancelled ? ` · – ${c.cancelled}` : ""}</span>
    </div>
    <div class="digest">${items}</div>`;
}

const dcardEl = (dec) => `
  <div class="dcard" data-pri="${dec.pri}">
    <div class="over">
      <span class="prov">${provWord[dec.prov]}</span>
      <span>${dec.strand}</span>
      ${priEl(dec.pri)}
      <span class="age" data-age="${dec.bucket}" style="margin-left:auto">waiting ${dec.age}</span>
    </div>
    <div class="q">${dmarkEl}<span>${dec.q}</span></div>
    <div class="why">${dec.why}</div>
    <div class="acts">${qbtns(dec.actions)}</div>
  </div>`;

const drowEl = (dec) => `
  <div class="drow" data-pri="${dec.pri}">
    ${dmarkEl}
    <span class="q">${dec.q}</span>
    <span class="why">${provWord[dec.prov]} · ${dec.why}</span>
    <span class="age" data-age="${dec.bucket}">${dec.age}</span>
    <span class="acts">${qbtns(dec.actions.slice(0, 2))}</span>
  </div>`;

/* ---------- Variant A: briefing (decisions one at a time) ---------- */
let focusIdx = 0;
function variantA() {
  const d = data();
  const n = d.decisions.length;
  focusIdx = Math.min(focusIdx, Math.max(0, n - 1));
  const dec = d.decisions[focusIdx];
  const next = d.decisions[focusIdx + 1];
  const focus = n === 0
    ? `<div class="alldone">Nothing needs you.</div>`
    : `<div class="focuswrap">
        ${dcardEl(dec)}
        <div class="focusnav">
          <button class="qbtn" data-fnav="-1" ${focusIdx === 0 ? "disabled" : ""}>&larr;</button>
          <span class="ct">${focusIdx + 1} of ${n}</span>
          <button class="qbtn" data-fnav="1" ${focusIdx === n - 1 ? "disabled" : ""}>&rarr;</button>
          ${next ? `<span class="nextpeek">next: <b>${next.q.replace(/<[^>]+>/g, "")}</b> · ${next.age}</span>` : ""}
        </div>
      </div>`;
  return `<div class="va">
    ${headline(d)}
    <section class="lane">
      <div class="lane-label">Needs you <span class="n">${n}</span></div>
      ${focus}
    </section>
    <section class="lane">
      <div class="lane-label" style="margin-bottom:10px">In motion</div>
      <div class="tier">
        <div class="lane-label">You asked <span class="n">${d.youAsked.length}</span></div>
        ${d.youAsked.map((s, i) => strandEl(s, i, "y")).join("")}
      </div>
      <div class="tier">
        <div class="lane-label">Routine <span class="n">${d.routine.length}</span></div>
        ${d.routine.map((s, i) => strandEl(s, i, "r")).join("")}
      </div>
    </section>
    <section class="lane">${landedEl(d)}</section>
    ${pulseline(d)}
  </div>`;
}

/* ---------- Variant B: ledger (all decisions visible) ---------- */
function variantB() {
  const d = data();
  return `<div class="vb">
    <div>
      ${headline(d)}
      <div class="decisions">
        <div class="lane-label">Needs you <span class="n">${d.decisions.length}</span></div>
        ${d.decisions.map(drowEl).join("")}
      </div>
    </div>
    <div>
      <div class="lane-label" style="margin-bottom:10px">In motion</div>
      <div class="book" style="margin-bottom:12px">
        <h2>You asked <span class="n">${d.youAsked.length}</span></h2>
        ${d.youAsked.map((s, i) => strandEl(s, i, "y")).join("")}
      </div>
      <div class="book">
        <h2>Routine <span class="n">${d.routine.length}</span></h2>
        ${d.routine.map((s, i) => strandEl(s, i, "r")).join("")}
      </div>
    </div>
    <div class="landedlane">${landedEl(d)}</div>
    ${pulseline(d)}
  </div>`;
}

/* ---------- Variant C: strands own their decisions + pulse rail ---------- */
function variantC() {
  const d = data();
  /* strands that raised a question surface it inline, ranked first */
  const asking = [];
  const quiet = [];
  for (const tier of [["y", d.youAsked], ["r", d.routine]]) {
    tier[1].forEach((s, i) => (s.ask !== undefined ? asking : quiet).push([s, i, tier[0]]));
  }
  const askCard = ([s, i, t]) => {
    const dec = d.decisions[s.ask];
    return `
    <div class="cstrand" data-pri="${s.pri || "normal"}">
      <div class="top">
        <span class="markcell">${markFor(s)}</span>
        <span class="name">${s.name}</span>
        ${s.pri ? priEl(s.pri) : ""}
        <span class="sub">${s.sub}</span>
        <span class="age" data-age="${dec.bucket}" style="margin-left:auto">waiting ${dec.age}</span>
      </div>
      <div class="ask">
        ${dmarkEl}
        <span class="q">${dec.q}</span>
        <span class="acts">${qbtns(dec.actions.slice(0, 2))}</span>
      </div>
    </div>`;
  };
  return `<div class="vc">
    <div class="maincol">
      ${headline(d)}
      <section class="lane">
        <div class="lane-label">Needs you <span class="n">${asking.length}</span></div>
        <div class="needstrand">${asking.map(askCard).join("")}</div>
      </section>
      <section class="lane">
        <div class="lane-label">In motion</div>
        ${quiet.map(([s, i, t]) => strandEl(s, i, t)).join("")}
      </section>
      <section class="lane">${landedEl(d)}</section>
    </div>
    <aside class="rail">
      <div class="pblock">
        <div class="lane-label">Fleet</div>
        ${d.pulse.fleet.map((p) => `
          <div class="pline">${p.live ? '<span class="dot"></span>' : '<span class="idledot"></span>'}
            <span>${p.t}${p.warm ? ` <span class="warm">· ${p.warm}</span>` : ""}</span></div>`).join("")}
      </div>
      <div class="pblock">
        <div class="lane-label">Assistants</div>
        ${d.pulse.assistants.map((p) => `
          <div class="pline">${p.idle ? '<span class="idledot"></span>' : '<span class="dot"></span>'}
            <span>${p.t}</span></div>`).join("")}
      </div>
      <div class="pblock">
        <div class="lane-label">Intake</div>
        ${d.pulse.intake.map((p) => `<div class="pline"><span>${p.t}</span></div>`).join("")}
      </div>
    </aside>
  </div>`;
}

];
function params() { return new URLSearchParams(location.search); }
function get(k) { return params().get(k); }
function setParam(k, v) {
  const p = params(); p.set(k, v);
  try { history.replaceState(null, "", "?" + p.toString()); } catch (e) { /* file:// */ }
}
function current() {
  const k = get("variant") || "A";
  const i = variants.findIndex((v) => v.key === k.toUpperCase());
  return i === -1 ? 0 : i;
}
function show(i) {
  const v = variants[(i + variants.length) % variants.length];
  setParam("variant", v.key);
  render();
}
function render() {
  const v = variants[current()];
  document.getElementById("stage").innerHTML = v.render();
  document.getElementById("swlabel").textContent = v.key + " · " + v.name;
  document.getElementById("dsbtn").textContent = get("data") === "busy" ? "busy" : "calm";
  document.getElementById("navcount").textContent = data().decisions.length;
}
document.getElementById("stage").addEventListener("click", (e) => {
  const fnav = e.target.closest("[data-fnav]");
  if (fnav && !fnav.disabled) { focusIdx += +fnav.dataset.fnav; render(); return; }
  if (e.target.closest(".qbtn")) return; /* fake actions do nothing */
  const dg = e.target.closest("[data-digest]");
  if (dg) { dg.nextElementSibling.classList.toggle("open"); return; }
  const row = e.target.closest('[data-toggle="1"]');
  if (row) row.parentElement.classList.toggle("open");
});
function toggleData() {
  setParam("data", get("data") === "busy" ? "calm" : "busy");
  focusIdx = 0;
  render();
}
function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme === "dark" ||
    (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  root.dataset.theme = dark ? "light" : "dark";
}
document.getElementById("prev").addEventListener("click", () => show(current() - 1));
document.getElementById("next").addEventListener("click", () => show(current() + 1));
document.getElementById("dsbtn").addEventListener("click", toggleData);
document.getElementById("theme").addEventListener("click", toggleTheme);
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") show(current() - 1);
  if (e.key === "ArrowRight") show(current() + 1);
  if (e.key === "d") toggleData();
  if (e.key === "t") toggleTheme();
});
render();
</script>
