<!--
  PROTOTYPE - throwaway. Ticket: https://github.com/rogierpennink/hydra/issues/1 -> #20
  ROUND 2. Round 1 was deferred: no design language, no Task nouns. Both now exist
  (#33 -> docs/design-language.md, #29 -> ADR 0019), so this re-runs the same three
  structural variants rebuilt in the pinned Midnight language with settled Task fields
  (priority urgent/high/normal/low, status open/in-progress/done/cancelled, labels,
  provenance refs, one optional project).
  Switch variants with the floating bar, arrow keys, or ?variant=A|B|C. Theme: ◐ or "t".
  Single self-contained HTML file because no app exists yet (spec-stage repo).
  Round 1 lives in git history on this branch (71c0dff).
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydra Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ============ tokens: pinned Midnight (docs/design-language.md) ============ */
  :root {
    --bg:      oklch(94.5% 0.0156 265);
    --surface: oklch(96.7% 0.0125 265);
    --raised:  oklch(100% 0.0078 265);
    --ink:     oklch(23% 0.0100 265);
    --muted:   oklch(48% 0.0156 265);
    --faint:   oklch(66% 0.0156 265);
    --line:      oklch(23% 0.0100 265 / 0.10);
    --line-soft: oklch(23% 0.0100 265 / 0.055);
    --card-shadow: 0 1px 2px rgba(23,26,33,0.05);
    --lift-shadow: 0 1px 2px rgba(23,26,33,0.06), 0 4px 14px rgba(23,26,33,0.06);
    --attn: #8a6116; --fail: #a34e46; --ok: #48745a; --live: #48717f;
    --attn-soft: rgba(138,97,22,0.09);
    --proj-hydra: #7d7ab0; --proj-ops: #a67f92;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:      oklch(20%   0.0288 265);
      --surface: oklch(22.2% 0.0288 265);
      --raised:  oklch(25.5% 0.0259 265);
      --ink:     oklch(90% 0.0080 265);
      --muted:   oklch(68% 0.0288 265);
      --faint:   oklch(50% 0.0288 265);
      --line:      oklch(90% 0.0288 265 / 0.10);
      --line-soft: oklch(90% 0.0288 265 / 0.06);
      --card-shadow: 0 1px 2px rgba(0,0,0,0.35);
      --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05),
                     0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
      --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8;
      --attn-soft: rgba(208,161,71,0.12);
      --proj-hydra: #9490c9; --proj-ops: #bd93a8;
    }
  }
  :root[data-theme="dark"] {
    --bg:      oklch(20%   0.0288 265);
    --surface: oklch(22.2% 0.0288 265);
    --raised:  oklch(25.5% 0.0259 265);
    --ink:     oklch(90% 0.0080 265);
    --muted:   oklch(68% 0.0288 265);
    --faint:   oklch(50% 0.0288 265);
    --line:      oklch(90% 0.0288 265 / 0.10);
    --line-soft: oklch(90% 0.0288 265 / 0.06);
    --card-shadow: 0 1px 2px rgba(0,0,0,0.35);
    --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05),
                   0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
    --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8;
    --attn-soft: rgba(208,161,71,0.12);
    --proj-hydra: #9490c9; --proj-ops: #bd93a8;
  }
  :root {
    --sans: "Onest", -apple-system, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --w-emph: 500;
    --w-urgent: 600;
  }

  /* ============ base ============ */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--mono); }
  .app { display: flex; min-height: 100vh; }

  /* ---------- chrome (shared shell, same across variants) ---------- */
  .side {
    width: 204px; flex: none;
    background: var(--surface);
    border-right: 1px solid var(--line-soft);
    display: flex; flex-direction: column;
    padding: 16px 10px;
    position: sticky; top: 0; height: 100vh;
  }
  .logo { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px 16px; }
  .logo b { font-size: 15px; letter-spacing: 0.01em; font-weight: var(--w-emph); }
  .logo span { font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav a {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 10px; border-radius: 6px;
    color: var(--muted); text-decoration: none; font-size: 13px;
  }
  .nav a.on { background: var(--line-soft); color: var(--ink); font-weight: var(--w-emph); }
  .nav a:not(.on):hover { background: var(--line-soft); }
  .nav a:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .nav .count { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .nav .sep { height: 1px; background: var(--line-soft); margin: 8px 10px; }
  .proto-badge {
    margin-top: auto;
    border: 1px dashed var(--attn); color: var(--attn); background: var(--attn-soft);
    border-radius: 8px; padding: 8px 10px;
    font-family: var(--mono); font-size: 10px; line-height: 1.5;
  }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: baseline; gap: 14px; padding: 24px 32px 0; }
  .topbar h1 { font-size: 18px; margin: 0; letter-spacing: -0.015em; font-weight: var(--w-emph); }
  .topbar .when { color: var(--muted); font-size: 13px; }
  .topbar .when b { color: var(--ink); font-weight: var(--w-emph); }
  #stage { padding: 22px 32px 130px; }

  /* ============ shared atoms (the pinned encodings) ============ */
  .lane-label {
    text-transform: uppercase; letter-spacing: 0.1em;
    font-size: 10.5px; font-weight: var(--w-emph); color: var(--faint);
    display: flex; align-items: center; gap: 8px;
  }
  .lane-label .n { font-family: var(--mono); font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }

  /* priority: shape and ink, never color (urgent 3 ink / high 3 muted / normal 2 muted / low 1 faint) */
  .pri { display: inline-flex; align-items: center; flex: none; }
  .pri .bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 9px; }
  .pri .bars i { width: 2.5px; border-radius: 1px; background: var(--line); }
  .pri .bars i:nth-child(1) { height: 3.5px; }
  .pri .bars i:nth-child(2) { height: 6px; }
  .pri .bars i:nth-child(3) { height: 9px; }
  .pri[data-pri="low"]    .bars i:nth-child(1) { background: var(--faint); }
  .pri[data-pri="normal"] .bars i:nth-child(-n+2) { background: var(--muted); }
  .pri[data-pri="high"]   .bars i { background: var(--muted); }
  .pri[data-pri="urgent"] .bars i { background: var(--ink); }

  /* state: 6px dot + tinted word; done/ok collapses to the ✓ glyph */
  .state { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 12px; font-weight: 500; }
  .state .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--faint); }
  .state[data-tone="live"] .dot { background: var(--live); animation: pulse 2.4s ease-in-out infinite; }
  .state[data-tone="ok"]   .dot { display: none; }
  .state[data-tone="ok"]::before { content: "✓"; font-size: 11.5px; color: var(--ok); }
  .state[data-tone="cancelled"] .dot { display: none; }
  .state[data-tone="cancelled"]::before { content: "–"; color: var(--faint); }
  .state[data-tone="warn"] .dot { background: var(--attn); }
  .state[data-tone="fail"] .dot { background: var(--fail); }
  .state[data-tone="live"] { color: var(--live); }
  .state[data-tone="ok"], .state[data-tone="cancelled"] { color: var(--muted); }
  .state[data-tone="warn"] { color: var(--attn); }
  .state[data-tone="fail"] { color: var(--fail); }
  @keyframes pulse { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .state .dot { animation: none !important; } }

  /* waiting-time: the age label darkens, then warms */
  .age {
    font-family: var(--mono); font-size: 11.5px; white-space: nowrap;
    color: var(--faint); flex: none; font-variant-numeric: tabular-nums;
  }
  .age[data-age="recent"] { color: var(--muted); }
  .age[data-age="stale"]  { color: var(--ink); }
  .age[data-age="old"]    { color: var(--attn); font-weight: 500; }

  /* quiet decision affordances - pinned principle from #20 round 1 */
  .qbtn {
    font-family: var(--sans); font-size: 12px; line-height: 1; font-weight: var(--w-emph);
    border: 0; background: none; color: var(--muted);
    padding: 6px 9px; border-radius: 6px; cursor: pointer;
  }
  .qbtn:hover { background: var(--line-soft); color: var(--ink); }
  .qbtn.first { color: var(--ink); }
  .qbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }

  /* lineage: plain-text breadcrumbs; project dots on group headers only */
  .proj { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .pdot { width: 7px; height: 7px; border-radius: 2.5px; flex: none; }
  .pdot[data-proj="hydra"] { background: var(--proj-hydra); }
  .pdot[data-proj="ops"] { background: var(--proj-ops); }

  .ref { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  code {
    font-family: var(--mono); font-size: 12px;
    background: var(--line-soft); padding: 1px 5px; border-radius: 4px; font-weight: 400;
  }
  .divider {
    display: flex; align-items: center; gap: 12px;
    color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 10px 0;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }

  /* needs-you card: the lit stage (--raised + hairline + lift) */
  .need {
    background: var(--raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 13px 18px;
    box-shadow: var(--lift-shadow);
    display: flex; flex-direction: column; gap: 3px;
  }
  .need .head { display: flex; align-items: baseline; gap: 10px; font-size: 12px; }
  .need .kind {
    font-weight: var(--w-emph); text-transform: uppercase; letter-spacing: 0.08em;
    font-size: 10.5px; color: var(--muted);
  }
  .need[data-tone="warn"] .kind { color: var(--attn); }
  .need[data-tone="fail"] .kind { color: var(--fail); }
  .need .title { font-weight: var(--w-emph); font-size: 14px; letter-spacing: -0.006em; }
  .need[data-pri="urgent"] .title { font-size: 15px; font-weight: var(--w-urgent); }
  .need .ctx { color: var(--muted); font-size: 12.5px; }
  .need .acts { display: flex; gap: 4px; margin-top: 9px; margin-left: -9px; }

  /* digest item: history steps back */
  .digest { display: flex; flex-direction: column; opacity: 0.82; }
  .ditem {
    display: flex; gap: 14px; align-items: baseline;
    padding: 7px 4px; border-bottom: 1px solid var(--line-soft);
  }
  .ditem:last-child { border-bottom: 0; }
  .ditem .when { font-family: var(--mono); font-size: 11px; color: var(--faint); width: 88px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .ditem .glyph { flex: none; width: 14px; text-align: center; font-size: 11.5px; color: var(--faint); position: relative; top: 1px; }
  .ditem[data-tone="fail"] .glyph { color: var(--fail); }
  .ditem[data-tone="ok"] .glyph { color: var(--ok); }
  .ditem .txt { flex: 1; font-size: 12.5px; }
  .ditem .txt b { font-weight: var(--w-emph); }
  .ditem .ref { margin-left: 6px; }

  /* ============ Variant A: attention stack ============ */
  /* One column ordered by urgency: needs-you (lit) -> running -> landed digest.
     The page IS a priority queue; clearing the top is the primary affordance. */
  .va { display: flex; flex-direction: column; gap: 34px; max-width: 860px; }
  .va .lane { display: flex; flex-direction: column; gap: 10px; }
  .va .lane > .lane-label { margin-bottom: 2px; }
  .va .runrow {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--card-shadow);
    padding: 10px 16px;
    display: flex; align-items: center; gap: 14px;
  }
  .va .runrow .body { flex: 1; min-width: 0; }
  .va .runrow .name { font-weight: var(--w-emph); font-size: 13.5px; letter-spacing: -0.004em; }
  .va .runrow .sub { color: var(--muted); font-size: 12px; }
  .va .runrow .now { color: var(--muted); font-size: 12.5px; }

  /* ============ Variant B: delegation ledger ============ */
  /* Everything delegated as one book, grouped by project; state inline per strand.
     Scanning is the primary affordance; attention rows sit on the raised layer. */
  .vb { display: flex; flex-direction: column; gap: 16px; max-width: 1060px; }
  .vb .stats { display: flex; gap: 26px; padding: 2px 2px 0; }
  .vb .stat { display: flex; align-items: baseline; gap: 8px; }
  .vb .stat .v { font-family: var(--mono); font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .vb .stat .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--faint); font-weight: var(--w-emph); }
  .vb .stat .v[data-tone="warn"] { color: var(--attn); }
  .vb .stat .v[data-tone="live"] { color: var(--live); }
  .vb .group {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; box-shadow: var(--card-shadow);
  }
  .vb .group > h2 {
    margin: 0; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); padding: 10px 18px 8px; border-bottom: 1px solid var(--line-soft);
    display: flex; gap: 9px; align-items: center; font-weight: var(--w-emph);
  }
  .vb .group > h2 .n { font-family: var(--mono); color: var(--faint); letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .vb .rowwrap { overflow-x: auto; }
  .vb .lrow {
    display: grid;
    grid-template-columns: minmax(230px, 1.1fr) 40px 138px minmax(240px, 1.4fr) minmax(120px, auto) 52px;
    gap: 14px; align-items: center;
    padding: 10px 18px; border-top: 1px solid var(--line-soft);
    min-width: 900px;
  }
  .vb .lrow:first-child { border-top: 0; }
  .vb .lrow[data-hot="1"] { background: var(--raised); }
  .vb .lrow .what .name { font-weight: var(--w-emph); font-size: 13.5px; letter-spacing: -0.004em; }
  .vb .lrow[data-pri="urgent"] .what .name { font-weight: var(--w-urgent); }
  .vb .lrow[data-pri="low"] .what .name { font-weight: 500; font-size: 13px; }
  .vb .lrow[data-pri="low"], .vb .lrow[data-done="1"] { opacity: 0.66; }
  .vb .lrow .what .sub { color: var(--muted); font-size: 12px; }
  .vb .lrow .now { color: var(--muted); font-size: 12.5px; }
  .vb .lrow .now b { color: var(--ink); font-weight: var(--w-emph); }
  .vb .lrow .acts { display: flex; gap: 2px; justify-content: flex-end; margin: -4px 0; }
  .vb .lrow .age { text-align: right; }

  /* ============ Variant C: catch-up feed ============ */
  /* Live rail pinned left; reverse-chron feed right. Needs-you items are lit
     interruptions in the stream; a divider marks the last check-in.
     Catch-up reading is the primary affordance. */
  .vc { display: grid; grid-template-columns: 288px minmax(0, 1fr); gap: 28px; align-items: start; max-width: 1080px; }
  .vc .rail { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 18px; }
  .vc .rail > .lane-label { margin-bottom: 2px; }
  .vc .railcard {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--card-shadow);
    padding: 10px 13px; display: flex; flex-direction: column; gap: 2px;
  }
  .vc .railcard .name { font-weight: var(--w-emph); font-size: 13px; letter-spacing: -0.004em; }
  .vc .railcard .sub { color: var(--muted); font-size: 12px; }
  .vc .railcard .act { color: var(--faint); font-size: 11.5px; font-family: var(--mono); }
  .vc .feed { display: flex; flex-direction: column; }
  .vc .feed > .lane-label { padding-bottom: 14px; }
  .vc .fitem { display: flex; gap: 0; position: relative; padding: 0 0 16px 30px; }
  .vc .fitem::before {
    content: ""; position: absolute; left: 7px; top: 20px; bottom: -4px;
    width: 1px; background: var(--line-soft);
  }
  .vc .fitem:last-child::before, .vc .fitem[data-last="1"]::before { display: none; }
  .vc .fitem .node {
    position: absolute; left: 0; top: 2px;
    width: 15px; text-align: center;
    font-size: 11.5px; color: var(--faint);
  }
  .vc .fitem .node .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--faint); position: relative; top: -1px;
  }
  .vc .fitem[data-tone="ok"] .node { color: var(--ok); }
  .vc .fitem[data-tone="fail"] .node { color: var(--fail); }
  .vc .fitem[data-tone="warn"] .node .dot { background: var(--attn); }
  .vc .fitem[data-tone="fail"] .node .dot { background: var(--fail); }
  .vc .fitem .body { flex: 1; min-width: 0; }
  .vc .fitem .whenline { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-bottom: 1px; font-variant-numeric: tabular-nums; }
  .vc .fitem .txt { font-size: 13px; }
  .vc .fitem .txt b { font-weight: var(--w-emph); }
  .vc .fitem.seen { opacity: 0.82; }
  .vc .fneed { margin: 3px 0 4px; }
  .vc .divider { padding: 2px 0 18px; }

  /* ============ switcher (not part of the design) ============ */
  .sw {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #17161a; color: #fff;
    border-radius: 999px; padding: 6px 8px;
    display: flex; align-items: center; gap: 4px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    z-index: 50; font-family: var(--mono);
  }
  .sw .label { font-size: 12px; font-weight: 500; padding: 0 8px; min-width: 176px; text-align: center; }
  .sw button {
    background: none; border: 0; color: #fff; cursor: pointer;
    font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px;
  }
  .sw button:hover { background: rgba(255,255,255,0.14); }
  .sw button:focus-visible { outline: 2px solid #9a94e8; outline-offset: 1px; }
</style>

<div class="app">
  <aside class="side">
    <div class="logo"><b>Hydra</b><span>v1 · rogier</span></div>
    <nav class="nav">

<script>
/* One shared fake dataset (Task nouns per ADR 0019); three structural layouts.
   priority: urgent | high | normal | low. status: open | in-progress | done | cancelled. */
const data = {
  needsYou: [
    { tone: "warn", kind: "Approval", age: "6m", ageBucket: "fresh", pri: "urgent",
      lineage: "hydra · Fix flaky webhook tests",
      title: 'Session wants to run <code>git push origin fix/webhook-retries</code>',
      ctx: 'Claude Code on hetzner-01 · approval-required · <span class="ref">github:issue:rogierpennink/hydra#112</span>',
      actions: ["Approve", "Deny", "Open session"] },
    { tone: "warn", kind: "Permission", age: "18m", ageBucket: "recent", pri: "high",
      lineage: "hydra · Refactor event pipeline",
      title: 'Permission request: <code>infra</code> grant',
      ctx: "profile worker lacks infra (wants to drain runner hetzner-01)",
      actions: ["Grant for session", "Add to profile", "Deny"] },
    { tone: "warn", kind: "Breaker", age: "41m", ageBucket: "stale", pri: "high",
      lineage: "Operations · Email triage",
      title: "&ldquo;Email triage&rdquo; trigger paused &ndash; spawn bound tripped",
      ctx: "gmail/personal · 12 runs in 10 min (bound 10) · 14 matched events held",
      actions: ["Review held events", "Resume trigger"] },
    { tone: "fail", kind: "Run failed", age: "7h", ageBucket: "old", pri: "normal",

const priEl = (pri) => `
  <span class="pri" data-pri="${pri}" title="priority: ${pri}">
    <span class="bars"><i></i><i></i><i></i></span>
  </span>`;
const stateEl = (tone, label) => `
  <span class="state" data-tone="${tone}"><span class="dot"></span><span>${label}</span></span>`;
const qbtns = (arr) =>
  arr.map((a, i) => `<button class="qbtn ${i === 0 ? "first" : ""}">${a}</button>`).join("");
/* compact: kind + age live in the surrounding timeline line (variant C) */
const needCard = (n, compact) => `
  <div class="need" data-tone="${n.tone}" data-pri="${n.pri}">
    <div class="head">
      ${compact ? "" : `<span class="kind">${n.kind}</span>`}
      <span class="proj">${n.lineage}</span>
      ${priEl(n.pri)}
      ${compact ? "" : `<span class="age" data-age="${n.ageBucket}" style="margin-left:auto">waiting ${n.age}</span>`}
    </div>
    <div class="title">${n.title}</div>
    <div class="ctx">${n.ctx}</div>
    <div class="acts">${qbtns(n.actions)}</div>
  </div>`;

/* ---------- Variant A: attention stack ---------- */
function variantA() {
  const running = data.running.map((r) => `
    <div class="runrow">
      ${stateEl("live", r.state)}
      <div class="body">
        <span class="name">${r.name}</span>
        <span class="sub" style="margin-left:8px">${r.sub}</span>
        <div class="now">${r.now}</div>
      </div>
      <span class="age" data-age="${r.ageBucket}">${r.age}</span>
    </div>`).join("");
  const fresh = data.landed.filter((l) => !l.when.startsWith("yest"));
  const seen = data.landed.filter((l) => l.when.startsWith("yest"));
  const ditem = (l) => `
    <div class="ditem" data-tone="${l.tone}">
      <span class="when">${l.when}</span>
      <span class="glyph">${l.glyph}</span>
      <span class="txt">${l.text}<span class="ref">${l.ref}</span></span>
    </div>`;
  return `<div class="va">
    <section class="lane">
      <div class="lane-label">Needs you <span class="n">${data.needsYou.length}</span></div>
      ${data.needsYou.map(needCard).join("")}
    </section>
    <section class="lane">
      <div class="lane-label">Running now <span class="n">${data.running.length}</span></div>
      ${running}
    </section>
    <section class="lane">
      <div class="lane-label">Since you last checked <span class="n">${data.landed.length}</span></div>
      <div class="digest">
        ${fresh.map(ditem).join("")}
        <div class="divider">last check-in · yesterday 18:40</div>
        ${seen.map(ditem).join("")}
      </div>
    </section>
  </div>`;
}

/* ---------- Variant B: delegation ledger ---------- */
function variantB() {
  const stat = (v, k, tone) => `
    <div class="stat"><span class="v"${tone ? ` data-tone="${tone}"` : ""}>${v}</span><span class="k">${k}</span></div>`;
  const row = (r) => `
    <div class="lrow" data-pri="${r.pri}"${r.hot ? ' data-hot="1"' : ""}${r.done ? ' data-done="1"' : ""}>
      <div class="what">
        <div class="name">${r.name}</div>
        <div class="sub">${r.sub}</div>
      </div>
      ${priEl(r.pri)}
      ${stateEl(r.tone, r.state)}
      <div class="now">${r.now}</div>
      <div class="acts">${r.actions ? qbtns(r.actions) : ""}</div>
      <span class="age" data-age="${r.ageBucket}">${r.age}</span>
    </div>`;
  const group = (g) => `
    <div class="group">
      <h2><span class="pdot" data-proj="${g.proj}"></span>${g.name} <span class="n">${g.rows.length}</span></h2>
      <div class="rowwrap">${g.rows.map(row).join("")}</div>
    </div>`;
  return `<div class="vb">
    <div class="stats">
      ${stat(4, "need you", "warn")}
      ${stat(4, "running", "live")}
      ${stat(7, "landed since check-in")}
      ${stat(2, "runners online")}
    </div>
    ${data.groups.map(group).join("")}
  </div>`;
}

/* ---------- Variant C: catch-up feed ---------- */
function variantC() {
  const rail = data.running.map((r) => `
    <div class="railcard">
      <div class="name">${r.name}</div>
      <div class="sub">${r.sub}</div>
      ${stateEl("live", r.state)}
      <div class="act">${r.now.replace(/<[^>]+>/g, "")}</div>
    </div>`).join("");
  const needs = data.needsYou.map((n, i) => `
    <div class="fitem" data-tone="${n.tone}"${i === data.needsYou.length - 1 ? ' data-last="1"' : ""}>
      <span class="node"><span class="dot"></span></span>
      <div class="body">
        <div class="whenline age" data-age="${n.ageBucket}" style="width:auto;text-align:left">waiting ${n.age} · ${n.kind.toLowerCase()}</div>
        <div class="fneed">${needCard(n, true)}</div>
      </div>
    </div>`).join("");
  const fresh = data.landed.filter((l) => !l.when.startsWith("yest"));
  const seen = data.landed.filter((l) => l.when.startsWith("yest"));
  const feedItem = (l, extra) => `
    <div class="fitem${extra ? " " + extra : ""}" data-tone="${l.tone}">
      <span class="node">${l.glyph === "" ? '<span class="dot"></span>' : l.glyph}</span>
      <div class="body">
        <div class="whenline">${l.when}</div>
        <div class="txt">${l.text} <span class="ref">${l.ref}</span></div>
      </div>
    </div>`;
  return `<div class="vc">
    <aside class="rail">
      <div class="lane-label">Happening now <span class="n">${data.running.length}</span></div>
      ${rail}
    </aside>
    <div class="feed">
      <div class="lane-label">Waiting on you <span class="n">${data.needsYou.length}</span></div>
      ${needs}
      <div class="lane-label" style="padding:4px 0 14px">Landed <span class="n">${data.landed.length}</span></div>
      ${fresh.map((l) => feedItem(l)).join("")}
      <div class="divider">last check-in · yesterday 18:40</div>
      ${seen.map((l) => feedItem(l, "seen")).join("")}
    </div>
  </div>`;
}

/* ---------- switcher + theme (not part of the design) ---------- */
const variants = [
  { key: "A", name: "Attention stack", render: variantA },
  { key: "B", name: "Delegation ledger", render: variantB },
  { key: "C", name: "Catch-up feed", render: variantC },
];
function current() {
  const k = new URLSearchParams(location.search).get("variant") || "A";
  const i = variants.findIndex((v) => v.key === k.toUpperCase());
  return i === -1 ? 0 : i;
}
function show(i) {
  const v = variants[(i + variants.length) % variants.length];
  try { history.replaceState(null, "", "?variant=" + v.key); } catch (e) { /* file:// */ }
  document.getElementById("stage").innerHTML = v.render();
  document.getElementById("swlabel").textContent = v.key + " · " + v.name;
}
function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme === "dark" ||
    (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  root.dataset.theme = dark ? "light" : "dark";
}
document.getElementById("prev").addEventListener("click", () => show(current() - 1));
document.getElementById("next").addEventListener("click", () => show(current() + 1));
document.getElementById("theme").addEventListener("click", toggleTheme);
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") show(current() - 1);
  if (e.key === "ArrowRight") show(current() + 1);
  if (e.key === "t") toggleTheme();
});
show(current());
</script>
