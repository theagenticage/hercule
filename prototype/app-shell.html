<!--
  PROTOTYPE - throwaway. Ticket: https://github.com/rogierpennink/hydra/issues/1 -> #51
  Question: the app shell. Spec 14 pins Sessions as home, a t3-code-like first minute and the screen
  inventory, but not the frame the screens sit in:
    1. what the sidebar is - a threads/projects list (t3-code mode) vs the orchestration nav
       (Intake, Check-in, Tasks, Runs, Workflows, Fleet, Connections, Notifications, Settings),
       when each shows, how the user moves between them without "management chrome" bolted on;
    2. where the Marks legend toggle and pulse-style ambient signals live in that frame;
    3. how the empty states of Sessions, Intake and Notifications carry first-run guidance
       (provider login, connect GitHub / Gmail, connect a chat channel) without a checklist page.

  Shells, switchable via ?variant=A|B|C (same screens, same data, only the frame changes):
    A Nav    - one orchestration sidebar always; threads are a list column inside Sessions.
               REJECTED in round 1 (kept switchable as the record).
    B Modes  - the sidebar has two faces behind a segmented switch: Threads (t3-code list: create,
               projects, threads, assistants) and Hydra (the orchestration nav). The face follows
               the screen; the needs-you count leaks into the Hydra segment so it never hides.
    C Stack  - one sidebar, two regions. ?stack=bottom|top|split (key s): Hydra group below the
               threads (round 1), above them (Codex order), or split - the five work items above,
               the four infrastructure items at the foot beside Marks.
  Round 2 (reaction to round 1):
    - thread rows: ?rows=plain|meta|rich (key r) - one line; a second faint mono line (checkout ·
      model); active threads as a small card (state line, title, branch/PR, provider), settled plain.
    - new thread is one step: Create new thread opens the thread surface in new-thread mode; the
      first message starts it. The composer holds the whole configuration: a config strip
      (workspace · checkout · branch · runner · profile) that turns read-only once started, and the
      control row (model · effort · access mode) that stays live.
    - thread surface rebuilt in the Codex / t3-code shape: centered column, timestamp, user messages
      right-aligned bubbles, agent prose full width, "Worked for" dividers, changed-files cards, the
      approval ledger inline, composer floating at the bottom.
    - All sessions is a full overview page: Active / Waiting on you / Idle / Settled with a project
      filter; workflow-started sessions behind a fold.
  Round 3 (reaction to round 2):
    - C Stack defaults to ?stack=compact: only Intake / Check-in / Notifications as rows above the
      threads, the other six screens as one quiet text line at the foot. top/bottom/split stay.
    - chat input variants ?input=hydra|t3|codex (key i): the round-2 strip+row; a t3-code lookalike
      (one card, options inside, checkout lip under it); a Codex lookalike (config tabs above,
      + and access mode left, model pill and round send right).
    - new-thread layout ?hero=bottom|center (key h).
    - permission requests dock onto the input (same place always), in every input variant.
    - "Worked for Xs ›" collapses the tool calls (click expands); the live one shimmers.
  Round 4 (reaction to round 3: model, reasoning strength and runner selectors were missing):
    - every selector on the input opens a menu (one popover, anchored above the control, the same in
      all three input variants): runner (the placement pick: each machine's state, capacity and the
      provider logins it holds; a machine without the current login is dimmed with the reason), model
      (grouped per provider instance = one login, identity and plan under the heading; models not logged
      in on the picked runner are dimmed; Custom model… at the foot; switching runner shows "probing …"
      while that machine's snapshot refreshes), access mode (auto dimmed on pi with its fallback),
      permission profile.
    - reasoning strength: ?effort=own|nested (key e) - its own selector in the control row (default),
      or a segmented row inside the model menu (the Codex shape), the model label then carrying it.
      Context window and fast mode sit in the model menu's options block either way; pi shows thinking
      off/on instead of effort - the well-known option ids of spec 06 differ per provider.
    - picks live in memory: new-thread picks start the thread with them; on a started thread runner and
      profile are locked, model / reasoning / access mode stay live.
  Ambient signals (pulse): ?pulse=top|foot|none (key p). Default: A top bar, B/C sidebar foot.
  Data: ?data=busy|fresh (key d). fresh = first run; ?li=1 = a provider login has happened (key l).
  Keys: ← → shell · s stack (C) · r rows · i input · h hero · m mode (B) · d data · l login · p pulse · t theme · ? Marks · Esc.
  Marks are the pinned family (#35); everything in the pinned design language (#33).
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydra app shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg:      oklch(94.5% 0.0156 265);
    --surface: oklch(96.7% 0.0125 265);
    --raised:  oklch(100% 0.0078 265);
    --ink:     oklch(23% 0.0100 265);
    --muted:   oklch(48% 0.0156 265);
    --faint:   oklch(66% 0.0156 265);
    --line:      oklch(23% 0.0100 265 / 0.10);
    --line-soft: oklch(23% 0.0100 265 / 0.055);
    --card-shadow: 0 1px 2px rgba(23,26,33,0.05);
    --lift-shadow: 0 1px 2px rgba(23,26,33,0.06), 0 4px 14px rgba(23,26,33,0.06);
    --attn: #8a6116; --fail: #a34e46; --ok: #48745a; --live: #48717f;
    --attn-soft: rgba(138,97,22,0.09);
    --p-hydra: #7d7ab0; --p-ops: #a67f92;
    --sans: "Onest", -apple-system, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --w-emph: 500; --w-urgent: 600;
    --side-w: 236px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:      oklch(20%   0.0288 265);
      --surface: oklch(22.2% 0.0288 265);
      --raised:  oklch(25.5% 0.0259 265);
      --ink:     oklch(90% 0.0080 265);
      --muted:   oklch(68% 0.0288 265);
      --faint:   oklch(50% 0.0288 265);
      --line:      oklch(90% 0.0288 265 / 0.10);
      --line-soft: oklch(90% 0.0288 265 / 0.06);
      --card-shadow: 0 1px 2px rgba(0,0,0,0.35);
      --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
      --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8;
      --attn-soft: rgba(208,161,71,0.12);
      --p-hydra: #9490c9; --p-ops: #bd93a8;
    }
  }
  :root[data-theme="dark"] {
    --bg:      oklch(20%   0.0288 265);
    --surface: oklch(22.2% 0.0288 265);
    --raised:  oklch(25.5% 0.0259 265);
    --ink:     oklch(90% 0.0080 265);
    --muted:   oklch(68% 0.0288 265);
    --faint:   oklch(50% 0.0288 265);
    --line:      oklch(90% 0.0288 265 / 0.10);
    --line-soft: oklch(90% 0.0288 265 / 0.06);
    --card-shadow: 0 1px 2px rgba(0,0,0,0.35);
    --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
    --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8;
    --attn-soft: rgba(208,161,71,0.12);
    --p-hydra: #9490c9; --p-ops: #bd93a8;
  }

  /* ============ base ============ */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; }
  b { font-weight: var(--w-emph); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .app { display: flex; min-height: 100vh; }
  .lane-label { text-transform: uppercase; letter-spacing: 0.1em; font-size: 10.5px; color: var(--faint); font-weight: var(--w-emph); display: flex; align-items: baseline; gap: 8px; }
  .lane-label .n { font-family: var(--mono); letter-spacing: 0; text-transform: none; font-weight: 400; }
  .lane-label .r { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 400; font-family: var(--mono); font-size: 10.5px; }
  .pdot { width: 7px; height: 7px; border-radius: 2px; display: inline-block; flex: none; vertical-align: 0; }
  .pdot.hydra { background: var(--p-hydra); } .pdot.ops { background: var(--p-ops); } .pdot.none { background: var(--line); }

  /* ============ marks (pinned family, #35) ============ */
  .markcell { width: 16px; flex: none; display: inline-flex; justify-content: center; align-items: center; font-size: 12px; }
  .ent { display: inline-flex; width: 14px; justify-content: center; align-items: center; flex: none; vertical-align: -2px; color: var(--faint); }
  svg.bs { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
  svg.bs.q { stroke-width: 1.35; }
  .okg { color: var(--ok); } .failg { color: var(--fail); } .cang { color: var(--faint); } .attn { color: var(--attn); } .livec { color: var(--live); }
  .eq { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 9px; width: 11px; flex: none; }
  .eq i { width: 2px; border-radius: 1px; background: var(--live); height: 4px; animation: eqs 1.9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: 0.35s; } .eq i:nth-child(3) { animation-delay: 0.7s; }
  @keyframes eqs { 0%, 100% { height: 3px; } 50% { height: 7px; } }
  .livedot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); flex: none; animation: pulse 2.4s ease-in-out infinite; display: inline-block; }
  .attndot { width: 6px; height: 6px; border-radius: 50%; background: var(--attn); flex: none; animation: pulse 2.4s ease-in-out infinite; display: inline-block; }
  .idledot { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; display: inline-block; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) {
    .eq i, .livedot, .attndot { animation: none !important; }
    .eq i:nth-child(1) { height: 4px; } .eq i:nth-child(2) { height: 8px; } .eq i:nth-child(3) { height: 5px; }
  }
  .pri { display: inline-flex; align-items: center; flex: none; }
  .pri .bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 9px; }
  .pri .bars i { width: 2.5px; border-radius: 1px; background: var(--line); }
  .pri .bars i:nth-child(1) { height: 3.5px; } .pri .bars i:nth-child(2) { height: 6px; } .pri .bars i:nth-child(3) { height: 9px; }
  .pri[data-pri="low"]    .bars i:nth-child(1) { background: var(--faint); }
  .pri[data-pri="normal"] .bars i:nth-child(-n+2) { background: var(--muted); }
  .pri[data-pri="high"]   .bars i { background: var(--muted); }
  .pri[data-pri="urgent"] .bars i { background: var(--ink); }
  .age { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
  .age[data-age="recent"] { color: var(--muted); } .age[data-age="stale"] { color: var(--ink); } .age[data-age="old"] { color: var(--attn); font-weight: 500; }
  .state { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .state.live { color: var(--live); } .state.fail { color: var(--fail); } .state.attn { color: var(--attn); }
  .qbtn { font-family: var(--sans); font-size: 12.5px; line-height: 1; font-weight: var(--w-emph); border: 0; background: none; color: var(--muted); padding: 6px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .qbtn:hover { background: var(--line-soft); color: var(--ink); }
  .qbtn.first { color: var(--ink); }
  .qbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  code { font-family: var(--mono); font-size: 12px; background: var(--line-soft); padding: 1px 5px; border-radius: 4px; }

  /* ============ the shell ============ */
  .side { width: var(--side-w); flex: none; background: var(--surface); border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; padding: 14px 10px 12px; position: sticky; top: 0; height: 100vh; }
  .logo { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px 14px; }
  .logo b { font-size: 15px; letter-spacing: 0.01em; }
  .logo span { font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav a { display: flex; align-items: center; gap: 9px; padding: 5px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 13px; cursor: pointer; }
  .nav a .ni { width: 14px; display: inline-flex; justify-content: center; align-items: center; flex: none; color: var(--faint); }
  .nav a .ni:empty { display: none; }
  .nav a.on { background: var(--line-soft); color: var(--ink); font-weight: var(--w-emph); }
  .nav a.on .ni { color: var(--ink); }
  .nav a:not(.on):hover { background: var(--line-soft); }
  .nav a:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .nav .count { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; margin-left: auto; }
  .nav .count.attn { color: var(--attn); }
  .nav .sep { height: 1px; background: var(--line-soft); margin: 8px 10px; }
  .sidefoot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding-top: 10px; }
  .side .glabel { padding: 0 10px; margin: 6px 0 4px; }
  .side .glabel a { text-decoration: none; cursor: pointer; }
  .side .glabel a:hover { color: var(--muted); }
  /* thread list (t3-code face) */
  .newbtn { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised); color: var(--ink); font-size: 13px; font-weight: var(--w-emph); cursor: pointer; box-shadow: var(--card-shadow); text-align: left; width: 100%; }
  .newbtn:hover { box-shadow: var(--lift-shadow); }
  .newbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .newbtn .plus { font-family: var(--mono); color: var(--faint); font-size: 13px; }
  .tlist { display: flex; flex-direction: column; gap: 1px; }
  .trow { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 8px; border-radius: 6px; color: var(--muted); font-size: 13px; text-decoration: none; cursor: pointer; }
  .trow .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow.on { background: var(--line-soft); color: var(--ink); font-weight: var(--w-emph); }
  .trow:not(.on):hover { background: var(--line-soft); }
  .trow.dim { opacity: 0.66; }
  .trow .markcell { width: 14px; }
  /* rows=meta: a second faint mono line */
  .trow2 { display: flex; flex-direction: column; gap: 0; padding: 4px 10px 5px 8px; border-radius: 6px; color: var(--muted); cursor: pointer; }
  .trow2 .l1 { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .trow2 .l1 .markcell { width: 14px; }
  .trow2 .l1 .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow2 .l2 { padding-left: 22px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
  .trow2.on { background: var(--line-soft); color: var(--ink); } .trow2.on .l1 { font-weight: var(--w-emph); }
  .trow2:not(.on):hover { background: var(--line-soft); }
  .trow2.dim { opacity: 0.66; }
  /* rows=rich: active threads as a small card */
  .tcard { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--card-shadow); padding: 7px 10px 8px; margin: 2px 0 5px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
  .tcard:hover { box-shadow: var(--lift-shadow); }
  .tcard.on { border-color: var(--faint); }
  .tcard .st { font-size: 11px; display: flex; align-items: center; gap: 6px; }
  .tcard .st .age { margin-left: auto; }
  .tcard .tt { font-size: 13px; color: var(--ink); font-weight: var(--w-emph); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tcard .mm { font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side .ghead { display: flex; align-items: center; gap: 7px; padding: 0 10px; margin: 10px 0 3px; font-size: 12px; color: var(--muted); font-weight: var(--w-emph); }
  .side .ghead:first-child { margin-top: 0; }
  .side .ghead .r { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--faint); font-weight: 400; }
  .side .empty { padding: 4px 10px; font-size: 12px; color: var(--faint); }
  .side .more { display: block; padding: 3px 10px; font-size: 12px; color: var(--faint); text-decoration: none; cursor: pointer; border-radius: 6px; }
  .side .more:hover { color: var(--muted); background: var(--line-soft); }
  .scrollreg { overflow: auto; min-height: 0; margin: 0 -4px; padding: 0 4px; }
  /* segmented switch (B) */
  .seg { display: flex; padding: 2px; border-radius: 7px; background: var(--line-soft); margin: 0 0 12px; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 5px; padding: 4px 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
  .seg button.on { background: var(--raised); color: var(--ink); font-weight: var(--w-emph); box-shadow: var(--card-shadow); }
  .seg button:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .seg .count { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .seg .count.attn { color: var(--attn); }
  /* pulse block / line */
  .pulse { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .pulse .pl { display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse .pl b { color: var(--ink); }
  .pulse .pl .w { color: var(--attn); }
  .side .pulse { padding: 0 10px 6px; }
  .topbar .pulse { flex-direction: row; gap: 16px; margin-left: auto; align-self: center; flex: none; }
  /* legend */
  .lgbtn { font-family: var(--sans); font-size: 13px; color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; line-height: 1; width: 100%; text-align: left; }
  .lgbtn:hover, .lgbtn[aria-expanded="true"] { background: var(--line-soft); color: var(--ink); }
  .lgbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .lgbtn kbd { font-family: var(--mono); font-size: 10px; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; line-height: 1.5; margin-left: auto; }
  .legend { position: fixed; z-index: 30; width: 236px; left: calc(var(--side-w) + 8px); bottom: 48px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--lift-shadow); padding: 12px 14px 10px; display: none; flex-direction: column; gap: 2px; }
  .legend.open { display: flex; }
  .legend .lane-label { margin-bottom: 4px; }
  .legend .lgroup { margin-top: 8px; }
  .legend .lrow { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); padding: 2.5px 0; }
  .legend .lrow .markcell { justify-content: flex-start; }
  .legend .note { font-size: 11px; color: var(--faint); margin-top: 8px; border-top: 1px solid var(--line-soft); padding-top: 8px; }
  /* main */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: baseline; gap: 14px; padding: 22px 32px 0; }
  .topbar h1 { font-size: 18px; margin: 0; letter-spacing: -0.015em; font-weight: var(--w-emph); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 44%; }
  .topbar h1 .pj { color: var(--muted); font-weight: 400; }
  .topbar h1 .sl { color: var(--faint); font-weight: 400; margin: 0 8px; }
  .topbar .when { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .topbar .crumb { color: var(--faint); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .topbar .crumb b { color: var(--muted); }
  .topbar .acts { margin-left: auto; display: flex; gap: 2px; align-self: center; flex: none; }
  .topbar .acts .plus { color: var(--ok); font-family: var(--mono); font-weight: 400; } .topbar .acts .minus { color: var(--fail); font-family: var(--mono); font-weight: 400; }
  #stage { padding: 16px 32px 110px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .headline { font-size: 15px; color: var(--muted); margin: 0 0 22px; }
  .headline b { color: var(--ink); }
  .lane { margin-bottom: 28px; }
  .lane > .lane-label { margin-bottom: 10px; }
  .group { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px; padding: 4px 6px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 13.5px; }
  .row:hover { background: var(--line-soft); }
  .row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t small { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .row .t small .mono { font-size: 11px; }
  .row .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .row.dim { opacity: 0.66; }
  .row .qbtn { padding: 4px 8px; margin: -2px 0; }

function go(screenKey, extra = {}) { setParams({ screen: screenKey, thread: null, login: null, mode: null, pj: null, wf: null, ...extra }); }

function cyclePulse() { const o = ["top", "foot", "none"]; setParams({ pulse: o[(o.indexOf(pulsePlace()) + 1) % 3] }); }
function cycleStack() { setParams({ stack: STACKS[(STACKS.indexOf(stack()) + 1) % STACKS.length] }); }
function cycleRows() { setParams({ rows: ROWS[(ROWS.indexOf(rows()) + 1) % ROWS.length] }); }
function cycleInput() { setParams({ input: INPUTS[(INPUTS.indexOf(input()) + 1) % INPUTS.length] }); }
function toggleHero() { setParams({ hero: hero() === "center" ? null : "center" }); }
function toggleEffort() { setParams({ effort: effortPlace() === "own" ? "nested" : null }); }
function startThread() {
  const ta = document.getElementById("compose"); const text = (ta && ta.value.trim()) || "Add a --json flag to hydra runner list so scripts can read it.";
  const id = "c0ffee" + String(STARTED.length + 10);
  const c = cfg(null);
  STARTED.unshift({ id, title: text.length > 42 ? text.slice(0, 40).replace(/\s+\S*$/, "") + "…" : text, first: text, state: "working", age: "now", ws: fresh() ? "no workspace" : "worktree", branch: fresh() ? "" : "hydra/run-" + id.slice(-3), provider: inst(c.instance).provider, model: c.model, runner: runnerOf(c).id, freshData: fresh() });
  LIVE[id] = { instance: c.instance, effort: c.effort, thinking: c.thinking, ctx: c.ctx, fast: c.fast, access: c.access, profile: c.profile };
  delete DRAFTS.new; POP = null;
  setParams({ thread: id });
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-go],[data-thread],[data-login],[data-login-done],[data-send],[data-mode],[data-pj],[data-wf],[data-toggle],[data-pop],[data-pick],#lgtoggle,[data-noop]");
  if (!el) { if (!e.target.closest("#legend")) toggleLegend(false); if (!e.target.closest("#pop")) closePop(); return; }
  e.preventDefault();
  if (el.dataset.pop) return openPop(el.dataset.pop);
  if (el.dataset.pick) return pick(el.dataset.pick, el.dataset.val);
  if (el.id === "lgtoggle") return toggleLegend();
  if (el.dataset.toggle) { const open = el.getAttribute("aria-expanded") !== "true"; el.setAttribute("aria-expanded", String(open)); el.nextElementSibling.classList.toggle("open", open); return; }
  if (el.dataset.go) return go(el.dataset.go, el.dataset.all ? { mode: V() === "B" ? "threads" : null } : {});
  if (el.dataset.thread) return setParams({ screen: "sessions", thread: el.dataset.thread, login: null, mode: null });
  if (el.dataset.login !== undefined) return setParams({ screen: "sessions", thread: null, login: el.dataset.login || null, mode: null });
  if (el.dataset.loginDone) return setParams({ li: "1", login: null });
  if (el.dataset.send === "start") return startThread();
  if (el.dataset.send === "reply") { const ta = document.getElementById("compose"); if (ta) ta.value = ""; delete DRAFTS[threadId()]; return; }
  if (el.dataset.mode) return setParams({ mode: el.dataset.mode });
  if (el.dataset.pj) return setParams({ pj: el.dataset.pj === "all" ? null : el.dataset.pj });
  if (el.dataset.wf !== undefined) return setParams({ wf: el.dataset.wf === "1" ? "1" : null });
});
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.getElementById("dbtn").onclick = () => setParams({ data: fresh() ? null : "fresh", thread: null, login: null, pj: null });
document.getElementById("lbtn").onclick = () => setParams({ li: loggedIn() ? null : "1", login: null });
document.getElementById("pbtn").onclick = cyclePulse;
document.getElementById("sbtn").onclick = cycleStack;
document.getElementById("rbtn").onclick = cycleRows;
document.getElementById("ibtn").onclick = cycleInput;
document.getElementById("ebtn").onclick = toggleEffort;
document.getElementById("hbtn").onclick = toggleHero;
document.getElementById("mbtn").onclick = () => setParams({ mode: mode() === "threads" ? "hydra" : "threads" });
document.getElementById("theme").onclick = toggleTheme;
document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "textarea" && e.key === "Enter" && !e.shiftKey && e.target.id === "compose") { e.preventDefault(); if (threadId() === "new") startThread(); else { e.target.value = ""; delete DRAFTS[threadId()]; } return; }
  if (e.target.id === "custom" && e.key === "Enter") { e.preventDefault(); return pick("custom-go"); }
  if (e.key === "Escape" && POP) { e.target.blur && e.target.blur(); return closePop(); }
  if (tag === "input" || tag === "textarea" || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft") cycle(-1); else if (e.key === "ArrowRight") cycle(1);
  else if (e.key === "d") document.getElementById("dbtn").click();
  else if (e.key === "l") document.getElementById("lbtn").click();
  else if (e.key === "p") cyclePulse();
  else if (e.key === "s" && V() === "C") cycleStack();
  else if (e.key === "r") cycleRows();
  else if (e.key === "i") cycleInput();
  else if (e.key === "e") toggleEffort();
  else if (e.key === "h" && threadId() === "new") toggleHero();
  else if (e.key === "m" && V() === "B") document.getElementById("mbtn").click();
  else if (e.key === "t") toggleTheme();
  else if (e.key === "?") toggleLegend();
  else if (e.key === "Escape") toggleLegend(false);
});
document.addEventListener("input", (e) => { if (e.target.id === "compose") DRAFTS[threadId() === "new" ? "new" : threadId()] = e.target.value; });
render();
</script>
