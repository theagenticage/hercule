<!--
  PROTOTYPE - throwaway. Ticket: https://github.com/rogierpennink/hydra/issues/1 -> #51
  Question: the app shell. Spec 14 pins Sessions as home, a t3-code-like first minute and the screen
  inventory, but not the frame the screens sit in:
    1. what the sidebar is - a threads/projects list (t3-code mode) vs the orchestration nav
       (Intake, Check-in, Tasks, Runs, Workflows, Fleet, Connections, Notifications, Settings),
       when each shows, how the user moves between them without "management chrome" bolted on;
    2. where the Marks legend toggle and pulse-style ambient signals live in that frame;
    3. how the empty states of Sessions, Intake and Notifications carry first-run guidance
       (provider login, connect GitHub / Gmail, connect a chat channel) without a checklist page.

  Three shells, switchable via ?variant=A|B|C (same screens, same data, only the frame changes):
    A Nav    - one orchestration sidebar always, Sessions is its first item. The threads list is
               content: a list column inside the Sessions screen (master/detail), never chrome.
    B Modes  - the sidebar has two faces behind a segmented switch: Threads (t3-code list: create,
               projects, threads, assistants) and Hydra (the orchestration nav). The face follows
               the screen; the needs-you count leaks into the Hydra segment so it never hides.
    C Stack  - one sidebar, two regions: threads on top (t3-code), the orchestration group pinned
               below it. No mode, no list column; everything is one click away.
  Ambient signals (pulse): ?pulse=top|foot|none (key p). Default per variant: A top bar, B/C sidebar
  foot. The check-in page keeps its full pulse rail regardless (pinned).
  Data: ?data=busy|fresh (key d). fresh = first run; ?li=1 = a provider login has happened (key l).
  Keys: ← → variant · d data · l login · p pulse · m mode (B) · t theme · ? Marks · Esc closes.
  Marks are the pinned family (#35); everything in the pinned design language (#33).
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydra app shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg:      oklch(94.5% 0.0156 265);
    --surface: oklch(96.7% 0.0125 265);
    --raised:  oklch(100% 0.0078 265);
    --ink:     oklch(23% 0.0100 265);
    --muted:   oklch(48% 0.0156 265);
    --faint:   oklch(66% 0.0156 265);
    --line:      oklch(23% 0.0100 265 / 0.10);
    --line-soft: oklch(23% 0.0100 265 / 0.055);
    --card-shadow: 0 1px 2px rgba(23,26,33,0.05);
    --lift-shadow: 0 1px 2px rgba(23,26,33,0.06), 0 4px 14px rgba(23,26,33,0.06);
    --attn: #8a6116; --fail: #a34e46; --ok: #48745a; --live: #48717f;
    --attn-soft: rgba(138,97,22,0.09);
    --p-hydra: #7d7ab0; --p-ops: #a67f92;
    --sans: "Onest", -apple-system, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --w-emph: 500; --w-urgent: 600;
    --side-w: 232px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:      oklch(20%   0.0288 265);
      --surface: oklch(22.2% 0.0288 265);
      --raised:  oklch(25.5% 0.0259 265);
      --ink:     oklch(90% 0.0080 265);
      --muted:   oklch(68% 0.0288 265);
      --faint:   oklch(50% 0.0288 265);
      --line:      oklch(90% 0.0288 265 / 0.10);
      --line-soft: oklch(90% 0.0288 265 / 0.06);
      --card-shadow: 0 1px 2px rgba(0,0,0,0.35);
      --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
      --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8;
      --attn-soft: rgba(208,161,71,0.12);
      --p-hydra: #9490c9; --p-ops: #bd93a8;
    }
  }
  :root[data-theme="dark"] {
    --bg:      oklch(20%   0.0288 265);
    --surface: oklch(22.2% 0.0288 265);
    --raised:  oklch(25.5% 0.0259 265);
    --ink:     oklch(90% 0.0080 265);
    --muted:   oklch(68% 0.0288 265);
    --faint:   oklch(50% 0.0288 265);
    --line:      oklch(90% 0.0288 265 / 0.10);
    --line-soft: oklch(90% 0.0288 265 / 0.06);
    --card-shadow: 0 1px 2px rgba(0,0,0,0.35);
    --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
    --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8;
    --attn-soft: rgba(208,161,71,0.12);
    --p-hydra: #9490c9; --p-ops: #bd93a8;
  }

  /* ============ base ============ */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; }
  b { font-weight: var(--w-emph); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .app { display: flex; min-height: 100vh; }
  .lane-label { text-transform: uppercase; letter-spacing: 0.1em; font-size: 10.5px; color: var(--faint); font-weight: var(--w-emph); display: flex; align-items: baseline; gap: 8px; }
  .lane-label .n { font-family: var(--mono); letter-spacing: 0; text-transform: none; font-weight: 400; }
  .lane-label .r { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 400; font-family: var(--mono); font-size: 10.5px; }
  .pdot { width: 7px; height: 7px; border-radius: 2px; display: inline-block; flex: none; vertical-align: 0; }
  .pdot.hydra { background: var(--p-hydra); } .pdot.ops { background: var(--p-ops); }

  /* ============ marks (pinned family, #35) ============ */
  .markcell { width: 16px; flex: none; display: inline-flex; justify-content: center; align-items: center; font-size: 12px; }
  .ent { display: inline-flex; width: 14px; justify-content: center; align-items: center; flex: none; vertical-align: -2px; color: var(--faint); }
  svg.bs { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
  svg.bs.q { stroke-width: 1.35; }
  .okg { color: var(--ok); } .failg { color: var(--fail); } .cang { color: var(--faint); } .attn { color: var(--attn); } .livec { color: var(--live); }
  .eq { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 9px; width: 11px; flex: none; }
  .eq i { width: 2px; border-radius: 1px; background: var(--live); height: 4px; animation: eqs 1.9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: 0.35s; } .eq i:nth-child(3) { animation-delay: 0.7s; }
  @keyframes eqs { 0%, 100% { height: 3px; } 50% { height: 7px; } }
  .livedot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); flex: none; animation: pulse 2.4s ease-in-out infinite; display: inline-block; }
  .attndot { width: 6px; height: 6px; border-radius: 50%; background: var(--attn); flex: none; animation: pulse 2.4s ease-in-out infinite; display: inline-block; }
  .idledot { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; display: inline-block; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) {
    .eq i, .livedot, .attndot { animation: none !important; }
    .eq i:nth-child(1) { height: 4px; } .eq i:nth-child(2) { height: 8px; } .eq i:nth-child(3) { height: 5px; }
  }
  .pri { display: inline-flex; align-items: center; flex: none; }
  .pri .bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 9px; }
  .pri .bars i { width: 2.5px; border-radius: 1px; background: var(--line); }
  .pri .bars i:nth-child(1) { height: 3.5px; } .pri .bars i:nth-child(2) { height: 6px; } .pri .bars i:nth-child(3) { height: 9px; }
  .pri[data-pri="low"]    .bars i:nth-child(1) { background: var(--faint); }
  .pri[data-pri="normal"] .bars i:nth-child(-n+2) { background: var(--muted); }
  .pri[data-pri="high"]   .bars i { background: var(--muted); }
  .pri[data-pri="urgent"] .bars i { background: var(--ink); }
  .age { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
  .age[data-age="recent"] { color: var(--muted); } .age[data-age="stale"] { color: var(--ink); } .age[data-age="old"] { color: var(--attn); font-weight: 500; }
  .state { font-size: 12px; color: var(--muted); }
  .state.live { color: var(--live); } .state.fail { color: var(--fail); } .state.attn { color: var(--attn); }
  .qbtn { font-family: var(--sans); font-size: 12.5px; line-height: 1; font-weight: var(--w-emph); border: 0; background: none; color: var(--muted); padding: 6px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .qbtn:hover { background: var(--line-soft); color: var(--ink); }
  .qbtn.first { color: var(--ink); }
  .qbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  code { font-family: var(--mono); font-size: 12px; background: var(--line-soft); padding: 1px 5px; border-radius: 4px; }

  /* ============ the shell ============ */
  .side { width: var(--side-w); flex: none; background: var(--surface); border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; padding: 14px 10px 12px; position: sticky; top: 0; height: 100vh; }
  .logo { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px 14px; }
  .logo b { font-size: 15px; letter-spacing: 0.01em; }
  .logo span { font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav a { display: flex; align-items: center; gap: 9px; padding: 5px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 13px; cursor: pointer; }
  .nav a .ni { width: 14px; display: inline-flex; justify-content: center; align-items: center; flex: none; color: var(--faint); }
  .nav a .ni:empty { display: none; }
  .nav a.on { background: var(--line-soft); color: var(--ink); font-weight: var(--w-emph); }
  .nav a.on .ni { color: var(--ink); }
  .nav a:not(.on):hover { background: var(--line-soft); }
  .nav a:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .nav .count { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; margin-left: auto; }
  .nav .count.attn { color: var(--attn); }
  .nav .sep { height: 1px; background: var(--line-soft); margin: 8px 10px; }
  .sidefoot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding-top: 10px; }
  .side .glabel { padding: 0 10px; margin: 6px 0 4px; }
  /* thread list (t3-code face) */
  .newbtn { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised); color: var(--ink); font-size: 13px; font-weight: var(--w-emph); cursor: pointer; box-shadow: var(--card-shadow); text-align: left; width: 100%; }
  .newbtn:hover { box-shadow: var(--lift-shadow); }
  .newbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .newbtn .plus { font-family: var(--mono); color: var(--faint); font-size: 13px; }
  .tlist { display: flex; flex-direction: column; gap: 1px; }
  .trow { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 8px; border-radius: 6px; color: var(--muted); font-size: 13px; text-decoration: none; cursor: pointer; }
  .trow .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow.on { background: var(--line-soft); color: var(--ink); font-weight: var(--w-emph); }
  .trow:not(.on):hover { background: var(--line-soft); }
  .trow.dim { opacity: 0.66; }
  .trow .markcell { width: 14px; }
  .side .ghead { display: flex; align-items: center; gap: 7px; padding: 0 10px; margin: 10px 0 3px; font-size: 12px; color: var(--muted); font-weight: var(--w-emph); }
  .side .ghead:first-child { margin-top: 0; }
  .side .ghead .r { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--faint); font-weight: 400; }
  .side .empty { padding: 4px 10px; font-size: 12px; color: var(--faint); }
  .side .more { display: block; padding: 3px 10px; font-size: 12px; color: var(--faint); text-decoration: none; cursor: pointer; border-radius: 6px; }
  .side .more:hover { color: var(--muted); background: var(--line-soft); }
  .scrollreg { overflow: auto; min-height: 0; margin: 0 -4px; padding: 0 4px; }
  /* segmented switch (B) */
  .seg { display: flex; padding: 2px; border-radius: 7px; background: var(--line-soft); margin: 0 0 12px; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 5px; padding: 4px 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
  .seg button.on { background: var(--raised); color: var(--ink); font-weight: var(--w-emph); box-shadow: var(--card-shadow); }
  .seg button:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .seg .count { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .seg .count.attn { color: var(--attn); }
  /* pulse block / line */
  .pulse { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .pulse .pl { display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse .pl b { color: var(--ink); }
  .pulse .pl .w { color: var(--attn); }
  .side .pulse { padding: 0 10px 6px; }
  .topbar .pulse { flex-direction: row; gap: 16px; margin-left: auto; align-self: center; flex: none; }
  /* legend */
  .lgbtn { font-family: var(--sans); font-size: 13px; color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; line-height: 1; width: 100%; text-align: left; }
  .lgbtn:hover, .lgbtn[aria-expanded="true"] { background: var(--line-soft); color: var(--ink); }
  .lgbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .lgbtn kbd { font-family: var(--mono); font-size: 10px; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; line-height: 1.5; margin-left: auto; }
  .legend { position: fixed; z-index: 30; width: 236px; left: calc(var(--side-w) + 8px); bottom: 48px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--lift-shadow); padding: 12px 14px 10px; display: none; flex-direction: column; gap: 2px; }
  .legend.open { display: flex; }
  .legend .lane-label { margin-bottom: 4px; }
  .legend .lgroup { margin-top: 8px; }
  .legend .lrow { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); padding: 2.5px 0; }
  .legend .lrow .markcell { justify-content: flex-start; }
  .legend .note { font-size: 11px; color: var(--faint); margin-top: 8px; border-top: 1px solid var(--line-soft); padding-top: 8px; }
  /* main */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: baseline; gap: 14px; padding: 22px 32px 0; }
  .topbar h1 { font-size: 18px; margin: 0; letter-spacing: -0.015em; font-weight: var(--w-emph); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 44%; }
  .topbar .when { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .topbar .crumb { color: var(--faint); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .topbar .crumb b { color: var(--muted); }
  #stage { padding: 16px 32px 110px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .headline { font-size: 15px; color: var(--muted); margin: 0 0 22px; }
  .headline b { color: var(--ink); }
  .lane { margin-bottom: 28px; }
  .lane > .lane-label { margin-bottom: 10px; }
  .group { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px; padding: 4px 6px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 13.5px; }
  .row:hover { background: var(--line-soft); }
  .row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t small { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .row .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .row.dim { opacity: 0.66; }
  .row .qbtn { padding: 4px 8px; margin: -2px 0; }
  .digest { color: var(--muted); font-size: 12.5px; opacity: 0.82; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 11px; font-family: var(--mono); margin: 10px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  /* decision card + ledger (pinned by #20/#50) */
  .dcard { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--lift-shadow); padding: 14px 18px 8px; display: flex; flex-direction: column; gap: 10px; max-width: 640px; }
  .dcard .qline { display: flex; align-items: center; gap: 10px; }
  .dcard .q { font-size: 15px; font-weight: var(--w-emph); letter-spacing: -0.008em; }
  .dcard .qline .age { margin-left: auto; }
  .dcard .fields { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 14px; font-size: 12.5px; }
  .dcard .fl { text-transform: uppercase; letter-spacing: 0.09em; font-size: 10px; color: var(--faint); font-weight: var(--w-emph); padding-top: 2px; }
  .dcard .fv { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dcard .fv b { color: var(--ink); }
  .ledger { display: flex; flex-direction: column; margin: 2px -10px 0; }
  .ledger button { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 1px 12px; align-items: baseline; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; color: var(--muted); }
  .ledger button:hover { background: var(--line-soft); }
  .ledger button:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .ledger .lb { font-size: 13px; font-weight: var(--w-emph); color: var(--muted); }
  .ledger button.first .lb { color: var(--ink); }
  .ledger .ds { font-size: 12px; color: var(--muted); }
  .ledger .ds b { color: var(--ink); }
  .ledger .dd { grid-column: 2; font-size: 11.5px; color: var(--faint); }
  .focusnav { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 12px; padding-top: 8px; }
  .focusnav .ct { font-family: var(--mono); font-size: 11px; }
  .focusnav .qbtn { padding: 4px 8px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 44px; align-items: start; max-width: 1100px; }
  .rail { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 20px; }
  .rail .pulse { gap: 4px; }
  .rail .lane-label { margin-bottom: 6px; }
  /* intake bits */
  .tabs { display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .tabs a { padding: 6px 10px; font-size: 13px; color: var(--muted); text-decoration: none; border-bottom: 1.5px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .tabs a.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: var(--w-emph); }
  .tabs .r { margin-left: auto; }
  .lead { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--lift-shadow); padding: 14px 18px 10px; max-width: 640px; display: flex; flex-direction: column; gap: 8px; }
  .lead .tt { font-size: 15px; font-weight: var(--w-emph); display: flex; align-items: center; gap: 10px; }
  .lead .made { font-size: 12px; color: var(--muted); }
  .lead .gist { font-size: 13px; color: var(--muted); max-width: 60ch; }
  .lead .acts { display: flex; gap: 2px; margin-left: -9px; }
  /* empty states (question 3) */
  .empty-state { max-width: 560px; margin-top: 4vh; display: flex; flex-direction: column; gap: 14px; }
  .empty-state h2 { font-size: 17px; font-weight: var(--w-emph); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  .empty-state p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 52ch; }
  .empty-state .fine { font-size: 12px; color: var(--faint); max-width: 56ch; }
  .empty-state .fine a { color: var(--muted); cursor: pointer; }
  .empty-state .acts { display: flex; gap: 2px; margin-left: -9px; flex-wrap: wrap; }
  .offer { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px; padding: 4px 6px; max-width: 560px; }
  .offer .row .t b { display: block; }
  .offer .row .t small { margin: 0; display: block; }
  .form { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--lift-shadow); padding: 14px 18px 12px; max-width: 520px; display: flex; flex-direction: column; gap: 8px; }
  .form .fr { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; align-items: baseline; font-size: 13px; }

<script>
/* ============ url state ============ */
const VARIANTS = [
  { key: "A", name: "Nav", blurb: "one orchestration sidebar; threads are a list column inside Sessions" },
  { key: "B", name: "Modes", blurb: "sidebar switches between a Threads face and a Hydra face" },
  { key: "C", name: "Stack", blurb: "threads on top, the orchestration group pinned below, one sidebar" },
];
function params() { return new URLSearchParams(location.search); }
function get(k) { return params().get(k); }
function setParams(obj) { const p = params(); for (const [k, v] of Object.entries(obj)) { if (v === null || v === undefined || v === false) p.delete(k); else p.set(k, v); } try { history.replaceState(null, "", "?" + p.toString()); } catch (e) {} render(); }
function vIndex() { const k = (get("variant") || "A").toUpperCase(); const i = VARIANTS.findIndex((v) => v.key === k); return i === -1 ? 0 : i; }
function V() { return VARIANTS[vIndex()].key; }
function fresh() { return get("data") === "fresh"; }
function loggedIn() { return get("li") === "1"; }
function screen() { const s = get("screen") || "sessions"; return SCREENS.includes(s) ? s : "sessions"; }
function threadId() { return get("thread"); }
function pulsePlace() { const p = get("pulse"); if (["top", "foot", "none"].includes(p)) return p; return V() === "A" ? "top" : "foot"; }
function mode() { const m = get("mode"); if (m === "threads" || m === "hydra") return m; return screen() === "sessions" ? "threads" : "hydra"; }
const SCREENS = ["sessions", "intake", "checkin", "tasks", "runs", "workflows", "fleet", "connections", "notifications", "settings"];
const TITLES = { sessions: "Sessions", intake: "Intake", checkin: "Check-in", tasks: "Tasks", runs: "Runs", workflows: "Workflows", fleet: "Fleet", connections: "Connections", notifications: "Notifications", settings: "Settings" };

/* ============ marks (pinned family) ============ */
const BS = {
  task:     '<rect x="1.75" y="1.75" width="8.5" height="8.5" rx="2.25"/>',
  run:      '<path d="M3.25 2.4v7.2a.55.55 0 0 0 .83.47l5.9-3.6a.55.55 0 0 0 0-.94l-5.9-3.6a.55.55 0 0 0-.83.47z"/>',
  workflow: '<circle cx="2.6" cy="6" r="1.35"/><circle cx="9.4" cy="2.6" r="1.35"/><circle cx="9.4" cy="9.4" r="1.35"/><path d="M3.9 6h2.4l2.1-2.5M6.3 6l2.1 2.5"/>',
  session:  '<path d="M3.25 1.75h5.5A1.75 1.75 0 0 1 10.5 3.5v2.75A1.75 1.75 0 0 1 8.75 8H5.6L3.4 10.2V8h-.15A1.75 1.75 0 0 1 1.5 6.25V3.5a1.75 1.75 0 0 1 1.75-1.75z"/>',
  paused:   '<path d="M4 2.5v7M8 2.5v7"/>',
  question: '<path d="M3.9 4.3a2.1 2.1 0 1 1 3 1.9c-.6.35-.9.75-.9 1.4v.2"/><path d="M6 10.2h.01"/>',
  queued:   '<circle cx="6" cy="6" r="3.4"/>',
  done:     '<path d="m2.4 6.4 2.5 2.5 4.8-5.3"/>',
  failed:   '<path d="m3 3 6 6M9 3l-6 6"/>',
  cancelled:'<path d="M2.75 6h6.5"/>',
};
const bs = (m, cls = "") => `<svg class="bs ${cls}" viewBox="0 0 12 12" aria-hidden="true">${m}</svg>`;
const M = {
  working:   () => '<span class="eq" title="agent working"><i></i><i></i><i></i></span>',
  decision:  () => `<span class="attn" title="decision wanted">${bs(BS.question, "q")}</span>`,
  queued:    () => `<span class="cang" title="queued">${bs(BS.queued)}</span>`,
  paused:    () => `<span class="attn" title="paused">${bs(BS.paused)}</span>`,
  done:      () => `<span class="okg" title="done">${bs(BS.done)}</span>`,
  failed:    () => `<span class="failg" title="failed">${bs(BS.failed)}</span>`,
  cancelled: () => `<span class="cang" title="cancelled">${bs(BS.cancelled)}</span>`,
  idle:      () => '<span class="idledot" title="idle"></span>',
  none:      () => "",
};
const mark = (k) => `<span class="markcell">${(M[k] || M.none)()}</span>`;
const ent = (k) => `<span class="ent">${bs(BS[k])}</span>`;
const pri = (p) => `<span class="pri" data-pri="${p}" title="priority ${p}"><span class="bars"><i></i><i></i><i></i></span></span>`;
const age = (t, b = "") => `<span class="age" data-age="${b}">${t}</span>`;

/* ============ data ============ */
const BUSY = {
  projects: [
    { key: "hydra", name: "hydra", threads: [
      { id: "a1f3c9e2", title: "Fix flaky webhook tests", state: "working", age: "12m", ws: "main checkout", model: "sonnet-5" },
      { id: "b7d02e41", title: "Runner drain command", state: "decision", age: "4m", ws: "worktree · hydra/run-3f1", model: "sonnet-5" },
      { id: "c9e8a110", title: "Tidy the promotion runbook", state: "idle", age: "2h", ws: "no workspace", model: "sonnet-5" },
      { id: "d4b1f77a", title: "Bun compile: notarization spike", state: "done", age: "yesterday", ws: "main checkout", model: "opus-5" },
    ] },
    { key: "ops", name: "ops", threads: [
      { id: "e2c7d905", title: "Rotate the Hetzner backups key", state: "idle", age: "3d", ws: "main checkout", model: "gpt-5.6" },
      { id: "f0a3b6c8", title: "Why is the tailnet cert renewal failing", state: "failed", age: "5d", ws: "no workspace", model: "sonnet-5" },
    ] },
  ],
  assistants: [
    { name: "Hydra", live: false, where: "web chat", id: "as-hydra" },
    { name: "Hera", live: true, where: "active in #ops", id: "as-hera" },
    { name: "Iris", live: false, where: "idle · Slack DM", id: "as-iris" },
  ],
  fromWorkflows: [
    { id: "9c1e2f30", title: "PR review (auto) · PR #94 · step 2/4", state: "working", age: "3m" },
    { id: "8b0d1e2f", title: "Triage · 09:00 batch", state: "done", age: "5h" },
  ],
  counts: { intake: 7, checkin: 2, notifications: 5 },
  pulse: [
    { dot: "live", html: "<b>6 runners</b> · 11 sessions" },
    { dot: "live", html: "<b>Hera</b> active in #ops" },
    { dot: "", html: "<b>hetzner-01</b> at cap <span class='w'>· queue 2</span>" },
    { dot: "", html: "212 events today → <b>18 tasks</b>" },
  ],
};
const FRESH = {
  projects: [], assistants: [{ name: "Hydra", live: false, where: "web chat", id: "as-hydra" }], fromWorkflows: [],
  counts: { intake: 0, checkin: 0, notifications: 0 },
  pulse: [{ dot: "live", html: "<b>1 runner</b> · this machine" }],
};
function data() { return fresh() ? FRESH : BUSY; }
function allThreads() { return data().projects.flatMap((p) => p.threads.map((t) => ({ ...t, project: p.key }))); }
function findThread(id) { return allThreads().find((t) => t.id === id); }

/* ============ shell pieces ============ */
const NAV_ALL = [["sessions", "session"], ["intake"], ["checkin"], ["tasks", "task"], ["runs", "run"], ["workflows", "workflow"], "sep", ["fleet"], ["connections"], ["notifications"], ["settings"]];
function navHtml(items) {
  const d = data(); const s = screen();
  return `<nav class="nav">${items.map((n) => {
    if (n === "sep") return '<div class="sep"></div>';
    const [key, glyph] = n; const c = d.counts[key];
    const count = c ? `<span class="count${key === "checkin" ? " attn" : ""}">${c}</span>` : "";
    return `<a data-go="${key}" class="${s === key ? "on" : ""}"><span class="ni">${glyph ? bs(BS[glyph]) : ""}</span>${TITLES[key]}${count}</a>`;
  }).join("")}</nav>`;
}
function threadRow(t, cls = "") {
  const on = threadId() === t.id && screen() === "sessions";
  return `<a class="trow ${cls} ${on ? "on" : ""} ${t.state === "done" ? "dim" : ""}" data-thread="${t.id}">${mark(t.state)}<span class="t">${t.title}</span>${age(t.age)}</a>`;
}
function assistantRow(a) {
  return `<a class="trow" data-thread="${a.id}">${a.live ? '<span class="markcell"><span class="livedot"></span></span>' : '<span class="markcell"><span class="idledot"></span></span>'}<span class="t">${a.name} <span style="color:var(--faint);font-weight:400"> · ${a.where}</span></span></a>`;
}
function newThreadBtn() {
  if (fresh() && !loggedIn()) return "";
  return `<button class="newbtn" data-create="1"><span class="plus">+</span>Create new thread</button>`;
}
function threadListHtml({ limit = 99, morelink = true } = {}) {
  const d = data();
  let h = "";
  if (!d.projects.length) h += `<div class="empty">${fresh() && !loggedIn() ? "No threads yet · log in to a provider first" : "No threads yet"}</div>`;
  for (const p of d.projects) {
    h += `<div class="ghead"><span class="pdot ${p.key}"></span>${p.name}<span class="r">${p.threads.length}</span></div><div class="tlist">${p.threads.slice(0, limit).map((t) => threadRow(t)).join("")}</div>`;
    if (p.threads.length > limit) h += `<a class="more" data-go="sessions">${p.threads.length - limit} more…</a>`;
  }
  h += `<div class="ghead">Assistants</div><div class="tlist">${d.assistants.map(assistantRow).join("")}</div>`;
  if (morelink) h += `<a class="more" data-go="sessions" data-all="1" style="margin-top:8px">All sessions →</a>`;
  return h;
}
function pulseHtml(limit = 99) {
  return `<div class="pulse">${data().pulse.slice(0, limit).map((p) => `<span class="pl">${p.dot === "live" ? '<span class="livedot"></span>' : '<span class="idledot"></span>'}<span>${p.html}</span></span>`).join("")}</div>`;
}
function legendBtn() { return `<button class="lgbtn" id="lgtoggle" aria-expanded="false" aria-controls="legend"><span class="markcell" style="width:auto">${bs(BS.queued)}</span>Marks <kbd>?</kbd></button>`; }

const LOGO = `<div class="logo"><b>Hydra</b><span>rogier</span></div>`;

function sideA() {

}

  const body = m === "threads" ? `${newThreadBtn()}<div class="scrollreg">${threadListHtml()}</div>` : navHtml(NAV_ALL.filter((n) => n === "sep" || n[0] !== "sessions"));

}
function sideC() {
  const d = data();
  const orch = navHtml(NAV_ALL.filter((n) => n === "sep" || n[0] !== "sessions"));
  return `${LOGO}<div class="lane-label glabel" style="margin-top:0">Sessions <a class="r" data-go="sessions" data-all="1" style="cursor:pointer">all →</a></div>${newThreadBtn()}<div class="scrollreg">${threadListHtml({ limit: 3, morelink: false })}</div>
    <div class="nav"><div class="sep"></div></div>
    <div class="lane-label glabel">Hydra</div>${orch}${footHtml()}`;
}
function renderSide() {
  document.getElementById("side").innerHTML = { A: sideA, B: sideB, C: sideC }[V()]();
}

/* ============ topbar ============ */
function renderTop() {
  const s = screen(); const t = threadId() && findThread(threadId());

    h = `<h1>${t.title}</h1><span class="crumb"><b>${t.project}</b> · thread · Claude Code · ${t.model} · ${t.ws} · <span class="mono">${t.id}</span></span>`;
  } else if (s === "sessions" && threadId() && threadId().startsWith("as-")) {

  } else {
    h = `<h1>${TITLES[s]}</h1><span class="when">${s === "intake" ? "since Sunday 22:10" : "Monday 09:14"}</span>`;
  }
  if (pulsePlace() === "top") h += pulseHtml(2);
  document.getElementById("topbar").innerHTML = h;
}

/* ============ screens ============ */
function emptyState(h2, p, acts, fine) {
  return `<div class="empty-state"><h2>${h2}</h2>${p ? `<p>${p}</p>` : ""}${acts || ""}${fine ? `<div class="fine">${fine}</div>` : ""}</div>`;
}
function offerRows(rows) {
  return `<div class="offer">${rows.map((r) => `<div class="row"><span class="t"><b>${r.name}</b><small>${r.sub}</small></span><button class="qbtn first" data-noop="1">${r.act}</button></div>`).join("")}</div>`;

/* --- Sessions --- */
function loginGuidance() {

  if (step) {
    return emptyState(`Log in to ${step}`, `Hydra started ${step === "Claude Code" ? "<code>claude</code>" : "<code>codex</code>"} on this machine in its own home. Open the link it printed, sign in, and paste the code it gives you.`,

       <div class="fr"><span class="fl">Paste code</span><span class="fv code"><input placeholder="paste here" aria-label="paste code"><button class="qbtn first" data-login-done="1">Done</button></span></div>

    `<div class="acts"><button class="qbtn first" data-login="Claude Code">Log in to Claude Code</button><button class="qbtn" data-login="Codex">Log in to Codex</button></div>`,
    `pi was not found on this machine. Other machines join from <a data-go="fleet">Fleet</a>.`);

  return emptyState("Claude Code is ready.",
    "Create a thread to work on this machine. The defaults come from Settings › Threads; anything you change here applies to this thread only.",
    `<div class="acts"><button class="qbtn first" data-create="1">Create new thread</button></div>`,
    `Codex was found but is not logged in · <a data-login="Codex">Log in to Codex</a>. Your assistant <b>Hydra</b> is in the Assistants list; it works through Hydra rather than in a workspace.`);

function createForm() {

    <div class="lane-label">New thread</div>
    <div class="fr"><span class="fl">Provider</span><span class="fv"><span class="sel">Claude Code</span><small>logged in on this machine</small></span></div>
    <div class="fr"><span class="fl">Model</span><span class="fv"><span class="sel">claude-sonnet-5</span> <span class="sel">effort · medium</span></span></div>
    <div class="fr"><span class="fl">Access</span><span class="fv"><span class="sel">approval-required</span><small>asks before edits and commands</small></span></div>
    <div class="fr"><span class="fl">Workspace</span><span class="fv"><span class="sel">No workspace</span><small>or adopt a folder on this machine</small></span></div>
    <div class="fr"><span class="fl">Runner</span><span class="fv"><span class="sel">local</span><small>this machine</small></span></div>
    <div class="acts"><button class="qbtn first" data-start="1">Start</button><button class="qbtn" data-create="">Cancel</button></div>
    <div class="fine">Prefilled from Settings › Threads. Nothing you change here is written back.</div></div>`;
}
function threadPane(t) {
  const turns = {
    working: `${turn("you", "The webhook retry tests fail about one run in five. Find out why and fix it without loosening the assertions.")}

  document.getElementById("swlabel").textContent = `${v.key} (${v.name})`;
  document.getElementById("dbtn").textContent = fresh() ? "data: fresh" : "data: busy";
  document.getElementById("lbtn").textContent = loggedIn() ? "login: yes" : "login: no";
  document.getElementById("pbtn").textContent = `pulse: ${pulsePlace()}`;
  const mb = document.getElementById("mbtn"); mb.style.display = v.key === "B" ? "" : "none"; mb.textContent = `mode: ${mode()}`;
  const lg = document.getElementById("legend"); const b = document.getElementById("lgtoggle"); if (b) b.setAttribute("aria-expanded", String(lg.classList.contains("open")));
}
function go(screenKey, extra = {}) { setParams({ screen: screenKey, thread: null, create: null, login: null, mode: null, ...extra }); }
function cycle(d) { const i = (vIndex() + d + VARIANTS.length) % VARIANTS.length; setParams({ variant: VARIANTS[i].key }); }
function toggleTheme() { const r = document.documentElement; const dark = r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches); r.dataset.theme = dark ? "light" : "dark"; }
function cyclePulse() { const o = ["top", "foot", "none"]; setParams({ pulse: o[(o.indexOf(pulsePlace()) + 1) % 3] }); }

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-go],[data-thread],[data-create],[data-login],[data-login-done],[data-start],[data-mode],#lgtoggle,[data-noop]");
  if (!el) { if (!e.target.closest("#legend")) toggleLegend(false); return; }
  e.preventDefault();
  if (el.id === "lgtoggle") return toggleLegend();
  if (el.dataset.go) return go(el.dataset.go, el.dataset.all ? { mode: V() === "B" ? "threads" : null } : {});
  if (el.dataset.thread) return setParams({ screen: "sessions", thread: el.dataset.thread, create: null, login: null, mode: null });
  if (el.dataset.create !== undefined) return setParams({ screen: "sessions", thread: null, create: el.dataset.create || null, mode: null });
  if (el.dataset.login !== undefined) return setParams({ screen: "sessions", thread: null, login: el.dataset.login || null, mode: null });
  if (el.dataset.loginDone) return setParams({ li: "1", login: null });
  if (el.dataset.start) return setParams({ thread: "new", create: null });
  if (el.dataset.mode) return setParams({ mode: el.dataset.mode });
});
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.getElementById("dbtn").onclick = () => setParams({ data: fresh() ? null : "fresh", thread: null, create: null, login: null });
document.getElementById("lbtn").onclick = () => setParams({ li: loggedIn() ? null : "1", login: null });
document.getElementById("pbtn").onclick = cyclePulse;
document.getElementById("mbtn").onclick = () => setParams({ mode: mode() === "threads" ? "hydra" : "threads" });
document.getElementById("theme").onclick = toggleTheme;
document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft") cycle(-1); else if (e.key === "ArrowRight") cycle(1);
  else if (e.key === "d") document.getElementById("dbtn").click();
  else if (e.key === "l") document.getElementById("lbtn").click();
  else if (e.key === "p") cyclePulse();
  else if (e.key === "m" && V() === "B") document.getElementById("mbtn").click();
  else if (e.key === "t") toggleTheme();
  else if (e.key === "?") toggleLegend();
  else if (e.key === "Escape") toggleLegend(false);
});
render();
</script>
