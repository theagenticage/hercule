<!--
  PROTOTYPE - throwaway. Ticket: https://github.com/rogierpennink/hydra/issues/1 -> #30
  ROUND 2. Round 1 reaction: Intake and check-in stay SEPARATE views for now (merging is a
  post-dogfooding question); Desk (A) won; the Ledger's folded source signals touched
  something real. This round keeps the Desk skeleton and re-frames it around the most likely
  use-case, the MORNING BRIEF (now = Monday 08:30, last checked Sunday 18:10), then tries three
  treatments of what Rogier asked for: the source events behind each proposal, a picture of
  "what's out there" across the connected systems, and recognisable system marks.
    A Brief    - narrative-first: an agent-written brief opens the page and links into the
                 proposals; signals fold under each proposal; sources live in the rail.
    B Topics   - topic-first: tabs (All / Code / Business / Personal) group connections and
                 proposals; each tab shows "what came in" per connection in the main column.
    C Systems  - verdict-first: proposals, then an "Across your systems" lane, one block per
                 connection with its notable raw signals stamped with what triage made of them.
  Marks: monochrome simple-icons brand paths (github, gmail, sentry, tailscale, hetzner,
  dependabot) + a clock for cron + a hex for Hydra itself. Colour doctrine unchanged.
  Keys: ← → variant · d dataset (calm/busy) · t theme · n cycle the working name.
  Round 1 (three structural variants) is in git history (e0f5f7c).
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydra Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ============ tokens: pinned Midnight (docs/design-language.md) ============ */
  :root {
    --bg:      oklch(94.5% 0.0156 265);
    --surface: oklch(96.7% 0.0125 265);
    --raised:  oklch(100% 0.0078 265);
    --ink:     oklch(23% 0.0100 265);
    --muted:   oklch(48% 0.0156 265);
    --faint:   oklch(66% 0.0156 265);
    --line:      oklch(23% 0.0100 265 / 0.10);
    --line-soft: oklch(23% 0.0100 265 / 0.055);
    --card-shadow: 0 1px 2px rgba(23,26,33,0.05);
    --lift-shadow: 0 1px 2px rgba(23,26,33,0.06), 0 4px 14px rgba(23,26,33,0.06);
    --attn: #8a6116; --fail: #a34e46; --ok: #48745a; --live: #48717f;
    --attn-soft: rgba(138,97,22,0.09);
    --proj-hydra: #7d7ab0; --proj-ops: #a67f92;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:      oklch(20%   0.0288 265);
      --surface: oklch(22.2% 0.0288 265);
      --raised:  oklch(25.5% 0.0259 265);
      --ink:     oklch(90% 0.0080 265);
      --muted:   oklch(68% 0.0288 265);
      --faint:   oklch(50% 0.0288 265);
      --line:      oklch(90% 0.0288 265 / 0.10);
      --line-soft: oklch(90% 0.0288 265 / 0.06);
      --card-shadow: 0 1px 2px rgba(0,0,0,0.35);
      --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
      --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8;
      --attn-soft: rgba(208,161,71,0.12);
      --proj-hydra: #9490c9; --proj-ops: #bd93a8;
    }
  }
  :root[data-theme="dark"] {
    --bg:      oklch(20%   0.0288 265);
    --surface: oklch(22.2% 0.0288 265);
    --raised:  oklch(25.5% 0.0259 265);
    --ink:     oklch(90% 0.0080 265);
    --muted:   oklch(68% 0.0288 265);
    --faint:   oklch(50% 0.0288 265);
    --line:      oklch(90% 0.0288 265 / 0.10);
    --line-soft: oklch(90% 0.0288 265 / 0.06);
    --card-shadow: 0 1px 2px rgba(0,0,0,0.35);
    --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
    --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8;
    --attn-soft: rgba(208,161,71,0.12);
    --proj-hydra: #9490c9; --proj-ops: #bd93a8;
  }
  :root { --sans: "Onest", -apple-system, system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; --w-emph: 500; --w-urgent: 600; }

  /* ============ base ============ */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  .mono { font-family: var(--mono); }
  .app { display: flex; min-height: 100vh; }
  code { font-family: var(--mono); font-size: 12px; background: var(--line-soft); padding: 1px 5px; border-radius: 4px; font-weight: 400; }
  a.ref { color: var(--ink); text-decoration: none; font-weight: var(--w-emph); border-bottom: 1px solid var(--line); }
  a.ref:hover { border-bottom-color: var(--muted); }

  /* ---------- chrome (shared shell, identical to check-in) ---------- */
  .side { width: 204px; flex: none; background: var(--surface); border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; padding: 16px 10px; position: sticky; top: 0; height: 100vh; }
  .logo { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px 16px; }
  .logo b { font-size: 15px; letter-spacing: 0.01em; font-weight: var(--w-emph); }
  .logo span { font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav a { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 13px; }
  .nav a.on { background: var(--line-soft); color: var(--ink); font-weight: var(--w-emph); }
  .nav a:not(.on):hover { background: var(--line-soft); }
  .nav a:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .nav .count { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .nav .sep { height: 1px; background: var(--line-soft); margin: 8px 10px; }
  .chrome-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .chrome-foot .qbtn { align-self: flex-start; font-size: 11.5px; color: var(--faint); }
  .proto-badge { border: 1px dashed var(--attn); color: var(--attn); background: var(--attn-soft); border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 10px; line-height: 1.5; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: baseline; gap: 14px; padding: 24px 32px 0; }
  .topbar h1 { font-size: 18px; margin: 0; letter-spacing: -0.015em; font-weight: var(--w-emph); }
  .topbar .when { color: var(--muted); font-size: 13px; }
  .topbar .since { color: var(--faint); font-size: 12.5px; margin-left: auto; }
  #stage { padding: 16px 32px 150px; }

  /* ============ layout ============ */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 44px; align-items: start; max-width: 1100px; }
  .maincol { display: flex; flex-direction: column; min-width: 0; }
  .maincol .lane { margin-bottom: 30px; }
  .maincol .lane > .lane-label { margin-bottom: 10px; }
  .rail { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 22px; }

  /* ============ atoms ============ */
  .lane-label { text-transform: uppercase; letter-spacing: 0.1em; font-size: 10.5px; font-weight: var(--w-emph); color: var(--faint); display: flex; align-items: center; gap: 8px; }
  .lane-label .n { font-family: var(--mono); font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .headline { font-size: 13.5px; color: var(--muted); padding-bottom: 20px; }
  .headline b { color: var(--ink); font-weight: var(--w-emph); font-variant-numeric: tabular-nums; }
  .headline .warm { color: var(--attn); font-weight: var(--w-emph); }

  /* system marks: monochrome, word-scale */
  .sys { width: 12px; height: 12px; flex: none; fill: currentColor; color: var(--muted); vertical-align: -2px; display: inline-block; }
  .sys.lg { width: 14px; height: 14px; }
  .sys.faint { color: var(--faint); }
  .syst { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }

  .eq { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 10px; width: 11px; flex: none; }
  .eq i { width: 2.5px; border-radius: 1px; background: var(--live); height: 4px; animation: eqb 1.15s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: 0.22s; } .eq i:nth-child(3) { animation-delay: 0.44s; }
  @keyframes eqb { 0%, 100% { height: 3px; } 50% { height: 9px; } }
  @keyframes pulse { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .eq i, .dot { animation: none !important; } .eq i:nth-child(1) { height: 4px; } .eq i:nth-child(2) { height: 8px; } .eq i:nth-child(3) { height: 5px; } }
  .dmark { color: var(--attn); font-size: 9px; flex: none; position: relative; top: -1px; }
  .pmark { color: var(--faint); font-size: 10px; flex: none; position: relative; top: -1px; }
  .okg { color: var(--ok); } .failg { color: var(--fail); } .cang { color: var(--faint); }
  .pausemark { color: var(--attn); font-size: 12px; flex: none; }
  .markcell { width: 16px; flex: none; display: inline-flex; justify-content: center; align-items: center; font-size: 12px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); flex: none; animation: pulse 2.4s ease-in-out infinite; display: inline-block; }
  .idledot { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; display: inline-block; }
  .pri { display: inline-flex; align-items: center; flex: none; }
  .pri .bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 9px; }
  .pri .bars i { width: 2.5px; border-radius: 1px; background: var(--line); }
  .pri .bars i:nth-child(1) { height: 3.5px; } .pri .bars i:nth-child(2) { height: 6px; } .pri .bars i:nth-child(3) { height: 9px; }
  .pri[data-pri="low"]    .bars i:nth-child(1) { background: var(--faint); }
  .pri[data-pri="normal"] .bars i:nth-child(-n+2) { background: var(--muted); }
  .pri[data-pri="high"]   .bars i { background: var(--muted); }
  .pri[data-pri="urgent"] .bars i { background: var(--ink); }
  .age { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
  .age[data-age="recent"] { color: var(--muted); } .age[data-age="stale"] { color: var(--ink); } .age[data-age="old"] { color: var(--attn); font-weight: 500; }
  .qbtn { font-family: var(--sans); font-size: 12px; line-height: 1; font-weight: var(--w-emph); border: 0; background: none; color: var(--muted); padding: 6px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .qbtn:hover { background: var(--line-soft); color: var(--ink); }
  .qbtn.first { color: var(--ink); }
  .qbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .acts { display: flex; gap: 4px; align-items: center; margin-left: -9px; }
  .ent { display: inline-flex; width: 13px; justify-content: center; align-items: center; flex: none; vertical-align: -1px; }
  .ent-task i { width: 8px; height: 8px; border: 1.5px solid var(--faint); border-radius: 2.5px; display: block; }
  .fl { text-transform: uppercase; letter-spacing: 0.09em; font-size: 10px; color: var(--faint); font-weight: var(--w-emph); padding-top: 2px; }
  .fv { color: var(--muted); }
  .fv b { color: var(--ink); font-weight: var(--w-emph); }
  .fv .none { color: var(--faint); }

  /* ---- the brief (A) ---- */
  .brief { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px; padding: 16px 20px 12px; margin-bottom: 30px; }
  .brief p { margin: 0 0 8px; font-size: 14px; line-height: 1.6; color: var(--ink); max-width: 68ch; }
  .brief p:last-of-type { margin-bottom: 0; }
  .brief .by { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 11.5px; margin-top: 10px; }

  /* ---- topic tabs (B) ---- */
  .tabs { display: flex; gap: 2px; margin-bottom: 22px; border-bottom: 1px solid var(--line-soft); }
  .tab { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 6px 10px 8px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; gap: 7px; align-items: baseline; }
  .tab .n { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .tab.on { color: var(--ink); font-weight: var(--w-emph); border-bottom-color: var(--ink); }
  .tab:hover:not(.on) { color: var(--ink); }
  .tab:focus-visible { outline: 2px solid var(--live); outline-offset: -2px; border-radius: 4px; }

  /* ---- proposal dossier card ---- */
  .pcard { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--lift-shadow); padding: 14px 18px 11px; display: flex; flex-direction: column; gap: 9px; scroll-margin-top: 20px; }
  .pcard .tline { display: flex; align-items: baseline; gap: 10px; }
  .pcard .crumb { color: var(--faint); font-size: 12px; white-space: nowrap; }
  .pcard .t { font-size: 15px; font-weight: var(--w-emph); letter-spacing: -0.008em; }
  .pcard[data-pri="urgent"] .t { font-size: 16px; font-weight: var(--w-urgent); }
  .pcard[data-pri="low"] { opacity: 0.8; }
  .pcard .tline .age { margin-left: auto; }
  .pcard .fields { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 5px 14px; font-size: 12.5px; }
  .pcard .fv { line-height: 1.45; }
  .pcard .fv.made { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; cursor: pointer; }
  .pcard .fv.made .chev { color: var(--faint); font-size: 10px; }
  .pcard .fv.next b { color: var(--ink); }
  .pcard .foot { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line-soft); padding-top: 8px; margin-top: 2px; }
  .pcard .foot .by { margin-left: auto; color: var(--faint); font-size: 11.5px; white-space: nowrap; }
  .pstack { display: flex; flex-direction: column; gap: 10px; }
  /* signals folded under a proposal */
  .sigs { display: none; grid-column: 2; flex-direction: column; gap: 3px; padding: 4px 0 2px 10px; border-left: 1px solid var(--line-soft); margin: -2px 0 2px 2px; }
  .sigs.open { display: flex; }
  .sig { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--muted); }
  .sig .sys { vertical-align: -1px; align-self: center; }
  .sig .kind { font-family: var(--mono); font-size: 10.5px; color: var(--faint); width: 40px; flex: none; }
  .sig .src { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; }
  .sig .vw { margin-left: auto; color: var(--faint); font-size: 11.5px; white-space: nowrap; }
  .sig .vw b { color: var(--muted); font-weight: var(--w-emph); }
  .sig.quiet { opacity: 0.66; }
  /* condensed proposal row */
  .prow { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--card-shadow); cursor: pointer; }
  .prow .t { font-weight: var(--w-emph); font-size: 13.5px; white-space: nowrap; }
  .prow[data-pri="low"] { opacity: 0.72; }
  .prow .sub { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 8px; align-items: center; }
  .prow .next { margin-left: auto; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .prow .next b { color: var(--ink); font-weight: var(--w-emph); }
  /* questions */
  .drow { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--card-shadow); }
  .drow .q { font-weight: var(--w-emph); font-size: 13.5px; white-space: nowrap; }
  .drow .from { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
  .drow .acts { margin-left: auto; gap: 2px; }
  .dstack { display: flex; flex-direction: column; gap: 6px; }
  /* FYI + receipt */
  .fyi { display: flex; gap: 12px; align-items: baseline; padding: 5px 2px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line-soft); }
  .fyi:first-of-type { border-top: 0; }
  .fyi .when { font-family: var(--mono); font-size: 11px; color: var(--faint); width: 44px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .fyi .sys { align-self: center; }
  .fyi .by { margin-left: auto; color: var(--faint); font-size: 11.5px; white-space: nowrap; }
  .digestline { display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--muted); font-size: 12.5px; padding: 2px 2px; }
  .digestline b { font-weight: var(--w-emph); color: var(--ink); font-variant-numeric: tabular-nums; }
  .digestline .chev { color: var(--faint); font-size: 10px; }
  .digest { display: none; flex-direction: column; opacity: 0.82; padding-top: 6px; }
  .digest.open { display: flex; }
  .ditem { display: flex; gap: 12px; align-items: baseline; padding: 5px 2px; font-size: 12.5px; }
  .ditem .when { font-family: var(--mono); font-size: 11px; color: var(--faint); width: 84px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .ditem .glyph { flex: none; width: 14px; text-align: center; font-size: 11.5px; }
  .ditem .vw { color: var(--faint); margin-left: auto; }

  /* ---- connection blocks ("what came in" / "across your systems") ---- */
  .cstack { display: flex; flex-direction: column; gap: 8px; }
  .cblock { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px 14px 8px; }
  .cblock .chead { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .cblock .chead b { font-weight: var(--w-emph); }
  .cblock .chead .sum { color: var(--muted); font-size: 12.5px; }
  .cblock .chead .warm { color: var(--attn); }
  .cblock .chead .n { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cblock .chead .chev { color: var(--faint); font-size: 10px; }
  .cblock .csigs { display: none; flex-direction: column; gap: 2px; padding: 8px 0 2px 22px; }
  .cblock.open .csigs { display: flex; }
  .cblock .more { color: var(--faint); font-size: 11.5px; padding-top: 3px; }

  /* ---- rail ---- */
  .pblock { display: flex; flex-direction: column; gap: 5px; }
  .pblock > .lane-label { margin-bottom: 3px; }
  .pline { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .pline b { font-weight: var(--w-emph); color: var(--ink); }
  .pline .warm { color: var(--attn); }
  .pline.sub { padding-left: 20px; margin-top: -3px; font-size: 11.5px; color: var(--faint); }
  .pline .n { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .legend { border-top: 1px solid var(--line-soft); padding-top: 16px; }
  .legend .lg { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--faint); padding: 2.5px 0; }
  .legend .lg .markcell { justify-content: flex-start; }

  /* ============ switcher + notes (not part of the design) ============ */
  .sw { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #17161a; color: #fff; border-radius: 999px; padding: 6px 8px; display: flex; align-items: center; gap: 4px; box-shadow: 0 6px 24px rgba(0,0,0,0.35); z-index: 50; font-family: var(--mono); }
  .sw .label { font-size: 12px; font-weight: 500; padding: 0 8px; min-width: 150px; text-align: center; }
  .sw button { background: none; border: 0; color: #fff; cursor: pointer; font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px; }
  .sw button:hover { background: rgba(255,255,255,0.14); }
  .sw button:focus-visible { outline: 2px solid #9a94e8; outline-offset: 1px; }
  .sw .ds { font-size: 11px; color: #c9c6d0; }
  .vnote { position: fixed; bottom: 62px; left: 50%; transform: translateX(-50%); max-width: 640px; text-align: center; font-family: var(--mono); font-size: 10.5px; color: #c9c6d0; background: rgba(23,22,26,0.92); border-radius: 8px; padding: 6px 12px; z-index: 50; }
</style>

<div class="app">
  <aside class="side">
    <div class="logo"><b>Hydra</b><span>v1 · rogier</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="chrome-foot">
      <button class="qbtn" id="legendbtn">Marks legend</button>
      <div class="proto-badge">PROTOTYPE · throwaway<br>ticket hydra#30 · round 2<br>&larr; &rarr; variant · d data · t theme · n name</div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h1 id="h1"></h1>
      <span class="when">Monday 08:30</span>

DATASETS.busy.brief = [
  "A heavy night: <b>614 events</b> over six connections. Two things matter: <a class=\"ref\" href=\"#p1\">Login failures on Safari after 2.3.1</a> (customers, Sentry and a GitHub issue all pointing at PR #109) and <a class=\"ref\" href=\"#p7\">Codex renamed outputSchema in 0.42</a>, which has already failed the nightly matrix twice.",
  "Two calls from you: an ACME invoice that looks like phishing, and Email triage tripped its bound at 07:51 with 14 emails waiting. Then <a class=\"ref\" href=\"#p2\">certs by Sep 3</a>, <a class=\"ref\" href=\"#p8\">hetzner-01 at 88% disk</a>, and five smaller proposals. I filed the Hetzner invoice, merged PR #90, snoozed 12 dependabot PRs, and sent four PRs to review.",
];

/* ============ helpers ============ */
const NAMES = ["Intake", "Incoming", "Proposed", "Desk", "Triage"];
const TOPICS = [["all", "All"], ["code", "Code"], ["business", "Business"], ["personal", "Personal"], ["ops", "Ops"]];
const eqEl = '<span class="eq" title="agent working"><i></i><i></i><i></i></span>';
const dmarkEl = '<span class="dmark" title="decision wanted">◆</span>';
const pmarkEl = '<span class="pmark" title="proposed (placeholder glyph)">◇</span>';
const priEl = (pri) => `<span class="pri" data-pri="${pri}" title="priority: ${pri}"><span class="bars"><i></i><i></i><i></i></span></span>`;
const qbtns = (arr) => arr.map((a, i) => `<button class="qbtn ${i === 0 ? "first" : ""}">${a}</button>`).join("");
const entEl = (k) => `<span class="ent ent-${k}" title="${k}"><i></i></span>`;
const crumb = (p) => p.proj ? `${p.proj} · ` : "";
const markFor = (s) => s.act === "working" ? eqEl : s.act === "paused" ? '<span class="pausemark">↻</span>' : s.act === "failed" ? '<span class="failg">✕</span>' : '<span class="okg">✓</span>';
const data = () => DATASETS[get("data") === "busy" ? "busy" : "calm"];
const pageName = () => NAMES[(+get("name") || 0) % NAMES.length];
let openSet = new Set();
let legendOn = false;

/* ============ shared blocks ============ */
const madeEl = (p) => p.made.map((m) => `<span class="syst">${sysEl(m.sys)}${m.t}</span>`).join("");
const sigEl = (s, withConn) => `<div class="sig">${sysEl(s.sys || "github", "faint")}<span class="kind">${s.k}</span><span>${s.t}</span>
  <span class="src">${withConn && s.conn ? s.conn + " · " : ""}${s.at}</span></div>`;

function pcardEl(p) {
  const open = openSet.has(p.id);
  return `<div class="pcard" data-pri="${p.pri}" id="${p.id}">
    <div class="tline">${pmarkEl}<span class="crumb">${crumb(p)}</span><span class="t">${p.t}</span>${priEl(p.pri)}<span class="age" data-age="${p.bucket}">${p.age}</span></div>
    <div class="fields">
      <span class="fl">made from</span><span class="fv made" data-open="${p.id}">${madeEl(p)}<span class="chev">${open ? "▾" : "▸"} ${p.sigs.length} signal${p.sigs.length > 1 ? "s" : ""}</span></span>
      <div class="sigs ${open ? "open" : ""}">${p.sigs.map((s) => sigEl(s, true)).join("")}</div>
      <span class="fl">why</span><span class="fv">${p.why}</span>
      <span class="fl">links</span><span class="fv">${p.link || '<span class="none">–</span>'}</span>
      <span class="fl">next</span><span class="fv next"><b>${p.next}</b></span>
    </div>
    <div class="foot"><span class="acts">${qbtns(p.actions)}</span><span class="by">${entEl("task")} task · proposed by ${p.by}</span></div>
  </div>`;
}
function prowEl(p) {
  return `<div class="prow" data-pri="${p.pri}" data-open="${p.id}" id="${p.id}">${pmarkEl}<span class="t">${p.t}</span>${priEl(p.pri)}
    <span class="sub">${crumb(p)}${madeEl(p)}</span><span class="next">→ <b>${p.actions[0]}</b></span><span class="age" data-age="${p.bucket}">${p.age}</span></div>`;
}
function proposalsEl(list, label = "Proposed") {
  const top = list.filter((p) => p.pri === "urgent" || p.pri === "high");
  const rest = list.filter((p) => !(p.pri === "urgent" || p.pri === "high"));
  return `<section class="lane"><div class="lane-label">${label} <span class="n">${list.length}</span></div>
    <div class="pstack">${top.map(pcardEl).join("")}${rest.map((p) => openSet.has(p.id) ? pcardEl(p) : prowEl(p)).join("")}</div></section>`;
}
function questionsEl(qs) {
  if (!qs.length) return "";
  return `<section class="lane"><div class="lane-label">Needs a call <span class="n">${qs.length}</span></div>
    <div class="dstack">${qs.map((q) => `<div class="drow">${dmarkEl}<span class="q">${q.q}</span><span class="from">${sysEl(q.sys, "faint")}${q.from}</span>
      <span class="age" data-age="${q.bucket}">${q.age}</span><span class="acts">${qbtns(q.actions)}</span></div>`).join("")}</div></section>`;
}
function fyiEl(fyi) {
  if (!fyi.length) return "";
  return `<section class="lane"><div class="lane-label">For your information <span class="n">${fyi.length}</span></div>
    ${fyi.map((f) => `<div class="fyi"><span class="when">${f.at}</span>${sysEl(f.sys, "faint")}<span>${f.t}</span><span class="by">${f.by}</span></div>`).join("")}</section>`;
}
function receiptLine(d) {
  const r = d.receipt;
  return `<section class="lane"><div class="digestline"><span class="chev">·</span>
    <span><b>${r.events}</b> events → <b>${d.proposals.length}</b> proposals · ${r.routed} routed to workflows · ${r.attached} attached to existing tasks · ${d.fyi.length} FYI · ${r.ignored} ignored</span></div></section>`;
}
function cblockEl(c) {
  const open = openSet.has(c.c);
  return `<div class="cblock ${open ? "open" : ""}">
    <div class="chead" data-open="${c.c}">${sysEl(c.sys, "lg")}<b>${c.c}</b><span class="sum">${c.sum}${c.warm ? ` · <span class="warm">${c.warm}</span>` : ""}</span>
      <span class="n">${c.n} events${c.polled ? ` · polled ${c.polled} ago` : ""}</span><span class="chev">${open ? "▾" : "▸"}</span></div>
    <div class="csigs">
      ${c.sigs.map((s) => `<div class="sig">${sysEl(s.sys || c.sys, "faint")}<span class="kind">${s.k}</span><span>${s.t}</span>
        <span class="vw">${s.ref ? `<a class="ref" href="#${s.ref}" style="font-weight:400;color:var(--muted)">${s.vw}</a>` : s.vw}</span></div>`).join("")}
      ${c.quiet ? `<div class="more">and quietly: ${c.quiet}</div>` : ""}
    </div></div>`;
}
function connsEl(conns, label) {
  return `<section class="lane"><div class="lane-label">${label} <span class="n">${conns.length}</span></div>
    <div class="cstack">${conns.map(cblockEl).join("")}</div></section>`;
}
function sourcesRail(d) {
  return `<div class="pblock"><div class="lane-label">Sources</div>
    ${d.conns.map((c) => `<div class="pline">${sysEl(c.sys)}<span><b>${c.c}</b></span><span class="n">${c.n}${c.polled ? ` · ${c.polled}` : ""}</span></div>
      <div class="pline sub">${c.warm ? `<span class="warm">${c.warm}</span>` : c.sum}</div>`).join("")}</div>`;
}
function triageRail(d) {
  return `<div class="pblock"><div class="lane-label">Triage</div>
    ${d.triage.map((w) => `<div class="pline"><span class="markcell" style="width:auto">${markFor(w)}</span><span><b>${w.name}</b> · <span${w.tone === "warn" ? ' class="warm"' : ""}>${w.note}</span></span></div>`).join("")}</div>
    <div class="pblock"><div class="lane-label">Check-in</div><div class="pline"><span>${d.checkin.decisions} decisions wait · ${d.checkin.working} strands in motion</span></div></div>`;
}
function legendEl() {
  if (!legendOn) return "";
  return `<div class="pblock legend"><div class="lane-label">Marks <span class="n" style="text-transform:none;letter-spacing:0">· iconography TBD (#35)</span></div>
    <div class="lg"><span class="markcell">${pmarkEl}</span><span>proposed, wants a go/no-go</span></div>
    <div class="lg"><span class="markcell">${dmarkEl}</span><span>decision wanted</span></div>
    <div class="lg"><span class="markcell">${eqEl}</span><span>agent working</span></div>
    <div class="lg"><span class="markcell"><span class="pausemark">↻</span></span><span>paused</span></div>
    <div class="lg"><span class="markcell"><span class="okg">✓</span></span><span>done</span></div>
    <div class="lg"><span class="markcell"><span class="failg">✕</span></span><span>failed</span></div>
    ${["github", "gmail", "sentry", "tailscale", "hetzner", "dependabot", "cron", "hydra"].map((k) => `<div class="lg"><span class="markcell">${sysEl(k)}</span><span>${k === "hydra" ? "Hydra itself (platform events)" : k}</span></div>`).join("")}
    <div class="lg"><span class="markcell">${priEl("high")}</span><span>priority (bars fill up)</span></div>
    <div class="lg"><span class="markcell"><span class="age" data-age="old">5h</span></span><span>waiting: darkens, then warms</span></div></div>`;
}
function headline(d) {
  return `<div class="headline"><b>${d.proposals.length}</b> proposals formed from <b>${d.receipt.events}</b> events${d.questions.length ? ` · <span class="warm">${d.questions.length} need a call</span>` : ""} · ${d.fyi.length} FYI · ${d.receipt.ignored} handled quietly</div>`;
}

/* ============ A · Brief ============ */
function renderBrief(d) {
  return `<div class="layout"><div class="maincol">
    <div class="brief">${d.brief.map((p) => `<p>${p}</p>`).join("")}
      <div class="by">${sysEl("hydra", "faint")}<span>Morning brief · run 516 · 08:00 · written by Hera</span></div></div>
    ${questionsEl(d.questions)}
    ${proposalsEl(d.proposals)}
    ${fyiEl(d.fyi)}
    ${receiptLine(d)}
  </div><aside class="rail">${sourcesRail(d)}${triageRail(d)}${legendEl()}</aside></div>`;
}

/* ============ B · Topics ============ */
function renderTopics(d) {
  const cur = get("topic") || "all";
  const inT = (x) => cur === "all" || x.topic === cur;
  const counts = Object.fromEntries(TOPICS.map(([k]) => [k, d.proposals.filter((p) => k === "all" || p.topic === k).length]));
  const tabs = TOPICS.filter(([k]) => k === "all" || counts[k] || d.conns.some((c) => c.topic === k))
    .map(([k, l]) => `<button class="tab ${k === cur ? "on" : ""}" data-topic="${k}">${l}<span class="n">${counts[k]}</span></button>`).join("");
  const conns = d.conns.filter(inT);
  return `<div class="layout"><div class="maincol">
    ${headline(d)}
    <div class="tabs">${tabs}</div>
    ${questionsEl(d.questions.filter(inT))}
    ${proposalsEl(d.proposals.filter(inT))}
    ${conns.length ? connsEl(conns, "What came in") : ""}
    ${fyiEl(d.fyi.filter(inT))}
    ${cur === "all" ? receiptLine(d) : ""}
  </div><aside class="rail">${triageRail(d)}${legendEl()}</aside></div>`;
}

/* ============ C · Systems ============ */
function renderSystems(d) {
  return `<div class="layout"><div class="maincol">
    ${headline(d)}
    ${questionsEl(d.questions)}
    ${proposalsEl(d.proposals)}
    ${connsEl(d.conns, "Across your systems")}
    ${fyiEl(d.fyi)}
    ${receiptLine(d)}
  </div><aside class="rail">${triageRail(d)}${legendEl()}</aside></div>`;
}

/* ============ page ============ */
const variants = [
  { key: "A", name: "Brief", render: renderBrief, note: "A · Narrative-first: the morning brief opens the page and links into the proposals; signals fold under each card; sources in the rail." },
  { key: "B", name: "Topics", render: renderTopics, note: "B · Topic-first: tabs group connections and proposals (Code / Business / Personal / Ops); each tab shows what came in per connection." },
  { key: "C", name: "Systems", render: renderSystems, note: "C · Verdict-first: proposals, then \"Across your systems\" - one block per connection, notable signals stamped with what triage made of them." },
];
function params() { return new URLSearchParams(location.search); }
function get(k) { return params().get(k); }
function setParam(k, v) { const p = params(); p.set(k, v); try { history.replaceState(null, "", "?" + p.toString()); } catch (e) {} }
function current() { const k = (get("variant") || "A").toUpperCase(); const i = variants.findIndex((v) => v.key === k); return i === -1 ? 0 : i; }
function show(i) { setParam("variant", variants[(i + variants.length) % variants.length].key); render(); }
function navEl(d) {
  const items = [[pageName(), d.proposals.length + d.questions.length, true], ["Check-in", d.checkin.decisions, false],
    ["Tasks"], ["Sessions"], ["Runs"], ["Workflows"], null, ["Fleet"], ["Connections"], ["Notifications", 5], ["Settings"]];
  return items.map((it) => it === null ? '<div class="sep"></div>' : `<a href="#" class="${it[2] ? "on" : ""}">${it[0]}${it[1] !== undefined ? ` <span class="count">${it[1]}</span>` : ""}</a>`).join("");
}
function render() {
  const v = variants[current()];
  const d = data();
  document.getElementById("nav").innerHTML = navEl(d);
  document.getElementById("h1").textContent = pageName();
  document.getElementById("stage").innerHTML = v.render(d);
  document.getElementById("swlabel").textContent = v.key + " · " + v.name;
  document.getElementById("vnote").textContent = v.note;
  document.getElementById("dsbtn").textContent = get("data") === "busy" ? "busy" : "calm";
}
document.getElementById("stage").addEventListener("click", (e) => {
  const ref = e.target.closest("a.ref");
  if (ref) { e.preventDefault(); const id = ref.getAttribute("href").slice(1); openSet.add(id); render();
    const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (e.target.closest(".qbtn")) return; /* fake actions do nothing */
  const tab = e.target.closest("[data-topic]");
  if (tab) { setParam("topic", tab.dataset.topic); render(); return; }
  const o = e.target.closest("[data-open]");
  if (o) { const id = o.dataset.open; openSet.has(id) ? openSet.delete(id) : openSet.add(id); render(); }
});
function toggleData() { setParam("data", get("data") === "busy" ? "calm" : "busy"); openSet = new Set(); render(); }
function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  root.dataset.theme = dark ? "light" : "dark";
}
function cycleName() { setParam("name", ((+get("name") || 0) + 1) % NAMES.length); render(); }
document.getElementById("prev").addEventListener("click", () => show(current() - 1));
document.getElementById("next").addEventListener("click", () => show(current() + 1));
document.getElementById("dsbtn").addEventListener("click", toggleData);
document.getElementById("theme").addEventListener("click", toggleTheme);
document.getElementById("legendbtn").addEventListener("click", () => { legendOn = !legendOn; render(); });
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") show(current() - 1);
  if (e.key === "ArrowRight") show(current() + 1);
  if (e.key === "d") toggleData();
  if (e.key === "t") toggleTheme();
  if (e.key === "n") cycleName();
});
render();
</script>
