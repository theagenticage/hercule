<!--
  PROTOTYPE - throwaway. Ticket: https://github.com/rogierpennink/hydra/issues/1 -> #30
  ROUND 1. Three variants of the Intake surface, switchable via ?variant=A|B|C,
  built in the pinned design language (docs/design-language.md) with the check-in
  prototype's chrome (branch prototype/check-in-view) so the two can be compared honestly.
  The question this round must earn: is Intake a second view, or a lane of the check-in spine?
    A Desk   - Intake is its own page: proposals as dossier cards, ranked by priority,
               FYI and "handled without you" beneath, sources + triage in the rail.
    B Spine  - one page ("Today"): the check-in page with a Proposed lane inserted;
               urgent proposals break into Needs-you as ordinary decisions.
    C Ledger - Intake is its own page, but time-first: a stream of what came in and what
               the agents made of it (proposed / FYI / routed / attached / ignored),
               raw signals folded under each entry.
  Everything shown maps onto primitives: a proposal = a Task (label "proposed") + its
  pending decision Notification; enrichment = the task description; grouping = provenance
  refs; the receipt = triage run records. If something on screen has no primitive, that is
  the design smell the ticket asks us to catch - see the notes under the switcher.
  Keys: ← → variant · d dataset (calm/busy) · t theme · n cycle the working name.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydra Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ============ tokens: pinned Midnight (docs/design-language.md) ============ */
  :root {
    --bg:      oklch(94.5% 0.0156 265);
    --surface: oklch(96.7% 0.0125 265);
    --raised:  oklch(100% 0.0078 265);
    --ink:     oklch(23% 0.0100 265);
    --muted:   oklch(48% 0.0156 265);
    --faint:   oklch(66% 0.0156 265);
    --line:      oklch(23% 0.0100 265 / 0.10);
    --line-soft: oklch(23% 0.0100 265 / 0.055);
    --card-shadow: 0 1px 2px rgba(23,26,33,0.05);
    --lift-shadow: 0 1px 2px rgba(23,26,33,0.06), 0 4px 14px rgba(23,26,33,0.06);
    --attn: #8a6116; --fail: #a34e46; --ok: #48745a; --live: #48717f;
    --attn-soft: rgba(138,97,22,0.09);
    --proj-hydra: #7d7ab0; --proj-ops: #a67f92;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:      oklch(20%   0.0288 265);
      --surface: oklch(22.2% 0.0288 265);
      --raised:  oklch(25.5% 0.0259 265);
      --ink:     oklch(90% 0.0080 265);
      --muted:   oklch(68% 0.0288 265);
      --faint:   oklch(50% 0.0288 265);
      --line:      oklch(90% 0.0288 265 / 0.10);
      --line-soft: oklch(90% 0.0288 265 / 0.06);
      --card-shadow: 0 1px 2px rgba(0,0,0,0.35);
      --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05),
                     0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
      --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8;
      --attn-soft: rgba(208,161,71,0.12);
      --proj-hydra: #9490c9; --proj-ops: #bd93a8;
    }
  }
  :root[data-theme="dark"] {
    --bg:      oklch(20%   0.0288 265);
    --surface: oklch(22.2% 0.0288 265);
    --raised:  oklch(25.5% 0.0259 265);
    --ink:     oklch(90% 0.0080 265);
    --muted:   oklch(68% 0.0288 265);
    --faint:   oklch(50% 0.0288 265);
    --line:      oklch(90% 0.0288 265 / 0.10);
    --line-soft: oklch(90% 0.0288 265 / 0.06);
    --card-shadow: 0 1px 2px rgba(0,0,0,0.35);
    --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05),
                   0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
    --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8;
    --attn-soft: rgba(208,161,71,0.12);
    --proj-hydra: #9490c9; --proj-ops: #bd93a8;
  }
  :root {
    --sans: "Onest", -apple-system, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --w-emph: 500;
    --w-urgent: 600;
  }

  /* ============ base ============ */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  .mono { font-family: var(--mono); }
  .app { display: flex; min-height: 100vh; }
  code { font-family: var(--mono); font-size: 12px; background: var(--line-soft); padding: 1px 5px; border-radius: 4px; font-weight: 400; }

  /* ---------- chrome (shared shell, identical to check-in) ---------- */
  .side { width: 204px; flex: none; background: var(--surface); border-right: 1px solid var(--line-soft);
    display: flex; flex-direction: column; padding: 16px 10px; position: sticky; top: 0; height: 100vh; }
  .logo { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px 16px; }
  .logo b { font-size: 15px; letter-spacing: 0.01em; font-weight: var(--w-emph); }
  .logo span { font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav a { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; border-radius: 6px;
    color: var(--muted); text-decoration: none; font-size: 13px; }
  .nav a.on { background: var(--line-soft); color: var(--ink); font-weight: var(--w-emph); }
  .nav a:not(.on):hover { background: var(--line-soft); }
  .nav a:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .nav .count { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .nav .sep { height: 1px; background: var(--line-soft); margin: 8px 10px; }
  .chrome-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .chrome-foot .qbtn { align-self: flex-start; font-size: 11.5px; color: var(--faint); }
  .proto-badge { border: 1px dashed var(--attn); color: var(--attn); background: var(--attn-soft);
    border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 10px; line-height: 1.5; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: baseline; gap: 14px; padding: 24px 32px 0; }
  .topbar h1 { font-size: 18px; margin: 0; letter-spacing: -0.015em; font-weight: var(--w-emph); }
  .topbar .when { color: var(--muted); font-size: 13px; }
  #stage { padding: 16px 32px 150px; }

  /* ============ layout: main + rail ============ */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 44px; align-items: start; max-width: 1100px; }
  .maincol { display: flex; flex-direction: column; }
  .maincol .lane { margin-bottom: 30px; }
  .maincol .lane > .lane-label { margin-bottom: 10px; }
  .rail { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 22px; }

  /* ============ shared atoms (from check-in) ============ */
  .lane-label { text-transform: uppercase; letter-spacing: 0.1em; font-size: 10.5px; font-weight: var(--w-emph); color: var(--faint);
    display: flex; align-items: center; gap: 8px; }
  .lane-label .n { font-family: var(--mono); font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .lane-label .pdot { width: 7px; height: 7px; border-radius: 2px; flex: none; }
  .headline { font-size: 13.5px; color: var(--muted); padding-bottom: 20px; }
  .headline b { color: var(--ink); font-weight: var(--w-emph); font-variant-numeric: tabular-nums; }
  .headline .warm { color: var(--attn); font-weight: var(--w-emph); }

  .eq { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 10px; width: 11px; flex: none; }
  .eq i { width: 2.5px; border-radius: 1px; background: var(--live); height: 4px; animation: eqb 1.15s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: 0.22s; } .eq i:nth-child(3) { animation-delay: 0.44s; }
  @keyframes eqb { 0%, 100% { height: 3px; } 50% { height: 9px; } }
  @keyframes pulse { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) {
    .eq i { animation: none !important; }
    .eq i:nth-child(1) { height: 4px; } .eq i:nth-child(2) { height: 8px; } .eq i:nth-child(3) { height: 5px; }
    .dot, .prog i { animation: none !important; }
  }
  .dmark { color: var(--attn); font-size: 9px; flex: none; position: relative; top: -1px; }
  .pmark { color: var(--faint); font-size: 10px; flex: none; position: relative; top: -1px; } /* ◇ proposed (placeholder glyph) */
  .okg { color: var(--ok); } .failg { color: var(--fail); } .cang { color: var(--faint); }
  .qmark { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; display: inline-block; }
  .pausemark { color: var(--attn); font-size: 12px; flex: none; }
  .markcell { width: 16px; flex: none; display: inline-flex; justify-content: center; align-items: center; font-size: 12px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); flex: none; animation: pulse 2.4s ease-in-out infinite; display: inline-block; }
  .idledot { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; display: inline-block; }

  .prog { display: inline-flex; align-items: center; gap: 2px; flex: none; }
  .prog i { width: 8px; height: 3px; border-radius: 2px; background: var(--line); }
  .prog i.d { background: var(--muted); }
  .prog i.c { background: var(--live); animation: pulse 2.4s ease-in-out infinite; }
  .prog .t { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-left: 5px; font-variant-numeric: tabular-nums; }

  .pri { display: inline-flex; align-items: center; flex: none; }
  .pri .bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 9px; }
  .pri .bars i { width: 2.5px; border-radius: 1px; background: var(--line); }
  .pri .bars i:nth-child(1) { height: 3.5px; } .pri .bars i:nth-child(2) { height: 6px; } .pri .bars i:nth-child(3) { height: 9px; }
  .pri[data-pri="low"]    .bars i:nth-child(1) { background: var(--faint); }
  .pri[data-pri="normal"] .bars i:nth-child(-n+2) { background: var(--muted); }
  .pri[data-pri="high"]   .bars i { background: var(--muted); }
  .pri[data-pri="urgent"] .bars i { background: var(--ink); }

  .age { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
  .age[data-age="recent"] { color: var(--muted); }
  .age[data-age="stale"]  { color: var(--ink); }
  .age[data-age="old"]    { color: var(--attn); font-weight: 500; }

  .qbtn { font-family: var(--sans); font-size: 12px; line-height: 1; font-weight: var(--w-emph); border: 0; background: none; color: var(--muted);
    padding: 6px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .qbtn:hover { background: var(--line-soft); color: var(--ink); }
  .qbtn.first { color: var(--ink); }
  .qbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .qbtn[disabled] { opacity: 0.4; cursor: default; }
  .acts { display: flex; gap: 4px; align-items: center; margin-left: -9px; }

  .ent { display: inline-flex; width: 13px; justify-content: center; align-items: center; flex: none; vertical-align: -1px; }
  .ent-task i { width: 8px; height: 8px; border: 1.5px solid var(--faint); border-radius: 2.5px; display: block; }
  .ent-run i { width: 0; height: 0; display: block; border-left: 7px solid var(--faint); border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
  .ent-sess i { width: 9px; height: 7px; display: block;
    background: linear-gradient(var(--faint), var(--faint)) 0 0 / 9px 1.5px no-repeat, linear-gradient(var(--faint), var(--faint)) 0 4px / 6px 1.5px no-repeat; }

  /* ---- decision card (check-in Focus, reused verbatim) ---- */
  .dcard { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--lift-shadow);
    padding: 14px 18px 11px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; }
  .dcard .qline { display: flex; align-items: baseline; gap: 10px; }
  .dcard .q { font-size: 15px; font-weight: var(--w-emph); letter-spacing: -0.008em; }
  .dcard[data-pri="urgent"] .q { font-size: 16px; font-weight: var(--w-urgent); }
  .dcard .qline .age { margin-left: auto; }
  .dcard .fields { display: grid; grid-template-columns: 52px minmax(0, 1fr); grid-template-rows: repeat(3, 21px); gap: 4px 14px; font-size: 12.5px; }
  .dcard .fields .fv { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .fl { text-transform: uppercase; letter-spacing: 0.09em; font-size: 10px; color: var(--faint); font-weight: var(--w-emph); padding-top: 2px; }
  .fv { color: var(--muted); }
  .fv b { color: var(--ink); font-weight: var(--w-emph); }
  .fv .none { color: var(--faint); }
  .focusnav { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 12px; padding-top: 8px; }
  .focusnav .ct { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
  .focusnav .qbtn { padding: 4px 8px; }
  .nextpeek { color: var(--faint); font-size: 12px; }
  .nextpeek b { color: var(--muted); font-weight: var(--w-emph); }
  .alldone { border: 1px solid var(--line-soft); border-radius: 10px; padding: 14px 18px; color: var(--muted); font-size: 13px; background: var(--surface); }

  /* ---- A: proposal dossier card ---- */
  .pcard { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--lift-shadow);
    padding: 14px 18px 11px; display: flex; flex-direction: column; gap: 9px; }
  .pcard .tline { display: flex; align-items: baseline; gap: 10px; }
  .pcard .crumb { color: var(--faint); font-size: 12px; white-space: nowrap; }
  .pcard .t { font-size: 15px; font-weight: var(--w-emph); letter-spacing: -0.008em; }
  .pcard[data-pri="urgent"] .t { font-size: 16px; font-weight: var(--w-urgent); }
  .pcard[data-pri="low"] { opacity: 0.8; }
  .pcard .tline .age { margin-left: auto; }
  .pcard .fields { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 5px 14px; font-size: 12.5px; }
  .pcard .fv { line-height: 1.45; }
  .pcard .fv.next b { color: var(--ink); }
  .pcard .foot { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line-soft); padding-top: 8px; margin-top: 2px; }
  .pcard .foot .by { margin-left: auto; color: var(--faint); font-size: 11.5px; white-space: nowrap; }
  .pstack { display: flex; flex-direction: column; gap: 10px; }

  /* condensed proposal row (A's lower tier, expands into a card in place) */
  .prow { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--raised); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--card-shadow); cursor: pointer; }
  .prow .t { font-weight: var(--w-emph); font-size: 13.5px; white-space: nowrap; }
  .prow[data-pri="low"] { opacity: 0.72; }
  .prow .sub { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .next { margin-left: auto; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .prow .next b { color: var(--ink); font-weight: var(--w-emph); }

  /* questions (unsure verdicts, tripped breakers): condensed decision rows */
  .drow { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--raised); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--card-shadow); }
  .drow .q { font-weight: var(--w-emph); font-size: 13.5px; white-space: nowrap; }
  .drow .from { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drow .acts { margin-left: auto; gap: 2px; }
  .dstack { display: flex; flex-direction: column; gap: 6px; }

  /* FYI lines + receipt digest */
  .fyi { display: flex; gap: 12px; align-items: baseline; padding: 5px 2px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line-soft); }
  .fyi:first-of-type { border-top: 0; }
  .fyi .when { font-family: var(--mono); font-size: 11px; color: var(--faint); width: 44px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .fyi .by { margin-left: auto; color: var(--faint); font-size: 11.5px; white-space: nowrap; }
  .digestline { display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--muted); font-size: 12.5px; padding: 2px 2px; }
  .digestline b { font-weight: var(--w-emph); color: var(--ink); font-variant-numeric: tabular-nums; }
  .digestline .chev { color: var(--faint); font-size: 10px; }
  .digest { display: none; flex-direction: column; opacity: 0.82; padding-top: 6px; }
  .digest.open { display: flex; }
  .ditem { display: flex; gap: 12px; align-items: baseline; padding: 5px 2px; font-size: 12.5px; }
  .ditem .when { font-family: var(--mono); font-size: 11px; color: var(--faint); width: 84px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .ditem .glyph { flex: none; width: 14px; text-align: center; font-size: 11.5px; }
  .ditem .vw { color: var(--faint); }

  /* ---- B: strands (check-in rows, reused) ---- */
  .tier { margin-top: 14px; }
  .tier:first-of-type { margin-top: 0; }
  .tier > .lane-label { margin-bottom: 2px; }
  .strand { border-top: 1px solid var(--line-soft); padding: 9px 2px; }
  .strand:first-of-type { border-top: 0; }
  .strand .row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .strand .name { font-weight: var(--w-emph); font-size: 13.5px; letter-spacing: -0.004em; white-space: nowrap; }
  .strand[data-pri="urgent"] .name { font-weight: var(--w-urgent); }
  .strand[data-pri="low"] { opacity: 0.72; }
  .strand .sub { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strand .note { color: var(--muted); font-size: 12.5px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strand .note b { color: var(--ink); font-weight: var(--w-emph); }
  .strand .note[data-tone="warn"] { color: var(--attn); }
  .strand .note[data-tone="fail"] { color: var(--fail); }
  .strand .detail { display: none; }
  .strand.open .detail { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 4px 26px; padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: 8px; font-size: 12.5px; color: var(--muted); }
  .strand .detail .dl { display: flex; align-items: baseline; gap: 9px; }
  .strand .detail .dl .fl { width: 44px; flex: none; }

  /* ---- C: ledger ---- */
  .ledger { display: flex; flex-direction: column; }
  .lday { margin-bottom: 18px; }
  .lday > .lane-label { margin-bottom: 6px; }
  .lrow { display: grid; grid-template-columns: 44px 16px minmax(0, 1fr) auto; gap: 0 12px; align-items: baseline;
    padding: 6px 2px; border-top: 1px solid var(--line-soft); font-size: 12.5px; color: var(--muted); }
  .lrow:first-of-type { border-top: 0; }
  .lrow .when { font-family: var(--mono); font-size: 11px; color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; }
  .lrow .glyph { text-align: center; font-size: 11.5px; }
  .lrow .vw { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
  .lrow .vw b { color: var(--muted); font-weight: var(--w-emph); }
  .lrow.quiet { opacity: 0.66; }
  .lrow.quiet .body { color: var(--faint); }
  /* a proposal in the ledger lifts onto the raised layer, in-stream */
  .lprop { margin: 6px 0; padding: 12px 16px 9px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--card-shadow); display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 2px 12px; }
  .lprop .when { font-family: var(--mono); font-size: 11px; color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; padding-top: 3px; }
  .lprop .body { display: flex; flex-direction: column; gap: 5px; }
  .lprop .tline { display: flex; align-items: baseline; gap: 10px; }
  .lprop .t { font-size: 14px; font-weight: var(--w-emph); color: var(--ink); }
  .lprop[data-pri="urgent"] .t { font-weight: var(--w-urgent); font-size: 15px; }
  .lprop[data-pri="low"] { opacity: 0.8; }
  .lprop .tline .vw { margin-left: auto; color: var(--faint); font-size: 11.5px; white-space: nowrap; }
  .lprop .why { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .lprop .link { font-size: 12.5px; color: var(--muted); }
  .lprop .sigline { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); cursor: pointer; }
  .lprop .sigline .chev { font-size: 10px; }
  .sigs { display: none; flex-direction: column; gap: 3px; padding: 6px 0 2px 14px; border-left: 1px solid var(--line-soft); margin-left: 4px; }

    <div class="pblock">
      <div class="lane-label">Triage</div>
      ${t.map((w) => `<div class="pline"><span class="markcell" style="width:auto">${markFor(w)}</span><span><b>${w.name}</b> · <span${w.tone === "warn" ? ' class="warm"' : ""}>${w.note}</span></span></div>`).join("")}
    </div>
    ${opts.checkin ? `<div class="pblock"><div class="lane-label">Check-in</div>
      <div class="pline"><span>${opts.checkin.decisions.length} decisions wait · ${opts.checkin.youAsked.length} strands in motion</span></div></div>` : ""}
    ${legendEl()}`;
}
function legendEl() {
  if (!legendOn) return "";
  return `<div class="pblock legend">
    <div class="lane-label">Marks <span class="n" style="text-transform:none;letter-spacing:0">· iconography TBD (#35)</span></div>
    <div class="lg"><span class="markcell">${pmarkEl}</span><span>proposed, wants a go/no-go</span></div>
    <div class="lg"><span class="markcell">${dmarkEl}</span><span>decision wanted</span></div>
    <div class="lg"><span class="markcell">${eqEl}</span><span>agent working</span></div>
    <div class="lg"><span class="markcell"><span class="pausemark">↻</span></span><span>paused</span></div>
    <div class="lg"><span class="markcell"><span class="okg">✓</span></span><span>done</span></div>
    <div class="lg"><span class="markcell"><span class="failg">✕</span></span><span>failed</span></div>
    <div class="lg"><span class="markcell"><span class="cang">→</span></span><span>routed to a workflow</span></div>
    <div class="lg"><span class="markcell"><span class="cang">+</span></span><span>attached to a task</span></div>
    <div class="lg"><span class="markcell">${entEl("task")}</span><span>task</span></div>
    <div class="lg"><span class="markcell">${priEl("high")}</span><span>priority (bars fill up)</span></div>
    <div class="lg"><span class="markcell"><span class="age" data-age="old">5h</span></span><span>waiting: darkens, then warms</span></div>
  </div>`;
}

/* ============ A · Desk ============ */
function pcardEl(p) {
  return `<div class="pcard" data-pri="${p.pri}" data-id="${p.id}">
    <div class="tline">${pmarkEl}<span class="crumb">${crumb(p)}</span><span class="t">${p.t}</span>${priEl(p.pri)}<span class="age" data-age="${p.bucket}">${p.age}</span></div>
    <div class="fields">
      <span class="fl">made from</span><span class="fv">${p.made}</span>
      <span class="fl">why</span><span class="fv">${p.why}</span>
      <span class="fl">links</span><span class="fv">${p.link || '<span class="none">–</span>'}</span>
      <span class="fl">next</span><span class="fv next"><b>${p.next}</b></span>
    </div>
    <div class="foot"><span class="acts">${qbtns(p.actions)}</span><span class="by">${entEl("task")} task · proposed by ${p.by}</span></div>
  </div>`;
}
function prowEl(p) {
  return `<div class="prow" data-pri="${p.pri}" data-open="${p.id}">${pmarkEl}<span class="t">${p.t}</span>${priEl(p.pri)}
    <span class="sub">${crumb(p)}from ${p.made}</span><span class="next">→ <b>${p.actions[0]}</b></span><span class="age" data-age="${p.bucket}">${p.age}</span></div>`;
}
function renderDesk(d) {
  const top = d.proposals.filter((p) => p.pri === "urgent" || p.pri === "high");
  const rest = d.proposals.filter((p) => !(p.pri === "urgent" || p.pri === "high"));
  const n = d.proposals.length;
  return `<div class="layout"><div class="maincol">
    <div class="headline"><b>${n}</b> proposals formed from <b>${d.receipt.events}</b> events${d.questions.length ? ` · <span class="warm">${d.questions.length} need a call</span>` : ""} · ${d.fyi.length} FYI · ${d.receipt.ignored} handled quietly</div>
    ${questionsEl(d.questions)}
    <section class="lane">
      <div class="lane-label">Proposed <span class="n">${n}</span></div>
      <div class="pstack">
        ${top.map(pcardEl).join("")}
        ${rest.map((p) => openSet.has(p.id) ? pcardEl(p) : prowEl(p)).join("")}
      </div>
    </section>
    ${fyiEl(d.fyi)}
    ${receiptEl(d)}
  </div><aside class="rail">${sourcesRail(d, { checkin: d.checkin })}</aside></div>`;
}

/* ============ B · Spine (check-in page + Proposed lane) ============ */
function dcardEl(dec) {
  return `<div class="dcard" data-pri="${dec.pri}">
    <div class="qline">${dmarkEl}<span class="q">${dec.q}</span><span class="age" data-age="${dec.bucket}">waiting ${dec.age}</span></div>
    <div class="fields">
      <span class="fl">from</span><span class="fv"><b>${dec.from}</b> ${entEl(dec.kind.startsWith("task") ? "task" : dec.kind.startsWith("run") ? "run" : "task")}${dec.kind} ${priEl(dec.pri)}</span>
      <span class="fl">why</span><span class="fv">${dec.why}</span>
      <span class="fl">agent</span><span class="fv">${dec.agent ? entEl("sess") + dec.agent : '<span class="none">–</span>'}</span>
    </div>
    <div class="acts">${qbtns(dec.actions)}</div></div>`;
}
function focusEl(decs) {
  const n = decs.length;
  if (!n) return `<div class="alldone">Nothing needs you.</div>`;
  focusIdx = Math.min(focusIdx, n - 1);
  const next = decs[focusIdx + 1];
  return `${dcardEl(decs[focusIdx])}
    <div class="focusnav">
      <button class="qbtn" data-fnav="-1" ${focusIdx === 0 ? "disabled" : ""}>&larr;</button>
      <span class="ct">${focusIdx + 1} of ${n}</span>
      <button class="qbtn" data-fnav="1" ${focusIdx === n - 1 ? "disabled" : ""}>&rarr;</button>
      ${next ? `<span class="nextpeek">next: <b>${stripTags(next.q)}</b> · ${next.age}</span>` : ""}
    </div>`;
}
function strandEl(s, id) {
  return `<div class="strand" data-pri="${s.pri || "normal"}" data-id="${id}">
    <div class="row" data-toggle="${id}">
      <span class="markcell">${markFor(s)}</span><span class="name">${s.name}</span>${s.pri ? priEl(s.pri) : ""}
      <span class="sub">${s.sub}</span>${s.prog ? progEl(s.prog) : ""}
      <span class="note"${s.tone ? ` data-tone="${s.tone}"` : ""}>${s.note || ""}</span><span class="age" data-age="${s.bucket}">${s.age}</span>
    </div></div>`;
}
function proposalStrandEl(p) {
  return `<div class="strand ${openSet.has(p.id) ? "open" : ""}" data-pri="${p.pri}" data-id="${p.id}">
    <div class="row" data-toggle="${p.id}">
      <span class="markcell">${pmarkEl}</span><span class="name">${p.t}</span>${priEl(p.pri)}
      <span class="sub">${crumb(p)}task · from ${p.made}</span>
      <span class="note">→ <b>${p.actions[0]}</b></span><span class="age" data-age="${p.bucket}">${p.age}</span>
    </div>
    <div class="detail">
      <div class="dl"><span class="fl">why</span><span>${p.why}</span></div>
      ${p.link ? `<div class="dl"><span class="fl">links</span><span>${p.link}</span></div>` : ""}
      <div class="dl"><span class="fl">by</span><span>${p.by}</span></div>
      <div class="dl"><span class="acts">${qbtns(p.actions)}</span></div>
    </div></div>`;
}
function renderSpine(d) {
  const c = d.checkin;
  /* urgent proposals become ordinary decisions in Needs-you; the rest stay a lane */
  const promoted = d.proposals.filter((p) => p.pri === "urgent").map((p) => ({
    prov: "intake", pri: p.pri, q: `${p.actions[0]} for ${p.t}?`, from: p.t, kind: "task · proposed",
    why: stripTags(p.why), agent: `${p.by} (triage)`, age: p.age, bucket: p.bucket, actions: p.actions }));
  const decisions = [...c.decisions.filter((x) => x.prov === "you"), ...promoted, ...c.decisions.filter((x) => x.prov !== "you")];
  const lane = d.proposals.filter((p) => p.pri !== "urgent");
  const working = c.youAsked.filter((s) => s.act === "working").length + c.routine.filter((s) => s.act === "working").length;
  const landed = c.landed.ok + c.landed.fail + c.landed.cancelled;
  return `<div class="layout"><div class="maincol">
    <div class="headline"><span class="warm">${decisions.length} decisions wait</span> · <b>${lane.length}</b> proposals · <b>${working}</b> strands in motion · <b>${landed}</b> outcomes today</div>
    <section class="lane"><div class="lane-label">Needs you <span class="n">${decisions.length}</span></div>${focusEl(decisions)}</section>
    <section class="lane"><div class="lane-label">Proposed <span class="n">${lane.length}</span></div>
      <div class="tier">${lane.map(proposalStrandEl).join("")}</div></section>
    <section class="lane"><div class="lane-label" style="margin-bottom:10px">In motion</div>
      <div class="tier"><div class="lane-label">Started by you <span class="n">${c.youAsked.length}</span></div>${c.youAsked.map((s, i) => strandEl(s, "y" + i)).join("")}</div>
      <div class="tier"><div class="lane-label">Routine <span class="n">${c.routine.length}</span></div>${c.routine.map((s, i) => strandEl(s, "r" + i)).join("")}</div>
    </section>
    <section class="lane"><div class="digestline"><span class="chev">▸</span><span><b>${landed}</b> outcomes today · <span class="okg">✓</span> ${c.landed.ok} · <span class="failg">✕</span> ${c.landed.fail} · – ${c.landed.cancelled}</span></div></section>
  </div><aside class="rail">
    <div class="pblock"><div class="lane-label">Fleet</div>${c.fleet.map((p) => `<div class="pline">${p.live ? '<span class="dot"></span>' : '<span class="idledot"></span>'}<span>${p.t}${p.warm ? ` <span class="warm">· ${p.warm}</span>` : ""}</span></div>`).join("")}</div>
    <div class="pblock"><div class="lane-label">Assistants</div>${c.assistants.map((p) => `<div class="pline"><span class="dot"></span><span>${p.t}</span></div>`).join("")}</div>
    <div class="pblock"><div class="lane-label">Intake</div>
      <div class="pline"><span>${d.receipt.events} events → <b>${d.proposals.length} proposals</b> · ${d.fyi.length} FYI</span></div>
      <div class="pline"><span>${d.receipt.routed.length} routed · ${d.receipt.attached.length} attached · ${d.receipt.ignored} ignored</span></div>
      ${d.sources.filter((s) => s.warm).map((s) => `<div class="pline"><span class="pausemark">↻</span><span><b>${s.c}</b></span></div><div class="pline sub"><span class="warm">${s.warm}</span></div>`).join("")}
    </div>
    ${legendEl()}
  </aside></div>`;
}

/* ============ C · Ledger ============ */
function ledgerEntries(d) {
  const r = d.receipt;
  const e = [
    ...d.proposals.map((p) => ({ kind: "prop", at: p.at, p })),
    ...d.questions.map((q) => ({ kind: "q", at: q.at, q })),
    ...d.fyi.map((f) => ({ kind: "fyi", at: f.at, t: f.t, by: f.by })),
    ...r.routed.map((x) => ({ kind: "routed", at: x.at, t: x.t })),
    ...r.attached.map((x) => ({ kind: "attached", at: x.at, t: x.t })),
    ...r.ignoredGroups.map((x) => ({ kind: "ignored", at: x.at, span: x.span, t: x.t, n: x.n })),
  ];
  const key = (s) => { const m = s.at.match(/(\d\d):(\d\d)/g); const last = m[m.length - 1]; return +last.replace(":", ""); };
  return e.sort((a, b) => key(b) - key(a));
}
function lpropEl(p) {
  const open = openSet.has(p.id);
  return `<div class="lprop" data-pri="${p.pri}">
    <span class="when">${p.at}</span>
    <div class="body">
      <div class="tline">${pmarkEl}<span class="t">${crumb(p)}${p.t}</span>${priEl(p.pri)}<span class="vw">proposed by ${p.by}</span></div>
      <div class="why">${p.why}</div>
      ${p.link ? `<div class="link">${p.link}</div>` : ""}
      <div class="sigline" data-open="${p.id}"><span class="chev">${open ? "▾" : "▸"}</span><span>made from ${p.made}</span></div>
      <div class="sigs ${open ? "open" : ""}">${p.sigs.map((s) => `<div class="sig"><span class="kind">${s.k}</span><span>${s.t}</span><span class="src">${s.src}</span></div>`).join("")}</div>
      <div class="acts">${qbtns(p.actions)}</div>
    </div></div>`;
}
function renderLedger(d) {
  const rows = ledgerEntries(d).map((e) => {
    if (e.kind === "prop") return lpropEl(e.p);
    if (e.kind === "q") return `<div class="lrow"><span class="when">${e.at}</span><span class="glyph">${dmarkEl}</span>
      <span class="body"><b style="color:var(--ink);font-weight:var(--w-emph)">${e.q.q}</b> · ${e.q.why}</span><span class="acts" style="margin-left:0">${qbtns(e.q.actions)}</span></div>`;
    if (e.kind === "fyi") return `<div class="lrow"><span class="when">${e.at}</span><span class="glyph cang">i</span><span class="body">${e.t}</span><span class="vw">FYI · ${e.by}</span></div>`;
    if (e.kind === "routed") return `<div class="lrow quiet"><span class="when">${e.at}</span><span class="glyph cang">→</span><span class="body">${e.t}</span><span class="vw">routed</span></div>`;
    if (e.kind === "attached") return `<div class="lrow quiet"><span class="when">${e.at}</span><span class="glyph cang">+</span><span class="body">${e.t}</span><span class="vw">attached</span></div>`;
    return `<div class="lrow quiet"><span class="when">${e.at}</span><span class="glyph cang">·</span><span class="body">${e.span} · ${e.t}</span><span class="vw">ignored <b>${e.n}</b></span></div>`;
  }).join("");
  const r = d.receipt;
  return `<div class="layout"><div class="maincol">
    <div class="headline"><b>${r.events}</b> events today · <b>${d.proposals.length}</b> became proposals${d.questions.length ? ` · <span class="warm">${d.questions.length} need a call</span>` : ""} · ${d.fyi.length} FYI · ${r.routed.length + r.attached.length} handed on · ${r.ignored} ignored</div>
    <div class="lday"><div class="lane-label">Today <span class="n">newest first</span></div><div class="ledger">${rows}</div></div>
  </div><aside class="rail">${sourcesRail(d, { checkin: d.checkin })}</aside></div>`;
}

/* ============ page ============ */
const variants = [
  { key: "A", name: "Desk", render: renderDesk, own: true,
    note: "A · Intake is its own page. Proposals as dossier cards ranked by priority (lower tiers condense, click to open); check-in stays separate." },
  { key: "B", name: "Spine", render: renderSpine, own: false,
    note: "B · One page (\"Today\"): the check-in with a Proposed lane; urgent proposals break into Needs-you as ordinary decisions." },
  { key: "C", name: "Ledger", render: renderLedger, own: true,
    note: "C · Intake is its own page, time-first: what came in and what the agents made of it, raw signals folded under each proposal." },
];
let legendOn = false;
function params() { return new URLSearchParams(location.search); }
function get(k) { return params().get(k); }
function setParam(k, v) { const p = params(); p.set(k, v); try { history.replaceState(null, "", "?" + p.toString()); } catch (e) {} }
function current() { const k = (get("variant") || "A").toUpperCase(); const i = variants.findIndex((v) => v.key === k); return i === -1 ? 0 : i; }
function show(i) { focusIdx = 0; setParam("variant", variants[(i + variants.length) % variants.length].key); render(); }
function navEl(v, d) {
  const name = pageName();
  const items = v.own
    ? [[name, d.proposals.length + d.questions.length, true], ["Check-in", d.checkin.decisions.length, false]]
    : [["Today", d.checkin.decisions.length + d.proposals.filter((p) => p.pri === "urgent").length, true]];
  const rest = [["Tasks"], ["Sessions"], ["Runs"], ["Workflows"], null, ["Fleet"], ["Connections"], ["Notifications", 5], ["Settings"]];
  return [...items, ...rest].map((it) => it === null ? '<div class="sep"></div>'
    : `<a href="#" class="${it[2] ? "on" : ""}">${it[0]}${it[1] !== undefined ? ` <span class="count">${it[1]}</span>` : ""}</a>`).join("");
}
function render() {
  const v = variants[current()];
  const d = data();
  document.getElementById("nav").innerHTML = navEl(v, d);
  document.getElementById("h1").textContent = v.own ? pageName() : "Today";
  document.getElementById("stage").innerHTML = v.render(d);
  document.getElementById("swlabel").textContent = v.key + " · " + v.name;
  document.getElementById("vnote").textContent = v.note;
  document.getElementById("dsbtn").textContent = get("data") === "busy" ? "busy" : "calm";
}
document.getElementById("stage").addEventListener("click", (e) => {
  const fnav = e.target.closest("[data-fnav]");
  if (fnav && !fnav.disabled) { focusIdx += +fnav.dataset.fnav; render(); return; }
  if (e.target.closest(".qbtn")) return; /* fake actions do nothing */
  const dg = e.target.closest("[data-digest]");
  if (dg) { dg.nextElementSibling.classList.toggle("open"); return; }
  const o = e.target.closest("[data-open], [data-toggle]");
  if (o) { const id = o.dataset.open || o.dataset.toggle; openSet.has(id) ? openSet.delete(id) : openSet.add(id); render(); }
});
function toggleData() { setParam("data", get("data") === "busy" ? "calm" : "busy"); focusIdx = 0; openSet = new Set(); render(); }
function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  root.dataset.theme = dark ? "light" : "dark";
}
function cycleName() { setParam("name", ((+get("name") || 0) + 1) % NAMES.length); render(); }
document.getElementById("prev").addEventListener("click", () => show(current() - 1));
document.getElementById("next").addEventListener("click", () => show(current() + 1));
document.getElementById("dsbtn").addEventListener("click", toggleData);
document.getElementById("theme").addEventListener("click", toggleTheme);
document.getElementById("legendbtn").addEventListener("click", () => { legendOn = !legendOn; render(); });
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") show(current() - 1);
  if (e.key === "ArrowRight") show(current() + 1);
  if (e.key === "d") toggleData();
  if (e.key === "t") toggleTheme();
  if (e.key === "n") cycleName();
});
render();
</script>
