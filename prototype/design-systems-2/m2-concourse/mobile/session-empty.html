<!doctype html>
<html lang="en" data-theme="enamel">
  <head>
    <script src="../../shared/page.js"></script>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../system.css" />
    <link rel="stylesheet" href="../mobile.css" />
    <meta charset="utf-8" />
    <title>New thread · webshop · Hercule</title>
    <link rel="icon" href="../favicon.svg" />
    <script src="../metro.js" defer></script>
  </head>
  <body>
    <div class="phone">
      <div class="draft">
        <div class="draft-in">
          <h1 class="draft-h">What should the agent do in webshop?</h1>
          <p class="draft-sub prose">It gets its own worktree of webshop, on a new branch from main.</p>

          <!-- On a phone the picks that sit in the composer and under it on the desktop get a list
               of their own, because the composer row has room for only two. -->
          <section class="where card-flow" aria-label="Where the thread runs">
            <button class="where-row"><i data-i="folder"></i><b>Project</b><span class="v">webshop</span><i data-i="chev-r" class="chev"></i></button>
            <button class="where-row">
              <i data-i="machine"></i><b>Machine</b><span class="v">studio-mac · 5 of 6 busy</span><i data-i="chev-r" class="chev"></i>
            </button>
            <button class="where-row">
              <i data-brand="claude"></i><b>Model</b><span class="v">Claude Code · Opus 5.5</span><i data-i="chev-r" class="chev"></i>
            </button>
            <button class="where-row">
              <i data-i="branch"></i><b>Workspace</b><span class="v">New, from <code>main</code></span><i data-i="chev-r" class="chev"></i>
            </button>
          </section>

          <section class="starts" aria-label="Starting points from Intake">
            <div class="starts-head">From Intake<span>for webshop</span></div>
            <button class="start">
              <span class="start-src"><i data-brand="intercom" style="color: var(--ln-intercom)"></i></span>
              <span class="start-t"><b>Look into:</b> App is slow on Android</span>
              <span class="start-m">7 conversations</span>
              <i data-i="chev-r"></i>
            </button>
            <button class="start">
              <span class="start-src"><i data-brand="intercom" style="color: var(--ln-intercom)"></i></span>
              <span class="start-t"><b>Plan:</b> Add iDEAL as a payment method</span>
              <span class="start-m">5 requests</span>
              <i data-i="chev-r"></i>
            </button>
            <button class="start">
              <span class="start-src"><i data-brand="github" style="color: var(--ln-github)"></i></span>
              <span class="start-t"><b>Merge:</b> 4 dependency bumps</span>
              <span class="start-m">all green, patch versions</span>
              <i data-i="chev-r"></i>
            </button>
          </section>
        </div>
      </div>

      <div class="statusbar" data-statusbar></div>
      <header class="topbar">
        <a class="top-btn glass" href="intake.html" aria-label="Back"><i data-i="chev-l"></i></a>
        <span class="top-title top-title--center">New thread</span>
        <button class="top-btn glass" aria-label="More"><i data-i="more"></i></button>
      </header>

      <div class="composer-wrap">
        <div class="composer">
          <div class="reply">
            <div class="ta"><span class="ph">Say what you want done…</span></div>
            <div class="reply-row">
              <button class="icon-btn" aria-label="Attach"><i data-i="plus"></i></button>
              <button class="pick"><i data-i="shield"></i>Auto-accept edits<i data-i="chev" class="chev"></i></button>
              <button class="pick">High<i data-i="chev" class="chev"></i></button>
              <span class="grow"></span>
              <button class="icon-btn" aria-label="Dictate"><i data-i="mic"></i></button>
              <button class="send send--off" aria-label="Send"><i data-i="send"></i></button>
            </div>
          </div>
        </div>
      </div>
      <div class="home-ind"></div>
    </div>
  </body>
</html>
