<!doctype html>
<html lang="en" data-theme="enamel">
  <head>
    <script src="../../shared/page.js"></script>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../system.css" />
    <meta charset="utf-8" />
    <title>New thread · webshop · Hercule</title>
    <link rel="icon" href="../favicon.svg" />
    <script src="../metro.js" defer></script>
  </head>
  <body>
    <div class="phone">
      <div class="statusbar" data-statusbar="9:41"></div>

      <header class="m-nav m-nav--modal">
        <a class="txt" href="intake.html">Cancel</a>
        <div class="t">
          <b>New thread</b>
          <button class="m-proj">in webshop<i data-i="chev"></i></button>
        </div>
        <span></span>
      </header>

      <main class="m-body m-draft">
        <h1 class="m-draft-h">What should the agent do in webshop?</h1>
        <p class="m-draft-sub">It gets its own worktree of webshop, on a new branch from main.</p>

        <section class="m-starts" aria-label="Starting points from Intake">
          <div class="m-starts-head">From Intake<span>for webshop</span></div>
          <button class="m-start">
            <i data-strip="sentry gmail posthog github"></i>
            <span><b class="t"><em>Fix:</em> Checkout fails for EU cards</b><small><span class="prio" data-n="4"><i></i><i></i><i></i><i></i></span> urgent · 4 sources</small></span>
          </button>
          <button class="m-start">
            <i data-strip="intercom"></i>
            <span><b class="t"><em>Look into:</em> App is slow on Android</b><small>7 conversations</small></span>
          </button>
          <button class="m-start">
            <i data-strip="intercom"></i>
            <span><b class="t"><em>Plan:</em> Add iDEAL as a payment method</b><small>5 requests</small></span>
          </button>
          <button class="m-start">
            <i data-strip="github"></i>
            <span><b class="t"><em>Merge:</em> 4 dependency bumps</b><small>all green</small></span>
          </button>
        </section>

        <!-- Voice first: the mic is the largest control and sits under the thumb. -->
        <div class="m-draft-composer">
          <div class="card">
            <div class="ta"><span class="caret"></span><span class="ph">Say what you want done…</span></div>
            <div class="m-draft-row">
              <button class="icon-btn" aria-label="Attach"><i data-i="plus"></i></button>
              <button class="pick pick--model"><i data-brand="claude"></i>Opus 5.5<i data-i="chev" class="chev"></i></button>
              <button class="pick"><i data-i="shield"></i>Auto-accept edits<i data-i="chev" class="chev"></i></button>
              <span class="grow"></span>
              <button class="m-mic m-mic--l" aria-label="Hold to talk"><i data-i="mic"></i></button>
            </div>
          </div>
          <div class="lip">
            <span><i data-i="branch"></i>New worktree · from <code>main</code></span>
            <span class="right"><i data-i="machine"></i>studio-mac<i data-i="chev" class="chev"></i></span>
          </div>
        </div>
      </main>

      <div class="home-ind"></div>
    </div>
  </body>
</html>
