  ROUND 3. Slate won round 2 (hairline borders + crisp shallow shadows, quiet
  color at word/dot scale). Open axes are now live controls instead of samples:
    - typeface (8 justified candidates)
    - surface tint: hue + strength (strength 0 = Iris's pure neutral grays)
    - ground lightness per theme
    - emphasis weight (round-2 bolds caused squinting)
  Settings persist in the URL - copy it to report the winning combination.
  Rounds 1-2 live in git history on this branch (78ab468, b18c9bb).

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydra Design Language</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&family=Onest:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ================= tokens =================
     Surface family (bg/surface/raised/ink/muted/faint/line) is computed by JS
     from the controls and set inline on body. The static values below are the
     Slate defaults, doubling as the no-JS fallback. Semantic colors are static
     per theme. */

  body, body[data-t="light"] {
    --bg: #eef0f2; --surface: #f8f9fa; --raised: #ffffff;
    --ink: #1b1e24; --muted: #5f6672; --faint: #9aa1ad;
    --line: rgba(27,30,36,0.10); --line-soft: rgba(27,30,36,0.055);
    --attn: #8a6116; --fail: #a34e46; --ok: #48745a; --live: #48717f;
    --attn-soft: rgba(138,97,22,0.09);
    --proj-hydra: #7d7ab0; --proj-ops: #a67f92;
    --card-shadow: 0 1px 2px rgba(23,26,33,0.05);
    --lift-shadow: 0 1px 2px rgba(23,26,33,0.06), 0 4px 14px rgba(23,26,33,0.06);
  }
  body[data-t="dark"] {
    --bg: #14161b; --surface: #191c22; --raised: #20242c;
    --ink: #dfe2e8; --muted: #9aa1ad; --faint: #5f6672;
    --line: rgba(223,226,232,0.10); --line-soft: rgba(223,226,232,0.06);
    --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8;
    --attn-soft: rgba(208,161,71,0.12);
    --proj-hydra: #9490c9; --proj-ops: #bd93a8;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.35);
    --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
  }
  body {
    --sans: "Geist", -apple-system, system-ui, sans-serif;
    --w-emph: 600;      /* emphasis weight, control-adjustable */
    --w-urgent: 700;    /* w-emph + 100 */
  }

  /* ================= base ================= */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s, color 0.2s;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
  .app { display: flex; min-height: 100vh; }

  /* ---------- chrome ---------- */
  .side {
    width: 204px; flex: none;
    background: var(--surface);
    border-right: 1px solid var(--line-soft);
    display: flex; flex-direction: column;
    padding: 16px 10px;
    position: sticky; top: 0; height: 100vh;
  }
  .logo { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px 16px; }
  .logo b { font-size: 15px; letter-spacing: 0.01em; font-weight: var(--w-emph); }
  .logo span { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--faint); }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav a {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 10px; border-radius: 6px;
    color: var(--muted); text-decoration: none; font-size: 13px;
  }
  .nav a.on { background: var(--line-soft); color: var(--ink); font-weight: var(--w-emph); }
  .nav a:not(.on):hover { background: var(--line-soft); }
  .nav .count { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .nav .sep { height: 1px; background: var(--line-soft); margin: 8px 10px; }
  .proto-badge {
    margin-top: auto;
    border: 1px dashed var(--attn); color: var(--attn); background: var(--attn-soft);
    border-radius: 8px; padding: 8px 10px;
    font-family: "IBM Plex Mono", monospace; font-size: 10px; line-height: 1.5;
  }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: baseline; gap: 14px; padding: 24px 32px 0; }
  .topbar h1 { font-size: 18px; margin: 0; letter-spacing: -0.015em; font-weight: var(--w-emph); }
  .topbar .when { color: var(--muted); font-size: 13px; }
  .topbar .when b { color: var(--ink); font-weight: var(--w-emph); }
  #stage { padding: 22px 32px 130px; max-width: 1060px; }

  /* ================= structure ================= */
  .lane { margin-bottom: 34px; }
  .lane-label {
    text-transform: uppercase; letter-spacing: 0.1em;
    font-size: 10.5px; font-weight: var(--w-emph); color: var(--faint);
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .lane-label .n { font-family: "IBM Plex Mono", monospace; font-weight: 500; color: var(--faint); letter-spacing: 0; font-variant-numeric: tabular-nums; }

  /* ---- needs-you: the lit stage ---- */
  .needs-list { display: flex; flex-direction: column; gap: 10px; }
  .need {
    background: var(--raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 13px 18px;
    box-shadow: var(--lift-shadow);
    display: flex; flex-direction: column; gap: 3px;
  }
  .need .head { display: flex; align-items: baseline; gap: 10px; font-size: 12px; }
  .need .kind {
    font-weight: var(--w-emph); text-transform: uppercase; letter-spacing: 0.08em;
    font-size: 10.5px; color: var(--muted);
  }
  .need[data-tone="warn"] .kind { color: var(--attn); }
  .need[data-tone="fail"] .kind { color: var(--fail); }
  .need .title { font-weight: var(--w-emph); font-size: 14px; letter-spacing: -0.006em; }
  .need[data-pri="urgent"] .title { font-size: 15px; }
  .need[data-pri="medium"], .need[data-pri="low"] { opacity: 0.94; }
  .need .title code {
    font-family: "IBM Plex Mono", monospace; font-size: 12px;
    background: var(--line-soft); padding: 1px 5px; border-radius: 4px; font-weight: 400;
  }
  .need .ctx { color: var(--muted); font-size: 12.5px; }
  .need .acts { display: flex; gap: 4px; margin-top: 9px; margin-left: -9px; }

  /* quiet decision affordances - pinned principle from #20 */
  .qbtn {
    font-family: var(--sans); font-size: 12px; line-height: 1; font-weight: var(--w-emph);
    border: 0; background: none; color: var(--muted);
    padding: 6px 9px; border-radius: 6px; cursor: pointer;
  }
  .qbtn:hover { background: var(--line-soft); color: var(--ink); }
  .qbtn.first { color: var(--ink); }
  .qbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }

  /* ---- lineage ---- */
  .proj { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }

  /* ---- priority: shape, not color ---- */
  .pri { display: inline-flex; align-items: center; flex: none; }
  .pri .bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 9px; }
  .pri .bars i { width: 2.5px; border-radius: 1px; background: var(--line); }
  .pri .bars i:nth-child(1) { height: 3.5px; }
  .pri .bars i:nth-child(2) { height: 6px; }
  .pri .bars i:nth-child(3) { height: 9px; }
  .pri[data-pri="low"]    .bars i:nth-child(1) { background: var(--faint); }
  .pri[data-pri="medium"] .bars i:nth-child(-n+2) { background: var(--muted); }
  .pri[data-pri="high"]   .bars i { background: var(--muted); }
  .pri[data-pri="urgent"] .bars i { background: var(--ink); }

  /* ---- state: a small dot + a tinted word ---- */
  .state { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 12px; font-weight: 500; }
  .state .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--faint); }
  .state[data-tone="live"] .dot { background: var(--live); animation: pulse 2.4s ease-in-out infinite; }
  .state[data-tone="ok"]   .dot { display: none; }
  .state[data-tone="ok"]::before { content: "✓"; font-size: 11.5px; color: var(--ok); }
  .state[data-tone="warn"] .dot { background: var(--attn); }
  .state[data-tone="fail"] .dot { background: var(--fail); }
  .state[data-tone="live"] { color: var(--live); }
  .state[data-tone="ok"]   { color: var(--muted); }
  .state[data-tone="warn"] { color: var(--attn); }
  .state[data-tone="fail"] { color: var(--fail); }
  @keyframes pulse { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .state .dot { animation: none !important; } }

  /* ---- waiting-time: the age label darkens, then warms ---- */
  .age {
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; white-space: nowrap;
    color: var(--faint); flex: none; font-variant-numeric: tabular-nums;
  }
  .age[data-age="recent"] { color: var(--muted); }
  .age[data-age="stale"]  { color: var(--ink); }
  .age[data-age="old"]    { color: var(--attn); font-weight: 500; }

  /* ---- ledger ---- */
  .group {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; margin-bottom: 14px; box-shadow: var(--card-shadow);
  }
  .group > h2 {
    margin: 0; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); padding: 10px 18px 8px; border-bottom: 1px solid var(--line-soft);
    display: flex; gap: 9px; align-items: center; font-weight: var(--w-emph);
  }
  .group > h2 .n { font-family: "IBM Plex Mono", monospace; color: var(--faint); letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .group > h2 .pdot { width: 7px; height: 7px; border-radius: 2.5px; flex: none; }
  .group[data-proj="hydra"] > h2 .pdot { background: var(--proj-hydra); }
  .group[data-proj="ops"] > h2 .pdot { background: var(--proj-ops); }
  .rowwrap { overflow-x: auto; }
  .lrow {
    display: grid;
    grid-template-columns: minmax(220px, 1.1fr) 40px 132px minmax(230px, 1.4fr) 52px;
    gap: 14px; align-items: center;
    padding: 10px 18px; border-top: 1px solid var(--line-soft);
    min-width: 780px;
  }
  .lrow:first-child { border-top: 0; }
  .lrow .what .name { font-weight: var(--w-emph); font-size: 13.5px; letter-spacing: -0.004em; }
  .lrow[data-pri="urgent"] .what .name { font-weight: var(--w-urgent); }
  .lrow[data-pri="low"] .what .name { font-weight: 500; }
  .lrow[data-pri="low"], .lrow[data-done="1"] { opacity: 0.66; }
  .lrow .what .sub { color: var(--muted); font-size: 12px; }
  .lrow .now { color: var(--muted); font-size: 12.5px; }
  .lrow .now b { color: var(--ink); font-weight: var(--w-emph); }
  .lrow .age { text-align: right; }

  /* ---- digest: steps back ---- */
  .digest { display: flex; flex-direction: column; opacity: 0.82; }
  .ditem {
    display: flex; gap: 14px; align-items: baseline;
    padding: 7px 4px; border-bottom: 1px solid var(--line-soft);
  }
  .ditem:last-child { border-bottom: 0; }
  .ditem .when { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--faint); width: 88px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .ditem .glyph { flex: none; width: 14px; text-align: center; font-size: 11.5px; color: var(--faint); position: relative; top: 1px; }
  .ditem[data-tone="fail"] .glyph { color: var(--fail); }
  .ditem .txt { flex: 1; font-size: 12.5px; }
  .ditem .ref { color: var(--faint); font-size: 11.5px; margin-left: 6px; font-family: "IBM Plex Mono", monospace; }
  .divider {
    display: flex; align-items: center; gap: 12px;
    color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 10px 0;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }

  /* ================= controls / switcher (not part of the language) ================= */
  .panel {
    position: fixed; bottom: 64px; right: 16px; width: 264px;
    background: #17161a; color: #d8d6dc;
    border-radius: 12px; padding: 14px 16px 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    z-index: 45; font-family: "IBM Plex Mono", monospace; font-size: 11px;
  }
  .panel h3 {
    margin: 0 0 10px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
    color: #8d8a94; font-weight: 500;
  }
  .panel .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
  .panel label { color: #8d8a94; flex: none; }
  .panel .val { color: #fff; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  .panel select {
    width: 100%; background: #232128; color: #fff; border: 1px solid #35323c;
    border-radius: 6px; padding: 5px 7px; font: inherit; margin-bottom: 6px;
  }
  .panel input[type="range"] { flex: 1; accent-color: #9a94e8; min-width: 0; }
  .panel .why { color: #8d8a94; line-height: 1.5; margin: 0 0 12px; min-height: 3em; }
  .panel .why b { color: #c9c6d0; font-weight: 500; }
  .panel .wbtns { display: flex; gap: 4px; }
  .panel .wbtns button {
    flex: 1; background: #232128; color: #c9c6d0; border: 1px solid #35323c;
    border-radius: 6px; padding: 4px 0; font: inherit; cursor: pointer;
  }
  .panel .wbtns button.on { background: #9a94e8; color: #17161a; border-color: #9a94e8; }
  .panel .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .panel .foot button {
    background: none; border: 1px solid #35323c; color: #c9c6d0;
    border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer;
  }
  .panel .foot button:hover { border-color: #8d8a94; }
  .sw {
    position: fixed; bottom: 16px; right: 16px;
    background: #17161a; color: #fff;
    border-radius: 999px; padding: 6px 8px;
    display: flex; align-items: center; gap: 4px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    z-index: 50; font-family: "IBM Plex Mono", monospace;
  }
  .sw .label { font-size: 12px; font-weight: 600; padding: 0 8px; }
  .sw button {
    background: none; border: 0; color: #fff; cursor: pointer;
    font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px;
  }
  .sw button:hover { background: rgba(255,255,255,0.14); }
  .sw button:focus-visible { outline: 2px solid #9a94e8; outline-offset: 1px; }
</style>

      text: "Session &ldquo;Write promotion runbook&rdquo; ended &ndash; output committed to docs/", ref: "session 3182" },
    { when: "yest 22:15", tone: "fail", glyph: "✕",
      text: "&ldquo;Nightly digest&rdquo; failed &ndash; iteration-limit (waiting for you, above)", ref: "run 479" },
    { when: "yest 19:30", tone: "ok", glyph: "✓",
      text: "2 tasks created from Intake &ndash; &ldquo;Rotate tailnet certs&rdquo;, &ldquo;Reply to security advisory&rdquo;", ref: "" },
  ],
};

const priEl = (pri) => `
  <span class="pri" data-pri="${pri}" title="priority: ${pri}">
    <span class="bars"><i></i><i></i><i></i></span>
  </span>`;
const stateEl = (tone, label) => `
  <span class="state" data-tone="${tone}"><span class="dot"></span><span>${label}</span></span>`;
const qbtns = (arr) =>
  arr.map((a, i) => `<button class="qbtn ${i === 0 ? "first" : ""}">${a}</button>`).join("");

function render() {
  const needs = data.needsYou.map((n) => `
    <div class="need" data-tone="${n.tone}" data-pri="${n.pri}" data-age="${n.ageBucket}">
      <div class="head">
        <span class="kind">${n.kind}</span>
        <span class="proj">${n.lineage}</span>
        ${priEl(n.pri)}
        <span class="age" data-age="${n.ageBucket}" style="margin-left:auto">waiting ${n.age}</span>
      </div>
      <div class="title">${n.title}</div>
      <div class="ctx">${n.ctx}</div>
      <div class="acts">${qbtns(n.actions)}</div>
    </div>`).join("");
  const groups = data.groups.map((g) => `
    <div class="group" data-proj="${g.proj}">
      <h2><span class="pdot"></span>${g.name} <span class="n">${g.rows.length}</span></h2>
      <div class="rowwrap">
        ${g.rows.map((r) => `
        <div class="lrow" data-pri="${r.pri}" ${r.done ? 'data-done="1"' : ""}>
          <div class="what">
            <div class="name">${r.name}</div>
            <div class="sub">${r.sub}</div>
          </div>
          ${priEl(r.pri)}
          ${stateEl(r.tone, r.state)}
          <div class="now">${r.now}</div>
          <span class="age" data-age="${r.ageBucket}">${r.age}</span>
        </div>`).join("")}
      </div>
    </div>`).join("");
  const fresh = data.landed.filter((l) => !l.when.startsWith("yest"));
  const seen = data.landed.filter((l) => l.when.startsWith("yest"));
  const ditem = (l) => `
    <div class="ditem" data-tone="${l.tone}">
      <span class="when">${l.when}</span>
      <span class="glyph">${l.glyph}</span>
      <span class="txt">${l.text}<span class="ref">${l.ref}</span></span>
    </div>`;
  document.getElementById("stage").innerHTML = `
    <section class="lane">
      <div class="lane-label">Needs you <span class="n">${data.needsYou.length}</span></div>
      <div class="needs-list">${needs}</div>
    </section>
    <section class="lane">
      <div class="lane-label">Delegated <span class="n">10</span></div>
      ${groups}
    </section>
    <section class="lane">
      <div class="lane-label">Since you last checked <span class="n">${data.landed.length}</span></div>
      <div class="digest">
        ${fresh.map(ditem).join("")}
        <div class="divider">last check-in · yesterday 18:40</div>
        ${seen.map(ditem).join("")}
      </div>
    </section>`;
}

/* ---------- typeface candidates ---------- */
const faces = [
  { name: "Geist",
    why: "<b>Geist</b> - Vercel's dashboard face, engineered for dense dev-tool UI: crisp digits, tight rhythm at 12-14px. Slate's round-2 default." },
  { name: "Inter",
    why: "<b>Inter</b> - the industry baseline (Linear, GitHub run on it): tall x-height, maximum neutrality. Here as the control group." },
  { name: "Schibsted Grotesk",
    why: "<b>Schibsted Grotesk</b> - commissioned for a news group; grotesk bones with humanist warmth. The regular weight you liked in Umber." },
  { name: "Hanken Grotesk",
    why: "<b>Hanken Grotesk</b> - geometric-humanist hybrid with gentle, open bolds - the emphasis weight you found easiest in Iris." },
  { name: "Instrument Sans",
    why: "<b>Instrument Sans</b> - contemporary grotesk, slightly pragmatic and narrow; quiet personality without leaning corporate." },
  { name: "Onest",
    why: "<b>Onest</b> - drawn for long on-screen reading; calm rhythm, slightly narrow letterforms that ease dense monitoring rows." },
  { name: "Figtree",
    why: "<b>Figtree</b> - friendly geometric with airy counters; the softest candidate, testing how far warmth can go before authority is lost." },
  { name: "IBM Plex Sans",
    why: "<b>IBM Plex Sans</b> - engineered corporate workhorse, strong at data density, and kin to the IBM Plex Mono already used for ages and refs." },
];

/* ---------- controls ---------- */
const DEF = { face: "Geist", hue: 250, tint: 8, ll: 94.5, dl: 17, w: 600 };
function params() { return new URLSearchParams(location.search); }
function get(k) { const p = params(); return p.has(k) ? p.get(k) : String(DEF[k]); }
function setParams(obj) {
  const p = params();
  for (const [k, v] of Object.entries(obj)) p.set(k, String(v));
  try { history.replaceState(null, "", "?" + p.toString()); } catch (e) { /* file:// */ }
  apply();
}

const $ = (id) => document.getElementById(id);

function apply() {
  const dark = get("theme") === "dark";
  const hue = +get("hue"), c = +get("tint") / 1000;
  const ll = +get("ll"), dl = +get("dl"), w = +get("w");
  const face = get("face");
  const b = document.body.style;
  document.body.dataset.t = dark ? "dark" : "light";
  const bgL = dark ? dl : ll;
  const ok = (L, ch, alpha) => `oklch(${L}% ${ch.toFixed(4)} ${hue}${alpha ? " / " + alpha : ""})`;
  if (dark) {
    b.setProperty("--bg", ok(bgL, c));
    b.setProperty("--surface", ok(bgL + 2.2, c));
    b.setProperty("--raised", ok(bgL + 5.5, c * 0.9));
    b.setProperty("--ink", ok(90, Math.min(c * 0.7, 0.008)));
    b.setProperty("--muted", ok(68, c));
    b.setProperty("--faint", ok(50, c));
    b.setProperty("--line", ok(90, c, 0.10));
    b.setProperty("--line-soft", ok(90, c, 0.06));
  } else {
    b.setProperty("--bg", ok(bgL, c));
    b.setProperty("--surface", ok(Math.min(bgL + 2.2, 98.5), c * 0.8));
    b.setProperty("--raised", ok(Math.min(bgL + 5.5, 100), c * 0.5));
    b.setProperty("--ink", ok(23, Math.min(c, 0.01)));
    b.setProperty("--muted", ok(48, c));
    b.setProperty("--faint", ok(66, c));
    b.setProperty("--line", ok(23, Math.min(c, 0.01), 0.10));
    b.setProperty("--line-soft", ok(23, Math.min(c, 0.01), 0.055));
  }
  b.setProperty("--sans", `"${face}", -apple-system, system-ui, sans-serif`);
  b.setProperty("--w-emph", String(w));
  b.setProperty("--w-urgent", String(Math.min(w + 100, 800)));

  /* sync panel widgets */
  $("face").value = face;
  $("why").innerHTML = (faces.find((f) => f.name === face) || faces[0]).why;
  $("hue").value = hue; $("huev").textContent = hue + "°";
  $("tint").value = +get("tint"); $("tintv").textContent = get("tint");
  const g = $("ground");
  g.min = dark ? 10 : 88; g.max = dark ? 26 : 97;
  g.value = bgL; $("groundv").textContent = bgL + "%";
  $("groundlabel").textContent = "ground · " + (dark ? "dark" : "light");
  for (const btn of $("wbtns").children) btn.classList.toggle("on", +btn.dataset.w === w);
}

$("face").innerHTML = faces.map((f) => `<option>${f.name}</option>`).join("");
$("face").addEventListener("change", (e) => setParams({ face: e.target.value }));
$("hue").addEventListener("input", (e) => setParams({ hue: e.target.value }));
$("tint").addEventListener("input", (e) => setParams({ tint: e.target.value }));
$("ground").addEventListener("input", (e) =>
  setParams(document.body.dataset.t === "dark" ? { dl: e.target.value } : { ll: e.target.value }));
$("wbtns").addEventListener("click", (e) => {
  if (e.target.dataset.w) setParams({ w: e.target.dataset.w });
});
$("copy").addEventListener("click", () => {
  const s = ["face", "hue", "tint", "ll", "dl", "w"].map((k) => k + "=" + get(k)).join(" ");
  if (navigator.clipboard) navigator.clipboard.writeText(s);
  $("copy").textContent = s.length > 24 ? "copied ✓" : s;
  setTimeout(() => { $("copy").textContent = "copy settings"; }, 1600);
});
$("reset").addEventListener("click", () => setParams(DEF));
function toggleTheme() { setParams({ theme: document.body.dataset.t === "dark" ? "light" : "dark" }); }
$("theme").addEventListener("click", toggleTheme);
$("panelbtn").addEventListener("click", () => { $("panel").hidden = !$("panel").hidden; });
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if (e.key === "t") toggleTheme();
  if (e.key === "c") $("panel").hidden = !$("panel").hidden;
});

/* initial theme: URL param > host stamp > OS preference */
(function () {
  if (!params().get("theme")) {
    const host = document.documentElement.dataset.theme;
    const os = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    if (host === "dark" || (!host && os)) {
      try { const p = params(); p.set("theme", "dark"); history.replaceState(null, "", "?" + p.toString()); } catch (e) {}
    }
  }
  render();
  apply();
})();
</script>
