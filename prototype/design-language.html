<!--
  PROTOTYPE - throwaway. Ticket: https://github.com/rogierpennink/hydra/issues/1 -> #33
  ROUND 2. Round 1 (Graphite/Signal/Limelight) verdict: color in small precise
  doses - never a traffic light; keep Limelight's restraint + light-play but
  subtler, never yellowish; no colored accent bars; surfaces unsettled; more
  refinement. Round 1 lives in git history on this branch.

  Round 2 converges the language (quiet color at word/dot scale, priority via
  weight + gray bars, receding finished work, quiet buttons) and argues about
  SURFACES + DEPTH:
    1 Slate - cool neutrals, hairline borders + crisp shadows
    2 Umber - warm neutrals, borderless, shadow-only depth
    3 Iris  - pure neutrals + one muted identity accent, flat
  Switch samples with the floating bar / arrow keys / ?s=1|2|3.
  Toggle theme with the bar / "t" / ?theme=light|dark.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydra Design Language</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ================= tokens =================
     Six sets: 3 samples x 2 themes, stamped as body[data-s="1|2|3"][data-t="light|dark"].
     Components only read the vars. No-JS fallback: bare body = sample 1 light. */

  body, body[data-s="1"][data-t="light"] {
    --bg: #eef0f2; --surface: #f8f9fa; --raised: #ffffff;
    --ink: #1b1e24; --muted: #5f6672; --faint: #9aa1ad;
    --line: rgba(27,30,36,0.10); --line-soft: rgba(27,30,36,0.055);
    --attn: #8a6116; --fail: #a34e46; --ok: #48745a; --live: #48717f;
    --attn-soft: rgba(138,97,22,0.09);
    --proj-hydra: #7d7ab0; --proj-ops: #a67f92;
    --card-border: 1px solid var(--line);
    --card-shadow: 0 1px 2px rgba(23,26,33,0.05);
    --lift-shadow: 0 1px 2px rgba(23,26,33,0.06), 0 4px 14px rgba(23,26,33,0.06);
  }
  body[data-s="1"][data-t="dark"] {
    --bg: #14161b; --surface: #191c22; --raised: #20242c;
    --ink: #dfe2e8; --muted: #9aa1ad; --faint: #5f6672;
    --line: rgba(223,226,232,0.10); --line-soft: rgba(223,226,232,0.06);
    --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8;
    --attn-soft: rgba(208,161,71,0.12);
    --proj-hydra: #9490c9; --proj-ops: #bd93a8;
    --card-border: 1px solid var(--line);
    --card-shadow: 0 1px 2px rgba(0,0,0,0.35);
    --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
  }
  body[data-s="2"][data-t="light"] {
    --bg: #f1efeb; --surface: #f8f7f4; --raised: #fffefb;
    --ink: #211e1a; --muted: #6d6660; --faint: #a09890;
    --line: rgba(33,30,26,0.09); --line-soft: rgba(33,30,26,0.05);
    --attn: #8f6a1d; --fail: #a3564a; --ok: #5c7a5e; --live: #4e7a82;
    --attn-soft: rgba(143,106,29,0.09);
    --proj-hydra: #8a80a8; --proj-ops: #a8867e;
    --card-border: 1px solid transparent;
    --card-shadow: 0 1px 2px rgba(40,32,24,0.05), 0 5px 16px rgba(40,32,24,0.05);
    --lift-shadow: 0 1px 2px rgba(40,32,24,0.06), 0 8px 24px rgba(40,32,24,0.08);
  }
  body[data-s="2"][data-t="dark"] {
    --bg: #161411; --surface: #1b1916; --raised: #22201c;
    --ink: #e8e4de; --muted: #a09890; --faint: #6d6660;
    --line: rgba(232,228,222,0.09); --line-soft: rgba(232,228,222,0.055);
    --attn: #d3a556; --fail: #d08579; --ok: #93ac89; --live: #86a9ac;
    --attn-soft: rgba(211,165,86,0.11);
    --proj-hydra: #a49ac2; --proj-ops: #bf9c93;
    --card-border: 1px solid transparent;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 5px 16px rgba(0,0,0,0.25);
    --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.045), 0 2px 4px rgba(0,0,0,0.4), 0 10px 28px rgba(0,0,0,0.35);
  }
  body[data-s="3"][data-t="light"] {
    --bg: #f3f3f5; --surface: #f9f9fb; --raised: #ffffff;
    --ink: #1c1c21; --muted: #64646d; --faint: #9c9ca6;
    --line: rgba(28,28,33,0.11); --line-soft: rgba(28,28,33,0.06);
    --attn: #8a6116; --fail: #a34e46; --ok: #64646d; --live: #5b55c4;
    --attn-soft: rgba(138,97,22,0.09);
    --proj-hydra: #8e8e99; --proj-ops: #8e8e99;
    --card-border: 1px solid var(--line);
    --card-shadow: none;
    --lift-shadow: none;
  }
  body[data-s="3"][data-t="dark"] {
    --bg: #131316; --surface: #18181c; --raised: #1f1f25;
    --ink: #e4e4e9; --muted: #9c9ca6; --faint: #61616b;
    --line: rgba(228,228,233,0.11); --line-soft: rgba(228,228,233,0.06);
    --attn: #d0a147; --fail: #cf7b71; --ok: #9c9ca6; --live: #928cf2;
    --attn-soft: rgba(208,161,71,0.12);
    --proj-hydra: #77777f; --proj-ops: #77777f;
    --card-border: 1px solid var(--line);
    --card-shadow: none;
    --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }

  /* per-sample typeface, independent of theme */
  body[data-s="1"] { --sans: "Geist", -apple-system, system-ui, sans-serif; }
  body[data-s="2"] { --sans: "Schibsted Grotesk", -apple-system, system-ui, sans-serif; }
  body[data-s="3"] { --sans: "Hanken Grotesk", -apple-system, system-ui, sans-serif; }

  /* ================= base ================= */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s, color 0.2s;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
  .app { display: flex; min-height: 100vh; }

  /* ---------- chrome (styled by tokens, part of the language) ---------- */
  .side {
    width: 204px; flex: none;
    background: var(--surface);
    border-right: 1px solid var(--line-soft);
    display: flex; flex-direction: column;
    padding: 16px 10px;
    position: sticky; top: 0; height: 100vh;
  }
  .logo { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px 16px; }
  .logo b { font-size: 15px; letter-spacing: 0.01em; }
  .logo span { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--faint); }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav a {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 10px; border-radius: 6px;
    color: var(--muted); text-decoration: none; font-size: 13px;
  }
  .nav a.on { background: var(--line-soft); color: var(--ink); font-weight: 600; }
  .nav a:not(.on):hover { background: var(--line-soft); }
  .nav .count { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .nav .sep { height: 1px; background: var(--line-soft); margin: 8px 10px; }
  body[data-s="3"] .nav a.on { background: none; color: var(--live); }
  .proto-badge {
    margin-top: auto;
    border: 1px dashed var(--attn); color: var(--attn); background: var(--attn-soft);
    border-radius: 8px; padding: 8px 10px;
    font-family: "IBM Plex Mono", monospace; font-size: 10px; line-height: 1.5;
  }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: baseline; gap: 14px; padding: 24px 32px 0; }
  .topbar h1 { font-size: 18px; margin: 0; letter-spacing: -0.015em; font-weight: 650; }
  .topbar .when { color: var(--muted); font-size: 13px; }
  .topbar .when b { color: var(--ink); font-weight: 600; }
  #stage { padding: 22px 32px 130px; max-width: 1060px; }

  /* ================= shared structure ================= */
  .lane { margin-bottom: 34px; }
  .lane-label {
    text-transform: uppercase; letter-spacing: 0.1em;
    font-size: 10.5px; font-weight: 650; color: var(--faint);
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .lane-label .n { font-family: "IBM Plex Mono", monospace; font-weight: 500; color: var(--faint); letter-spacing: 0; font-variant-numeric: tabular-nums; }

  /* ---- needs-you: the lit stage ---- */
  .needs-list { display: flex; flex-direction: column; gap: 10px; }
  .need {
    background: var(--raised); border: var(--card-border); border-radius: 10px;
    padding: 13px 18px;
    box-shadow: var(--lift-shadow);
    display: flex; flex-direction: column; gap: 3px;
  }
  .need .head { display: flex; align-items: baseline; gap: 10px; font-size: 12px; }
  .need .kind {
    font-weight: 650; text-transform: uppercase; letter-spacing: 0.08em;
    font-size: 10.5px; color: var(--muted);
  }
  .need[data-tone="warn"] .kind { color: var(--attn); }
  .need[data-tone="fail"] .kind { color: var(--fail); }
  .need .title { font-weight: 600; font-size: 14px; letter-spacing: -0.006em; }
  .need[data-pri="urgent"] .title { font-size: 15px; }
  .need[data-pri="medium"], .need[data-pri="low"] { opacity: 0.94; }
  .need .title code {
    font-family: "IBM Plex Mono", monospace; font-size: 12px;
    background: var(--line-soft); padding: 1px 5px; border-radius: 4px;
  }
  .need .ctx { color: var(--muted); font-size: 12.5px; }
  .need .acts { display: flex; gap: 4px; margin-top: 9px; margin-left: -9px; }

  /* quiet decision affordances - pinned principle from #20 */
  .qbtn {
    font: 600 12px/1 var(--sans);
    border: 0; background: none; color: var(--muted);
    padding: 6px 9px; border-radius: 6px; cursor: pointer;
  }
  .qbtn:hover { background: var(--line-soft); color: var(--ink); }
  .qbtn.first { color: var(--ink); }
  .qbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }

  /* ---- lineage ---- */
  .proj { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }

  /* ---- priority: shape, not color ---- */
  .pri { display: inline-flex; align-items: center; flex: none; }
  .pri .bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 9px; }
  .pri .bars i { width: 2.5px; border-radius: 1px; background: var(--line); }
  .pri .bars i:nth-child(1) { height: 3.5px; }
  .pri .bars i:nth-child(2) { height: 6px; }
  .pri .bars i:nth-child(3) { height: 9px; }
  .pri[data-pri="low"]    .bars i:nth-child(1) { background: var(--faint); }
  .pri[data-pri="medium"] .bars i:nth-child(-n+2) { background: var(--muted); }
  .pri[data-pri="high"]   .bars i { background: var(--muted); }
  .pri[data-pri="urgent"] .bars i { background: var(--ink); }

  /* ---- state: a small dot + a tinted word ---- */
  .state { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 12px; font-weight: 550; }
  .state .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--faint); }
  .state[data-tone="live"] .dot { background: var(--live); animation: pulse 2.4s ease-in-out infinite; }
  .state[data-tone="ok"]   .dot { display: none; }
  .state[data-tone="ok"]::before { content: "✓"; font-size: 11.5px; color: var(--ok); }
  .state[data-tone="warn"] .dot { background: var(--attn); }
  .state[data-tone="fail"] .dot { background: var(--fail); }
  .state[data-tone="live"] { color: var(--live); }
  .state[data-tone="ok"]   { color: var(--muted); }
  .state[data-tone="warn"] { color: var(--attn); }
  .state[data-tone="fail"] { color: var(--fail); }
  @keyframes pulse { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .state .dot { animation: none !important; } }

  /* ---- waiting-time: the age label darkens, then warms ---- */
  .age {
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; white-space: nowrap;
    color: var(--faint); flex: none; font-variant-numeric: tabular-nums;
  }
  .age[data-age="recent"] { color: var(--muted); }
  .age[data-age="stale"]  { color: var(--ink); }
  .age[data-age="old"]    { color: var(--attn); font-weight: 500; }

  /* ---- ledger ---- */
  .group {
    background: var(--surface); border: var(--card-border); border-radius: 10px;
    overflow: hidden; margin-bottom: 14px; box-shadow: var(--card-shadow);
  }
  .group > h2 {
    margin: 0; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); padding: 10px 18px 8px; border-bottom: 1px solid var(--line-soft);
    display: flex; gap: 9px; align-items: center; font-weight: 650;
  }
  .group > h2 .n { font-family: "IBM Plex Mono", monospace; color: var(--faint); letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .group > h2 .pdot { width: 7px; height: 7px; border-radius: 2.5px; flex: none; }
  .group[data-proj="hydra"] > h2 .pdot { background: var(--proj-hydra); }
  .group[data-proj="ops"] > h2 .pdot { background: var(--proj-ops); }
  .rowwrap { overflow-x: auto; }
  .lrow {
    display: grid;
    grid-template-columns: minmax(220px, 1.1fr) 40px 132px minmax(230px, 1.4fr) 52px;
    gap: 14px; align-items: center;
    padding: 10px 18px; border-top: 1px solid var(--line-soft);
    min-width: 780px;
  }
  .lrow:first-child { border-top: 0; }
  .lrow .what .name { font-weight: 600; font-size: 13.5px; letter-spacing: -0.004em; }
  .lrow[data-pri="urgent"] .what .name { font-weight: 700; }
  .lrow[data-pri="low"] .what .name { font-weight: 500; }
  .lrow[data-pri="low"], .lrow[data-done="1"] { opacity: 0.66; }
  .lrow .what .sub { color: var(--muted); font-size: 12px; }
  .lrow .now { color: var(--muted); font-size: 12.5px; }
  .lrow .now b { color: var(--ink); font-weight: 600; }
  .lrow .age { text-align: right; }

  /* ---- digest: steps back ---- */
  .digest { display: flex; flex-direction: column; opacity: 0.82; }
  .ditem {
    display: flex; gap: 14px; align-items: baseline;
    padding: 7px 4px; border-bottom: 1px solid var(--line-soft);
  }
  .ditem:last-child { border-bottom: 0; }
  .ditem .when { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--faint); width: 88px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .ditem .glyph { flex: none; width: 14px; text-align: center; font-size: 11.5px; color: var(--faint); position: relative; top: 1px; }
  .ditem[data-tone="fail"] .glyph { color: var(--fail); }
  .ditem .txt { flex: 1; font-size: 12.5px; }
  .ditem .ref { color: var(--faint); font-size: 11.5px; margin-left: 6px; font-family: "IBM Plex Mono", monospace; }
  .divider {
    display: flex; align-items: center; gap: 12px;
    color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 10px 0;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }

  /* ================= legend + switcher (not part of the language) ================= */
  .legend {
    position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
    max-width: 860px; width: calc(100% - 48px);
    background: var(--raised); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    padding: 10px 16px; font-size: 12px; color: var(--muted); line-height: 1.55;
    z-index: 40;
  }
  .legend b { color: var(--ink); }
  .legend .close { float: right; cursor: pointer; border: 0; background: none; color: var(--faint); font-size: 14px; padding: 0 2px; }
  .sw {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #17161a; color: #fff;
    border-radius: 999px; padding: 6px 8px;
    display: flex; align-items: center; gap: 4px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    z-index: 50; font-family: "IBM Plex Mono", monospace;
  }
  .sw button {
    background: none; border: 0; color: #fff; cursor: pointer;
    font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px;
  }
  .sw button:hover { background: rgba(255,255,255,0.14); }
  .sw button:focus-visible { outline: 2px solid #7aa7b3; outline-offset: 1px; }
  .sw .label { font-size: 12px; font-weight: 600; padding: 0 4px; min-width: 148px; text-align: center; }
  .sw .div { width: 1px; height: 16px; background: rgba(255,255,255,0.22); margin: 0 2px; }
</style>

const priEl = (pri) => `
  <span class="pri" data-pri="${pri}" title="priority: ${pri}">
    <span class="bars"><i></i><i></i><i></i></span>
  </span>`;
const stateEl = (tone, label) => `
  <span class="state" data-tone="${tone}"><span class="dot"></span><span>${label}</span></span>`;
const qbtns = (arr) =>
  arr.map((a, i) => `<button class="qbtn ${i === 0 ? "first" : ""}">${a}</button>`).join("");

function render() {
  const needs = data.needsYou.map((n) => `
    <div class="need" data-tone="${n.tone}" data-pri="${n.pri}" data-age="${n.ageBucket}">
      <div class="head">
        <span class="kind">${n.kind}</span>
        <span class="proj">${n.lineage}</span>
        ${priEl(n.pri)}
        <span class="age" data-age="${n.ageBucket}" style="margin-left:auto">waiting ${n.age}</span>
      </div>
      <div class="title">${n.title}</div>
      <div class="ctx">${n.ctx}</div>
      <div class="acts">${qbtns(n.actions)}</div>
    </div>`).join("");
  const groups = data.groups.map((g) => `
    <div class="group" data-proj="${g.proj}">
      <h2><span class="pdot"></span>${g.name} <span class="n">${g.rows.length}</span></h2>
      <div class="rowwrap">
        ${g.rows.map((r) => `
        <div class="lrow" data-pri="${r.pri}" ${r.done ? 'data-done="1"' : ""}>
          <div class="what">
            <div class="name">${r.name}</div>
            <div class="sub">${r.sub}</div>
          </div>
          ${priEl(r.pri)}
          ${stateEl(r.tone, r.state)}
          <div class="now">${r.now}</div>
          <span class="age" data-age="${r.ageBucket}">${r.age}</span>
        </div>`).join("")}
      </div>
    </div>`).join("");
  const fresh = data.landed.filter((l) => !l.when.startsWith("yest"));
  const seen = data.landed.filter((l) => l.when.startsWith("yest"));
  const ditem = (l) => `
    <div class="ditem" data-tone="${l.tone}">
      <span class="when">${l.when}</span>
      <span class="glyph">${l.glyph}</span>
      <span class="txt">${l.text}<span class="ref">${l.ref}</span></span>
    </div>`;
  document.getElementById("stage").innerHTML = `
    <section class="lane">
      <div class="lane-label">Needs you <span class="n">${data.needsYou.length}</span></div>
      <div class="needs-list">${needs}</div>
    </section>
    <section class="lane">
      <div class="lane-label">Delegated <span class="n">10</span></div>
      ${groups}
    </section>
    <section class="lane">
      <div class="lane-label">Since you last checked <span class="n">${data.landed.length}</span></div>
      <div class="digest">
        ${fresh.map(ditem).join("")}
        <div class="divider">last check-in · yesterday 18:40</div>
        ${seen.map(ditem).join("")}
      </div>
    </section>`;
}

/* ---------- samples / themes ---------- */
const samples = [
  { key: "1", name: "Slate",
    legend: "<b>Slate — cool neutrals, drawn lines.</b> Blue-gray surfaces, hairline borders, crisp shallow shadows. Needs-you cards are the lit layer: a raised surface with a faint top highlight in dark, never a color wash. Color only at word scale: tinted state words, dots, and an age label that darkens, then warms when something has waited too long." },
  { key: "2", name: "Umber",
    legend: "<b>Umber — warm neutrals, soft depth.</b> No borders anywhere: surfaces separate by shadow alone, like paper layers. Warm charcoal in dark, warm porcelain in light. Same quiet color system — desaturated petrol for live, olive for done, ochre for waiting, clay for failed — all at word and dot scale." },
  { key: "3", name: "Iris",
    legend: "<b>Iris — pure neutrals, one identity accent, flat.</b> No shadows at all: hairlines and typography do the work. A single muted iris marks what is alive right now (live dots, running state, active nav) — everything else is grayscale, with amber and clay reserved for waiting-on-you and failed. Done is a neutral ✓." },
];
function params() { return new URLSearchParams(location.search); }
function curSample() {
  const i = samples.findIndex((s) => s.key === (params().get("s") || "1"));
  return i === -1 ? 0 : i;
}
function apply() {
  const p = params();
  const s = samples[curSample()];
  document.body.dataset.s = s.key;
  document.body.dataset.t = p.get("theme") === "dark" ? "dark" : "light";
  document.getElementById("swlabel").textContent = s.key + " · " + s.name;
  document.getElementById("legendtext").innerHTML = s.legend;
}
function setParam(k, v) {
  const p = params(); p.set(k, v);
  try { history.replaceState(null, "", "?" + p.toString()); } catch (e) { /* file:// */ }
  apply();
}
function shift(d) { setParam("s", samples[(curSample() + d + samples.length) % samples.length].key); }
function toggleTheme() { setParam("theme", document.body.dataset.t === "dark" ? "light" : "dark"); }
document.getElementById("prev").addEventListener("click", () => shift(-1));
document.getElementById("next").addEventListener("click", () => shift(1));
document.getElementById("theme").addEventListener("click", toggleTheme);
const legend = document.getElementById("legend");
document.getElementById("legendbtn").addEventListener("click", () => { legend.hidden = !legend.hidden; });
document.getElementById("legendclose").addEventListener("click", () => { legend.hidden = true; });
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") shift(-1);
  if (e.key === "ArrowRight") shift(1);
  if (e.key === "t") toggleTheme();
});

/* initial theme: URL param > host stamp > OS preference */
(function () {
  if (!params().get("theme")) {
    const host = document.documentElement.dataset.theme;
    const os = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    if (host === "dark" || (!host && os)) {
      try { const p = params(); p.set("theme", "dark"); history.replaceState(null, "", "?" + p.toString()); } catch (e) {}
    }
  }
  render();
  apply();
  legend.hidden = false;
})();
</script>
