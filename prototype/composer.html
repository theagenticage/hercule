<!--
  PROTOTYPE - throwaway. Ticket: https://github.com/rogierpennink/hydra/issues/160
  Question: what makes the codexlip composer (spec 14 §The composer; prototype/app-shell.html at 96b3c40)
  much friendlier for a human, on a draft thread and on an active one, inside docs/design-language.md?

  Round 1 (61d5a8d) put three shapes side by side and the lip won. Round 2 (5ee4b5a) made the model menu
  scale and the pill hold still. Both are in git history; this file is round 3 and keeps only what won.

  Round 3, from the reaction to round 2:
    - The lip only. The split pill only: the model (with its provider's logo) on the right, a fixed-width
      "model options" selector to its left, reasoning, thinking, context and fast mode inside it.
      Nothing under the lip: the keyboard hints and the "starts the thread on…" sentence are gone.
    - No profile. A thread is always unrestricted; assistant chats do not use this composer.
    - A thread is created inside the project you are in (the sidebar's), so the first selector is the
      repo, over that project's repos only; a project with one repo shows that one repo. "none" is the
      thread without a checkout.
    - Workspace and worktree are one thing here. "new" makes a fresh worktree of the repo on its own
      branch; the primary checkout is not on offer. The same selector lists the repo's existing
      workspaces, on whichever machine they are, and joining one fixes the branch and the machine because
      the workspace already has them (the branch selector disappears: the workspace is named after it).
    - "New thread in this workspace" is a button in the thread's top bar, not a + beside the tabs. The
      draft it opens has that workspace preselected and can still switch to "new".
    - The tab strip shows only when the workspace holds more than one thread (?peers=2, key b).
    - Access mode: four rows, no header.
    - The model menu: a logo on every row; no header line; the current account's section header is one
      small word so the model names carry the weight; Recent first, naming the account only when the
      provider has more than one, dimmed after start when the account differs; older models folded.
  States, via ?state= (key s cycles): draft · fresh (nothing logged in; Log in fills the draft) · sibling
  (a draft opened from inside hydra/run-3f1) · idle · busy · decision · exited.
  Keys: b threads in the workspace 1|2 · t theme. Send on a draft starts the thread here, in memory.
-->

  .pop .pi.grp .n { display: flex; gap: 6px; align-items: baseline; min-width: 0; } .pop .pi.grp .n b { flex: none; font-weight: 400; }

<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main>
    <div class="top" id="top"></div>
    <div class="thread" id="thread"></div>
  </main>
</div>
<div class="pop" id="pop"></div>
<div id="bar"></div>
<div id="note"></div>
<script>
/* ============ url state ============ */
const STATES = ["draft", "fresh", "sibling", "idle", "busy", "decision", "exited"];
const params = () => new URLSearchParams(location.search);
const stateKey = () => (STATES.includes(params().get("state")) ? params().get("state") : "draft");
const peers = () => (params().get("peers") === "1" ? 1 : 2);
function setParam(k, v) { const p = params(); p.set(k, v); history.replaceState(null, "", `?${p}`); boot(); }

/* ============ data: catalogs, the way client-core would hand them over ============ */

  const c = config(), s = active() ? thread.session : null; const busy = s && s.status === "busy"; const exited = s && s.status === "exited"; const b = blocker();
  const ol = optionsLabel(c);
  const options = ol ? `<button class="sel osel" data-pop="options" data-align="end" title="Model options"><span class="v">${ol}</span></button>` : "";
  const ws = c.workspace !== "new" ? wsOf(c.workspace) : null;
  const placeholder = exited ? "This thread has exited. Start a new one to continue." : busy ? "Queued until the turn finishes…" : active() ? "Reply…" : ws ? `Say what this thread should do in ${ws.id}…` : "Say what you want done…";
  const canSend = message.trim() && !b && !exited; const sendTip = active() ? "Send ⏎" : "Start thread ⏎";
  const sendc = `<button class="sendc" data-send="1" ${canSend ? "" : "disabled"} aria-label="${sendTip}" title="${sendTip}">↑</button>`;
  const stop = busy ? `<button class="stopb" data-stop="1" title="Stops the running turn; queued messages wait"><i></i>Stop</button>` : "";
  const pending = active() && Object.keys(picks).length ? `<span class="pend">model change applies on send</span>` : "";
  return `<div class="card"><textarea id="compose" rows="1" placeholder="${placeholder}" ${exited ? "disabled" : ""}>${esc(message)}</textarea>
    <div class="row3"><button class="plusb" aria-label="Attach" title="Attach (not built)">+</button>${sel("access", c.accessMode, "", "accessMode")}${pending}${options}${pillHtml(c)}<button class="micb" aria-label="Voice" title="Dictate (not built)">${MIC}</button>${stop}${sendc}</div></div>`;
}
/* the lip: repo · workspace · branch (only while the workspace is new: a joined one is named after its branch) · machine */
function lipHtml() {
  const c = config(), rp = repoOf(c), ws = c.workspace !== "new" ? wsOf(c.workspace) : null;
  const parts = [sel("repo", rp ? rp.id : "none", "repo", "repo")];
  if (rp) parts.push(sel("workspace", ws ? `<span class="mono">${ws.id}</span>` : "new", "workspace", "workspace"));
  if (rp && !ws) parts.push(sel("branch", `<span class="mono" style="font-size:11px">${BRANCH}${c.branch === "new" ? `${rp.id}/run-…` : c.branch}</span>`, "", "branch"));
  return `<div class="lip">${parts.join('<span class="sepv"></span>')}<span class="right">${sel("runner", runnerLabel(c), "machine", "runnerId", "end")}</span></div>`;
}
function queuedHtml() { const s = active() ? thread.session : null; return s && s.queued.length ? s.queued.map((q) => `<div class="queued"><span class="qmark">○</span><span class="qt">${esc(q)}</span><span class="qs">queued · runs next</span><button class="sel plain" style="padding:2px 6px">Steer</button><button class="sel plain" style="padding:2px 6px">Cancel</button></div>`).join("") : ""; }
function dockHtml() { const s = active() ? thread.session : null; return s && s.decision ? `<div class="dock"><div class="q"><span class="qm">?</span>Run <code class="mono">pnpm test --filter runner</code>?<span class="age">4m</span></div><div class="ledger"><button><b>Allow</b><small>runs the command once, in the workspace</small></button><button><b>Allow always</b><small>allows it for the rest of this thread</small></button><button><b>Deny</b><small>the agent hears no and continues</small></button></div></div>` : ""; }
function composerHtml() { return `<div class="compwrap ${dockHtml() ? "docked" : ""}">${queuedHtml()}${dockHtml()}${cardHtml()}${lipHtml()}</div>`; }
/* the tab strip: every thread in this workspace, once there is more than one; the draft being written counts */
function tabsHtml() {
  const s = active() ? thread.session : null; const ws = wsOf(s ? s.workspace : config().workspace); if (!ws) return "";
  const tabs = ws.threads.map((t) => ({ title: t, on: s && s.title === t, mk: s && s.title === t && s.status === "busy" ? "▮▮▮" : MARKS[t] === "q" ? "?" : "○", cls: s && s.title === t && s.status === "busy" ? "live" : MARKS[t] === "q" ? "q" : "" }));
  if (!s) tabs.push({ title: "New thread", on: true, mk: "·", cls: "" });
  if (tabs.length < 2) return "";
  return `<div class="tabs"><span class="ws">${ws.id}</span>${tabs.map((t) => `<button class="tab ${t.on ? "on" : ""}"><span class="mk ${t.cls}">${t.mk}</span><span>${t.title}</span></button>`).join("")}</div>`;
}

/* ============ page ============ */
function baseTranscript() { return [{ kind: "stamp", t: "Thu 11 Sep · 09:02" }, { kind: "user", t: "The webhook retry tests fail about one run in five. Find out why and fix it without loosening the assertions." }, { kind: "worked", t: "31s" }, { kind: "agent", t: "<p>Two of the three failures are the same race: the retry scheduler fires before the fake clock advances, so the first attempt lands a tick early and the assertion on attempt count sees two.</p><p>The third failure is unrelated: <code>test/webhooks/retry.test.ts</code> reuses a port across cases. Fixing the race first; the port reuse is a one-liner after.</p>" }, { kind: "user", t: "Go ahead, race first." }, { kind: "worked", live: true, t: "12s" }]; }
function transcriptHtml() {
  const s = thread.session; const rows = transcript.map((r, idx) => {
    if (r.kind === "stamp") return `<div class="stamp">${r.t}</div>`;
    if (r.kind === "user") return `<div class="umsg">${esc(r.t)}</div>`;
    if (r.kind === "agent") return `<div class="amsg">${r.t}</div>`;
    const live = r.live && s.status === "busy" && idx === transcript.length - 1; return `<div class="worked ${live ? "live" : ""}"><span class="wt">${live ? "Working for" : "Worked for"} ${r.t}</span><span>›</span></div>`;
  });
  if (s.status === "exited") rows.push(`<div class="stamp">exited · the harness process ended 2h ago · <a data-go="new">Start a new thread from it</a></div>`);
  return rows.join("");
}
function heroHtml() {
  const b = blocker(); if (b) return `<div class="hero"><h2>What should the agent do?</h2><p><span class="why">Can't start yet.</span> ${b.why} ${b.action ? `<button class="link" data-go="${b.action.go}">${b.action.label}</button>` : ""}</p></div>`;
  const c = config(), rp = repoOf(c), ws = c.workspace !== "new" ? wsOf(c.workspace) : null;
  if (ws) return `<div class="hero"><h2>What should the agent do in <u>${ws.id}</u>?</h2><p>It joins ${ws.threads.map((t) => `“${t}”`).join(" and ")} there: the agents see each other's edits, on one branch.</p></div>`;
  return `<div class="hero"><h2>What should the agent do${rp ? ` in <u>${rp.id}</u>` : ""}?</h2><p>The thread's setup rides under the input; it locks when you send the first message.</p></div>`;
}
function render() {
  const s = active() ? thread.session : null;
  const sideRow = (t, w) => { const on = s && s.title === t && s.workspace === w.id; const mk = on && s.status === "busy" ? "▮▮▮" : on && s.status === "exited" ? "–" : MARKS[t] === "q" ? "?" : "○"; return `<div class="row ${on ? "on" : ""}"><span class="mk ${on && s.status === "busy" ? "live" : MARKS[t] === "q" ? "q" : ""}">${mk}</span><span class="t">${esc(t)}</span><span class="age">${on ? s.startedAgo : AGES[t] || "now"}</span><span class="m">${w.id} · ${on && modelOf(s) ? modelOf(s).name : "Sonnet 5"}</span></div>`; };
  document.getElementById("side").innerHTML = `<div class="brand">Hydra <small>rogier</small></div><div class="seg"><span class="on">Threads</span><span>Hydra</span></div><button class="new" data-go="new">+ Create new thread</button>
    <div class="pj"><i></i>hydra</div>
    ${s ? "" : `<div class="row on"><span class="mk">·</span><span class="t" style="color:var(--muted)">New thread</span><span class="age">draft</span></div>`}
    ${WS.flatMap((w) => w.threads.map((t) => sideRow(t, w))).join("")}
    <div class="row"><span class="mk">○</span><span class="t">Tidy the promotion runbook</span><span class="age">2h</span><span class="m">no repo · Sonnet 5</span></div>
    <div class="pj ops"><i></i>ops</div>
    <div class="row"><span class="mk">✓</span><span class="t">Rotate the Hetzner backups key</span><span class="age">3d</span><span class="m">ops-infra/run-c17 · GPT-5.6</span></div>
    <div class="foot"><span>6 runners · 1 at cap</span><span>Marks <span class="mono" style="float:right;color:var(--faint)">?</span></span></div>`;
  document.getElementById("top").innerHTML = `<span class="crumb">hydra /</span> ${s ? esc(s.title) : "New thread"} ${s ? `<span class="id">thread · 9c2f41d0</span>${s.workspace ? `<button class="tbtn" data-go="sibling" title="A draft in ${s.workspace}, beside this thread">+ New thread in this workspace</button>` : ""}` : ""}`;
  document.getElementById("thread").innerHTML = `${tabsHtml()}<div class="tcol">${s ? transcriptHtml() : heroHtml()}</div>${composerHtml()}`;
  const ta = document.getElementById("compose"); if (ta) { grow(ta); if (!ta.disabled && document.activeElement !== ta && !open) ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  const tcol = document.querySelector(".tcol"); if (tcol && s) tcol.scrollTop = tcol.scrollHeight;
  placePop();
  document.getElementById("bar").innerHTML = `<button data-bar="state">state: ${stateKey()}</button><button data-bar="peers">threads in run-3f1: ${peers()}</button><button data-bar="theme" aria-label="Toggle theme">◐</button>`;
  document.getElementById("note").innerHTML = `<b>PROTOTYPE</b> · #160 · round 3 · s state · b threads · t theme`;
}
function grow(ta) { ta.style.height = "auto"; ta.style.height = `${Math.min(ta.scrollHeight, 8 * 21)}px`; }
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);

/* ============ events ============ */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-pop],[data-pick],[data-go],[data-send],[data-stop],[data-bar],[data-legacy]");
  if (!el) { if (!e.target.closest("#pop")) { if (open) { open = null; render(); } } return; }
  if (el.dataset.bar) {
    if (el.dataset.bar === "state") return setParam("state", STATES[(STATES.indexOf(stateKey()) + 1) % STATES.length]);
    if (el.dataset.bar === "peers") return setParam("peers", peers() === 2 ? "1" : "2");
    if (el.dataset.bar === "theme") { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; return; }
  }
  if (el.dataset.pop) { open = open === el.dataset.pop ? null : el.dataset.pop; FILTER = ""; return render(); }
  if (el.dataset.legacy) { SHOW_LEGACY[el.dataset.legacy] = true; return render(); }
  if (el.dataset.pick) { const pick = JSON.parse(el.dataset.pick); applyPick(pick); if (pick.field !== "option" && !(pick.field === "instance" && !pick.slug)) open = null; return render(); }
  if (el.dataset.go === "login") { FRESH_LOGIN = true; catalogs().instances[0].on = ["laptop"]; open = null; return render(); }
  if (el.dataset.go === "runner") { open = "runner"; return render(); }
  if (el.dataset.go === "new") return setParam("state", "draft");
  if (el.dataset.go === "sibling") return openSibling();
  if (el.dataset.send) return submit();
  if (el.dataset.stop) { const s = thread.session; s.status = "idle"; transcript[transcript.length - 1] = { kind: "worked", t: "14s · stopped" }; return render(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "compose") { message = e.target.value; grow(e.target); const b = document.querySelector(".sendc"); if (b) b.disabled = !(message.trim() && !blocker()); }
  if (e.target.id === "mfilter") { FILTER = e.target.value; placePop(); }
});
document.addEventListener("keydown", (e) => {
  const typing = e.target.matches("input,textarea,[contenteditable]");
  if (e.key === "Escape") { if (open) { open = null; render(); } return; }
  if (typing) { if (e.target.id === "compose" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); } return; }
  if (e.key === "s") setParam("state", STATES[(STATES.indexOf(stateKey()) + 1) % STATES.length]);
  if (e.key === "b") setParam("peers", peers() === 2 ? "1" : "2");
  if (e.key === "t") { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; }
});
window.addEventListener("resize", placePop);
function boot() { reset(); render(); }
if (params().get("theme") === "dark" || (!params().get("theme") && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.dataset.theme = "dark";
boot();
</script>
