<!--
  PROTOTYPE - throwaway. Ticket: https://github.com/rogierpennink/hydra/issues/160
  Question: what makes the codexlip composer (spec 14 §The composer; prototype/app-shell.html at 96b3c40)
  much friendlier for a human, on a draft thread and on an active one, inside docs/design-language.md?

  Round 1 (commit 61d5a8d) put three structural answers side by side, ?variant=A|B|C (keys ← →):
    A Lip       - the setup bar under the card as pinned, refined. CHOSEN 2026-09-11: users know the
                  shape from other tools.
    B Sentence  - the setup as a sentence whose bold words are the selectors. Rejected: kept as the record.
    C Header    - the setup as the thread's identity row at the top. Rejected as a composer shape; it
                  raised the "more threads in this workspace" question that ?state=sibling and ?tabs=on
                  below make concrete.

  Round 2 works on A. Reaction to round 1: the model menu does not scale (10+ models, several accounts,
  no way to search); the model pill jumps when the reasoning changes, because three variable-width parts
  share one pill and the menu is anchored to its moving left edge; the harness name is not worth the
  space, the account name is, but only when there is more than one account.
    ?pill=split (default) - the pill is the model alone, the account before it only when the provider has
                  more than one; reasoning is its own fixed-width selector to the pill's left, with the
                  options block as its menu.
    ?pill=one   - one pill as pinned, but the reasoning sits in a fixed-width slot and the menu is
                  anchored to the pill's right edge, so nothing moves.
    The model menu: a filter field appears past 8 models in total and filters across accounts; a Recent
    group first; the current account's models with the default marked and older models folded behind
    "older models (n) ›"; every other account one row, dimmed after start. Right-hand menus are anchored
    to the right edge of what opened them.
    ?state=sibling - a draft opened from inside an active thread's workspace: workspace, checkout, branch
                  and machine are already fixed by the workspace being joined, everything else is free.
                  The per-field lock reason is what carries this; it is not a third mode.
    ?tabs=on    - a tab strip above the column: the threads open in this workspace, and + for a sibling.
                  A sketch for the discussion, not a proposal for the thread surface yet.

  Cross-cutting, in every variant: display names instead of slugs; "Start thread ⏎" then "Send ⏎"; the
  busy placeholder says the message will queue; the textarea grows with its text (1-8 lines); ⇧⏎ is a
  newline; Esc closes a menu and the text survives; a mic glyph for voice; both themes.

  States, via ?state= (key s cycles): draft · fresh (nothing logged in: blocked, Log in fills the draft)
  · sibling · idle · busy (Stop, a queued row) · decision (a permission request docked) · exited.
  Keys: p pill mode · b tabs · t theme. Send on a draft starts the thread here, in memory.
-->

<style>

    --ink: oklch(90% 0.0080 265); --muted: oklch(68% 0.0288 265); --faint: oklch(50% 0.0288 265);

    --p-hydra: #9490c9; --p-ops: #bd93a8;
  }
  * { box-sizing: border-box; } html, body { margin: 0; padding: 0; }

  .lane-label { text-transform: uppercase; letter-spacing: 0.1em; font-size: 10.5px; color: var(--faint); font-weight: var(--w-emph); }

  /* ---- shell: a static sidebar and top bar, so the composer is judged beside the app ---- */
  .app { display: grid; grid-template-columns: var(--side-w) 1fr; height: 100vh; }
  .side { background: var(--surface); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }

  .side .brand small { font: 11px var(--mono); color: var(--faint); }

  .side .pj { display: flex; align-items: center; gap: 7px; padding: 8px 8px 2px; font-size: 12.5px; color: var(--ink); font-weight: var(--w-emph); }

  .side .row { display: grid; grid-template-columns: 14px 1fr auto; gap: 0 6px; padding: 5px 8px; border-radius: 6px; color: var(--ink); }

  .side .mk { font-size: 10px; color: var(--faint); text-align: center; } .side .mk.live { color: var(--live); } .side .mk.q { color: var(--attn); }

  main { display: flex; flex-direction: column; min-height: 0; }

  .hero { margin: auto 0; text-align: center; padding: 0 0 24px; }

  .amsg p { margin: 0 0 8px; } .amsg code { font: 12.5px var(--mono); }
  .worked { display: flex; gap: 6px; align-items: center; font: 12px var(--mono); color: var(--faint); cursor: pointer; }
  .worked.live .wt { background: linear-gradient(90deg, var(--faint) 0%, var(--ink) 45%, var(--faint) 90%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.4s linear infinite; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -20% 0; } }
  @media (prefers-reduced-motion: reduce) { .worked.live .wt { animation: none; background: none; color: var(--live); } }
  /* the tab strip sketch: threads open in one workspace */
  .tabs { width: 100%; max-width: 800px; margin: 0 auto 4px; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; }
  .tabs .ws { font: 11px var(--mono); color: var(--faint); padding: 0 10px 8px 0; align-self: center; }

  /* ---- the composer ---- */

  .dock .q { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: var(--w-emph); }
  .dock .q .qm { color: var(--attn); font-weight: var(--w-urgent); } .dock .q .age { margin-left: auto; font: 11px var(--mono); color: var(--faint); }

  .plusb { font-size: 17px; } .micb { border-radius: 50%; width: 28px; height: 28px; } .micb svg { width: 16px; height: 16px; }

  .sel.rsel { min-width: 78px; justify-content: space-between; margin-left: auto; color: var(--ink); }   /* fixed width: low, medium, high, xhigh, max, thinking on/off all fit */
  .sepv { width: 1px; height: 12px; background: var(--line); margin: 0 3px; flex: none; }

  .mpill.alone { margin-left: auto; }
  .mpill .k { color: var(--faint); } .mpill::after { content: "▾"; color: var(--faint); font-size: 10px; }
  .mpill .rz { display: inline-block; min-width: 62px; color: var(--muted); }   /* ?pill=one: the reasoning slot never changes width */

  .sendc { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; flex: none; }
  .sendc:disabled { background: var(--line); color: var(--faint); cursor: not-allowed; }
  .sendc:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .stopb { border: 1px solid var(--line); background: none; color: var(--ink); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: var(--w-emph); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .stopb:hover { background: var(--line-soft); } .stopb i { width: 8px; height: 8px; background: currentColor; border-radius: 1.5px; display: inline-block; }
  .hint { font: 11px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .hint b { color: var(--muted); font-weight: 400; }
  .blk { font-size: 12.5px; color: var(--muted); } .blk .why { color: var(--attn); font-weight: var(--w-emph); }
  .blk button.link { color: var(--ink); font-weight: var(--w-emph); cursor: pointer; border: 0; background: none; padding: 0; font: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .lip { margin: -8px 14px 0; padding: 13px 12px 5px; border: 1px solid var(--line-soft); border-top: 0; border-radius: 0 0 10px 10px; background: var(--surface); display: flex; gap: 2px; font-size: 12px; color: var(--muted); align-items: center; }
  .lip .right { margin-left: auto; display: inline-flex; gap: 2px; align-items: center; }
  .foot { display: flex; align-items: center; gap: 10px; padding: 7px 16px 0; min-height: 28px; } .foot .right { margin-left: auto; }
  /* B: the sentence (rejected, kept as the record) */
  .sent { padding: 9px 16px 0; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .sent .w { border: 0; background: none; padding: 1px 3px; margin: 0 -3px; border-radius: 4px; color: var(--ink); font-weight: var(--w-emph); cursor: pointer; font: inherit; text-decoration: underline dotted var(--faint); text-underline-offset: 3px; }
  .sent .w:hover, .sent .w[aria-expanded="true"] { background: var(--line-soft); }

  /* C: the identity row (rejected, kept as the record) */
  .idrow { width: 100%; max-width: 800px; margin: 0 auto 6px; display: flex; gap: 22px; padding: 6px 0 12px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
  .idrow .f { display: flex; flex-direction: column; gap: 2px; } .idrow .sel { padding: 1px 6px 1px 0; font-size: 13px; color: var(--ink); } .idrow .sel.ro { color: var(--ink); }

  .pop .pi.dim { opacity: 0.55; cursor: default; } .pop .pi.dim:hover { background: none; color: var(--muted); }
  .pop .pi.soft { opacity: 1; } .pop .pi.soft .s { color: var(--attn); }
  .pop .pi.more .n { color: var(--faint); }
  .pop .pg { margin-top: 6px; padding: 7px 8px 3px; display: flex; align-items: baseline; gap: 8px; border-top: 1px solid var(--line-soft); }
  .pop .ph + .pg, .pop .cin + .pg { border-top: 0; margin-top: 0; padding-top: 2px; }
  .pop .pg b { font-size: 12px; color: var(--ink); white-space: nowrap; } .pop .pg small { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pop .pg .st { margin-left: auto; font-size: 11px; color: var(--faint); white-space: nowrap; } .pop .pg .st a { color: var(--muted); cursor: pointer; }
  .pop .pg .pdot { width: 6px; height: 6px; border-radius: 1.5px; background: var(--p-hydra); align-self: center; } .pop .pg .pdot.ops { background: var(--p-ops); }
  .pop .pi.grp { margin-top: 4px; border-top: 1px solid var(--line-soft); border-radius: 0 0 6px 6px; padding-top: 8px; }
  .pop .pi.grp .n { display: flex; gap: 6px; align-items: baseline; min-width: 0; } .pop .pi.grp .n b { color: var(--muted); flex: none; } .pop .pi.grp:hover .n b { color: var(--ink); }
  .pop .pi.grp .n small { font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0; }

  .pop .opts { margin-top: 2px; padding: 6px 8px 4px; display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 5px 10px; align-items: center; }

  .pop .foot { border-top: 1px solid var(--line-soft); margin-top: 6px; padding: 7px 8px 3px; font-size: 11.5px; color: var(--faint); line-height: 1.45; min-height: 0; }
  .pop .foot a { color: var(--muted); cursor: pointer; }

<script>
/* ============ url state ============ */
const VARIANTS = { A: "Lip", B: "Sentence", C: "Header" };
const STATES = ["draft", "fresh", "sibling", "idle", "busy", "decision", "exited"];
const params = () => new URLSearchParams(location.search);
const variant = () => (VARIANTS[params().get("variant")] ? params().get("variant") : "A");

/* ============ data: catalogs, the way client-core would hand them over ============ */

  { slug: "claude-opus-4-8", name: "Opus 4.8", effort: E4, isLegacy: true },

  { id: "cc-personal", provider: "Claude Code", name: "personal", who: "rogier@… · Max plan", on: ["laptop", "macstudio-01", "hetzner-01"], models: CLAUDE },
  { id: "cc-work", provider: "Claude Code", name: "work", who: "rogier@acme… · Team", on: ["laptop"], models: CLAUDE },

let FRESH_LOGIN = false;

  ? { instances: [{ id: "cc-personal", provider: "Claude Code", name: "", who: "found on this machine", on: FRESH_LOGIN ? ["laptop"] : [], models: CLAUDE }],

/* what the user picked most recently, across accounts; the menu shows these first */

/* ============ the thread: draft or active ============ */

/* the pill: the model, the account before it only when the provider has more than one; never the harness */
function pillParts(c = config()) { const i = inst(c), m = modelOf(c); if (!i) return { k: "", v: "No provider" }; return { k: multiAccount(i) ? i.name : "", v: m ? m.name : c.model }; }

/* ============ picks ============ */

/* ============ menus ============ */
const row = (on, dim, data, name, st = "", sub = "", cls = "") => `<button class="pi ${on ? "on" : ""} ${dim ? "dim" : ""} ${cls}" ${dim ? "" : `data-pick='${JSON.stringify(data)}'`}><span class="dot"></span><span class="n">${name}</span><span class="st">${st}</span>${sub ? `<span class="s">${sub}</span>` : ""}</button>`;

function menuHtml(kind) {

}

/* ============ the composer ============ */
const MIC = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6"/></svg>';
const BRANCH = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="width:11px;height:11px;vertical-align:-1px;margin-right:4px"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M6 7.2v9.6M18 10.2c0 4-12 2.6-12 6.6"/></svg>';
function sel(kind, value, key = "", field = kind, align = "") {
  const why = lockReason(field);
  return `<button class="sel ${why ? "ro" : ""}" ${why ? `title="${why}"` : `data-pop="${kind}"${align ? ` data-align="${align}"` : ""}`}>${key ? `<span class="k">${key}</span>` : ""}<span class="v">${value}</span></button>`;
}
function setupValues() {
  const c = config(), rp = repoOf(c);
  return { ws: rp ? rp.id : "No workspace", co: rp ? (c.checkout === "primary" ? "primary checkout" : thread.sibling ? "shared worktree" : "new worktree") : null, br: rp ? `<span class="mono" style="font-size:11px">${BRANCH}${c.branch === "new" ? `${rp.id}/run-…` : c.branch}</span>` : null, brPlain: rp ? (c.branch === "new" ? `${rp.id}/run-…` : c.branch) : null, runner: runnerLabel(c), profile: c.profileId, rp };
}
function cardHtml() {
  const c = config(), s = active() ? thread.session : null; const busy = s && s.status === "busy"; const exited = s && s.status === "exited"; const b = blocker();
  const p = pillParts(c); const rz = reasoning(c);
  const pill = pillMode() === "one"
    ? `<button class="mpill alone" data-pop="model" data-align="end" title="${active() ? "Model and its options stay live; the account is fixed" : "Model, options and account"}">${p.k ? `<span class="k">${p.k}</span>` : ""}${p.v}${rz ? ` <span class="rz">· ${rz}</span>` : ""}</button>`
    : `${rz ? `<button class="sel rsel" data-pop="reasoning" data-align="end" title="Reasoning: live on every turn"><span class="v">${rz}</span></button>` : ""}<button class="mpill ${rz ? "" : "alone"}" data-pop="model" data-align="end" title="${active() ? "The model stays live; the account is fixed" : "Model and account"}">${p.k ? `<span class="k">${p.k}</span>` : ""}${p.v}</button>`;
  const placeholder = exited ? "This thread has exited. Start a new one to continue." : busy ? "Queued until the turn finishes…" : active() ? "Reply…" : thread.sibling ? `Say what this thread should do beside “${thread.sibling.title}”…` : "Say what you want done…";
  const canSend = message.trim() && !b && !exited; const sendTip = active() ? "Send ⏎" : "Start thread ⏎";
  const sendc = `<button class="sendc" data-send="1" ${canSend ? "" : "disabled"} aria-label="${sendTip}" title="${sendTip}">↑</button>`;
  const stop = busy ? `<button class="stopb" data-stop="1" title="Stops the running turn; queued messages wait"><i></i>Stop</button>` : "";
  return `<div class="card"><textarea id="compose" rows="1" placeholder="${placeholder}" ${exited ? "disabled" : ""}>${esc(message)}</textarea>
    <div class="row3"><button class="plusb" aria-label="Attach" title="Attach (not built)">+</button>${sel("access", c.accessMode, "", "accessMode")}${pill}<button class="micb" aria-label="Voice" title="Dictate (not built)">${MIC}</button>${stop}${sendc}</div></div>`;
}
function queuedHtml() { const s = active() ? thread.session : null; return s && s.queued.length ? s.queued.map((q) => `<div class="queued"><span class="qmark">○</span><span class="qt">${esc(q)}</span><span class="qs">queued · runs next</span><button class="sel" style="padding:2px 6px">Steer</button><button class="sel" style="padding:2px 6px">Cancel</button></div>`).join("") : ""; }
function dockHtml() { const s = active() ? thread.session : null; return s && s.decision ? `<div class="dock"><div class="q"><span class="qm">?</span>Run <code class="mono">pnpm test --filter runner</code>?<span class="age">4m</span></div><div class="ledger"><button><b>Allow</b><small>runs the command once, in the worktree</small></button><button><b>Allow always</b><small>adds it to the unrestricted profile for this thread</small></button><button><b>Deny</b><small>the agent hears no and continues</small></button></div></div>` : ""; }
function guidanceHtml(cls = "hint") {
  const b = blocker(); const s = active() ? thread.session : null;
  if (b) return `<span class="blk"><span class="why">Can't start yet.</span> ${b.why} ${b.action ? `<button class="link" data-go="${b.action.go}">${b.action.label}</button>` : ""}</span>`;
  if (s && s.status === "exited") return `<span class="blk">This thread has exited. <button class="link" data-go="new">Start a new thread from it</button></span>`;
  if (s && s.status === "busy") return `<span class="${cls}"><b>⏎</b> queues for the next turn · <b>⇧⏎</b> newline</span>`;
  if (s) return `<span class="${cls}"><b>⏎</b> sends · <b>⇧⏎</b> newline</span>`;
  const c = config(), rp = repoOf(c);
  if (thread.sibling) return `<span class="${cls}"><b>⏎</b> starts a thread in the same worktree, beside “${thread.sibling.title}” · <b>⇧⏎</b> newline</span>`;
  return `<span class="${cls}"><b>⏎</b> starts the thread on ${runnerLabel(c)}${rp ? ` in ${c.checkout === "primary" ? "the primary checkout" : "a new worktree"} of ${rp.id}` : " without a workspace"} · <b>⇧⏎</b> newline</span>`;
}
const pendingNote = () => Object.keys(picks).length && active() ? `<span class="hint" style="color:var(--attn)">changed · applies on send</span>` : "";

function variantA() {
  const v = setupValues();
  const lip = `<div class="lip">${[sel("workspace", v.ws, "workspace", "repo"), v.co ? sel("checkout", v.co, "", "checkout") : "", v.br ? sel("branch", v.br, "", "branch") : ""].filter(Boolean).join('<span class="sepv"></span>')}<span class="right">${sel("runner", v.runner, "machine", "runnerId", "end")}<span class="sepv"></span>${sel("profile", v.profile, "profile", "profileId", "end")}</span></div>`;
  return `<div class="compwrap ${dockHtml() ? "docked" : ""}">${queuedHtml()}${dockHtml()}${cardHtml()}${lip}<div class="foot">${guidanceHtml()}<span class="right">${pendingNote()}</span></div></div>`;
}
const bMachine = (c) => { const r = runnerOf(c); return r ? (r.local ? "this machine" : r.id) : "no machine"; };
function variantB() {
  const c = config(), v = setupValues(), s = active() ? thread.session : null;
  const w = (kind, text, field) => locked(field) ? `<b title="${lockReason(field)}">${text}</b>` : `<button class="w" data-pop="${kind}">${text}</button>`;
  let sentence;
  if (blocker()) sentence = guidanceHtml("tail");
  else if (s) sentence = `Started ${s.startedAgo === "now" ? "just now" : s.startedAgo + " ago"} ${v.rp ? `in ${c.checkout === "primary" ? "the primary checkout" : "a new worktree"} of <b>${v.rp.id}</b> on <b class="mono" style="font-size:11.5px">${v.brPlain}</b>` : "with <b>no workspace</b>"}, on <b>${bMachine(c)}</b>, as <b>${v.profile}</b>. &nbsp;<span class="tail">${s.status === "busy" ? "⏎ queues for the next turn" : s.status === "exited" ? "" : "⏎ sends · ⇧⏎ newline"}</span> ${pendingNote()}`;
  else sentence = `Runs ${v.rp ? `in ${w("checkout", c.checkout === "primary" ? "the primary checkout" : thread.sibling ? "the shared worktree" : "a new worktree", "checkout")} of ${w("workspace", v.rp.id, "repo")} ${c.branch === "new" ? `on ${w("branch", `a new branch from ${v.rp.primary}`, "branch")}` : `on ${w("branch", v.brPlain, "branch")}`}` : `with ${w("workspace", "no workspace", "repo")}`}, on ${w("runner", bMachine(c), "runnerId")}, as ${w("profile", v.profile, "profileId")}. &nbsp;<span class="tail">⏎ starts it · ⇧⏎ newline</span>`;
  return `<div class="compwrap ${dockHtml() ? "docked" : ""}">${queuedHtml()}${dockHtml()}${cardHtml()}<div class="sent ${s ? "ro" : ""}">${sentence}</div></div>`;
}
function variantC() { return `<div class="compwrap ${dockHtml() ? "docked" : ""}">${queuedHtml()}${dockHtml()}${cardHtml()}<div class="foot">${guidanceHtml()}<span class="right">${pendingNote()}</span></div></div>`; }
function idRowHtml() {
  const v = setupValues(), s = active() ? thread.session : null;
  const f = (label, html) => `<div class="f"><span class="lane-label">${label}</span>${html}</div>`;
  return `<div class="idrow">${f("workspace", sel("workspace", v.ws, "", "repo"))}${v.co ? f("checkout", sel("checkout", v.co, "", "checkout")) : ""}${v.br ? f("branch", sel("branch", v.br, "", "branch")) : ""}${f("machine", sel("runner", v.runner, "", "runnerId"))}${f("profile", sel("profile", v.profile, "", "profileId"))}<span class="note">${s ? `started ${s.startedAgo === "now" ? "just now" : s.startedAgo + " ago"} · fixed` : "locks when the thread starts"}</span></div>`;
}
/* the tab strip sketch: every thread open in this workspace, and + for one more beside them */
function tabsHtml() {
  const s = active() ? thread.session : null; const sib = thread.sibling;
  if (!s && !sib) { const rp = repoOf(); return `<div class="tabs"><span class="ws">${rp ? `${rp.id} · new worktree` : "no workspace"}</span><button class="tab on"><span class="mk">·</span><span>New thread</span></button><span class="ws" style="margin-left:auto">a thread can get siblings once its worktree exists</span></div>`; }
  const branch = s ? s.branch : sib.branch;
  const tabs = [{ title: "Fix flaky webhook tests", mk: s && s.status === "busy" ? "▮▮▮" : "○", live: s && s.status === "busy", on: !!s }, { title: "Write the retry runbook", mk: "○", on: false }];
  if (sib) tabs.push({ title: "New thread", mk: "·", on: true });
  return `<div class="tabs"><span class="ws">hydra · ${branch}</span>${tabs.map((t) => `<button class="tab ${t.on ? "on" : ""}"><span class="mk ${t.live ? "live" : ""}">${t.mk}</span><span>${t.title}</span></button>`).join("")}<button class="tab plus" data-go="sibling" title="Another thread in this worktree">+</button></div>`;
}

/* ============ page ============ */
function baseTranscript() { return [{ kind: "stamp", t: "Thu 11 Sep · 09:02" }, { kind: "user", t: "The webhook retry tests fail about one run in five. Find out why and fix it without loosening the assertions." }, { kind: "worked", t: "31s" }, { kind: "agent", t: "<p>Two of the three failures are the same race: the retry scheduler fires before the fake clock advances, so the first attempt lands a tick early and the assertion on attempt count sees two.</p><p>The third failure is unrelated: <code>test/webhooks/retry.test.ts</code> reuses a port across cases. Fixing the race first; the port reuse is a one-liner after.</p>" }, { kind: "user", t: "Go ahead, race first." }, { kind: "worked", live: true, t: "12s" }]; }
function transcriptHtml() {
  const s = thread.session; const rows = transcript.map((r, idx) => {
    if (r.kind === "stamp") return `<div class="stamp">${r.t}</div>`;
    if (r.kind === "user") return `<div class="umsg">${esc(r.t)}</div>`;
    if (r.kind === "agent") return `<div class="amsg">${r.t}</div>`;
    const live = r.live && s.status === "busy" && idx === transcript.length - 1; return `<div class="worked ${live ? "live" : ""}"><span class="wt">${live ? "Working for" : "Worked for"} ${r.t}</span><span>›</span></div>`;
  });
  if (s.status === "exited") rows.push(`<div class="stamp">exited · the harness process ended 2h ago</div>`);
  return rows.join("");
}
function render() {
  const V = variant(); const s = active() ? thread.session : null;
  document.getElementById("side").innerHTML = `<div class="brand">Hydra <small>rogier</small></div><div class="seg"><span class="on">Threads</span><span>Hydra</span></div><button class="new">+ Create new thread</button>
    <div class="pj"><i></i>hydra</div>
    ${s ? `<div class="row on"><span class="mk ${s.status === "busy" ? "live" : ""}">${s.status === "busy" ? "▮▮▮" : s.status === "exited" ? "–" : "○"}</span><span class="t">${esc(s.title)}</span><span class="age">${s.startedAgo}</span><span class="m">${(setupValues().brPlain || "no workspace")} · ${modelOf(s) ? modelOf(s).name : s.model}</span></div>` : `<div class="row on"><span class="mk">·</span><span class="t" style="color:var(--muted)">New thread</span><span class="age">draft</span></div>`}
    ${thread.sibling ? `<div class="row"><span class="mk">○</span><span class="t">Fix flaky webhook tests</span><span class="age">12m</span><span class="m">hydra/run-3f1 · Sonnet 5</span></div>` : ""}
    <div class="row"><span class="mk q">?</span><span class="t">Runner drain command</span><span class="age">4m</span><span class="m">hydra/run-3f1 · Sonnet 5</span></div>
    <div class="row"><span class="mk">○</span><span class="t">Tidy the promotion runbook</span><span class="age">2h</span><span class="m">no workspace · Sonnet 5</span></div>
    <div class="pj ops"><i></i>ops</div>
    <div class="row"><span class="mk">✓</span><span class="t">Rotate the Hetzner backups key</span><span class="age">3d</span><span class="m">main checkout · GPT-5.6</span></div>
    <div class="foot"><span>6 runners · 1 at cap</span><span>Marks <span class="mono" style="float:right;color:var(--faint)">?</span></span></div>`;
  document.getElementById("top").innerHTML = `<span class="crumb">hydra /</span> ${s ? esc(s.title) : "New thread"} ${s ? `<span class="id">thread · 9c2f41d0</span>` : ""}`;
  const composer = V === "A" ? variantA() : V === "B" ? variantB() : variantC();
  const hero = s ? "" : thread.sibling
    ? `<div class="hero"><h2>Another thread in <u>hydra/run-3f1</u></h2><p>It shares the worktree with “${thread.sibling.title}”: both agents see each other's edits, on one branch. Pick a model and say what this one should do.</p></div>`
    : `<div class="hero"><h2>What should the agent do in <u>hydra</u>?</h2><p>${V === "C" ? "The row above is the thread's setup; it locks when you send the first message." : "The input carries the thread's setup; it locks when you send the first message."}</p></div>`;
  document.getElementById("thread").innerHTML = `${tabsOn() ? tabsHtml() : ""}${V === "C" ? idRowHtml() : ""}<div class="tcol">${s ? transcriptHtml() : hero}</div>${composer}`;
  const ta = document.getElementById("compose"); if (ta) { grow(ta); if (!ta.disabled && document.activeElement !== ta && !open) ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  const tcol = document.querySelector(".tcol"); if (tcol && s) tcol.scrollTop = tcol.scrollHeight;
  placePop();
  document.getElementById("bar").innerHTML = `<button data-bar="prev" aria-label="Previous variant">←</button><span class="lbl">${V} (${VARIANTS[V]})</span><button data-bar="next" aria-label="Next variant">→</button><button data-bar="state">state: ${stateKey()}</button><button data-bar="pill">pill: ${pillMode()}</button><button data-bar="tabs">tabs: ${tabsOn() ? "on" : "off"}</button><button data-bar="theme" aria-label="Toggle theme">◐</button>`;
  document.getElementById("note").innerHTML = `<b>PROTOTYPE</b> · hydra#160 · round 2 · ← → variant · s state · p pill · b tabs · t theme`;
}
function grow(ta) { ta.style.height = "auto"; ta.style.height = `${Math.min(ta.scrollHeight, 8 * 21)}px`; }
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);

/* ============ events ============ */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-pop],[data-pick],[data-go],[data-send],[data-stop],[data-bar],[data-legacy]");
  if (!el) { if (!e.target.closest("#pop")) { if (open) { open = null; render(); } } return; }
  if (el.dataset.bar) {
    const keys = Object.keys(VARIANTS); const i = keys.indexOf(variant());
    if (el.dataset.bar === "prev") return setParam("variant", keys[(i + keys.length - 1) % keys.length]);
    if (el.dataset.bar === "next") return setParam("variant", keys[(i + 1) % keys.length]);
    if (el.dataset.bar === "state") return setParam("state", STATES[(STATES.indexOf(stateKey()) + 1) % STATES.length]);
    if (el.dataset.bar === "pill") return setParam("pill", pillMode() === "one" ? "split" : "one");
    if (el.dataset.bar === "tabs") return setParam("tabs", tabsOn() ? "off" : "on");
    if (el.dataset.bar === "theme") { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; return; }
  }
  if (el.dataset.pop) { open = open === el.dataset.pop ? null : el.dataset.pop; FILTER = ""; return render(); }
  if (el.dataset.legacy) { SHOW_LEGACY[el.dataset.legacy] = true; return render(); }
  if (el.dataset.pick) { const pick = JSON.parse(el.dataset.pick); applyPick(pick); if (pick.field !== "option" && !(pick.field === "instance" && !pick.slug)) open = null; return render(); }
  if (el.dataset.go === "login") { FRESH_LOGIN = true; catalogs().instances[0].on = ["laptop"]; open = null; return render(); }
  if (el.dataset.go === "runner") { open = "runner"; return render(); }
  if (el.dataset.go === "new") return setParam("state", "draft");
  if (el.dataset.go === "sibling") return setParam("state", "sibling");
  if (el.dataset.send) return submit();
  if (el.dataset.stop) { const s = thread.session; s.status = "idle"; transcript[transcript.length - 1] = { kind: "worked", t: "14s · stopped" }; return render(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "compose") { message = e.target.value; grow(e.target); const b = document.querySelector(".sendc"); if (b) b.disabled = !(message.trim() && !blocker()); }
  if (e.target.id === "mfilter") { FILTER = e.target.value; placePop(); }
});
document.addEventListener("keydown", (e) => {
  const typing = e.target.matches("input,textarea,[contenteditable]");
  if (e.key === "Escape") { if (open) { open = null; render(); } return; }
  if (typing) { if (e.target.id === "compose" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); } return; }
  const keys = Object.keys(VARIANTS); const i = keys.indexOf(variant());
  if (e.key === "ArrowLeft") setParam("variant", keys[(i + keys.length - 1) % keys.length]);
  if (e.key === "ArrowRight") setParam("variant", keys[(i + 1) % keys.length]);
  if (e.key === "s") setParam("state", STATES[(STATES.indexOf(stateKey()) + 1) % STATES.length]);
  if (e.key === "p") setParam("pill", pillMode() === "one" ? "split" : "one");
  if (e.key === "b") setParam("tabs", tabsOn() ? "off" : "on");
  if (e.key === "t") { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; }
});
window.addEventListener("resize", placePop);
function boot() { reset(); render(); }
if (params().get("theme") === "dark" || (!params().get("theme") && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.dataset.theme = "dark";
boot();
</script>
</body>
