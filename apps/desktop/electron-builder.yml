# Packages the desktop app: `Hercule.app` on macOS, a `.deb` on Linux. The
# product name comes from `productName` in package.json, which Electron also
# reads at run time, so the app's name and its user data folder agree with the
# bundle's name.
#
# `pnpm package` (`scripts/package.ts`) runs electron-builder twice with this
# config:
#
# - the release package, into dist/release;
# - the test package, into dist/test. It differs from the release package in
#   one fuse, EnableNodeCliInspectArguments, which it leaves on because
#   Playwright's Electron driver starts the app with `--inspect`. On macOS it
#   is also signed ad hoc, so it never carries a real signature with that fuse
#   on, and on Linux it is an unpacked folder, not a `.deb`, because the
#   tests run the executable in place. The end-to-end tests and the perf
#   script run it; a test reads every fuse off the release package.

# The macOS bundle identifier. It cannot change once the app is released.
appId: sh.hercule.desktop

directories:
  output: dist/release

# Main, the preload and the renderer are bundled into `out/`, so the app needs
# nothing else: no node_modules, no source. The rest of `out/` holds what the
# design checks write, such as `compare:bureau`'s and `capture:first-run`'s
# screenshots, which the app never reads, so only the three bundles are
# packaged. The renderer's Vite manifest is left out: only the bundle budget
# check reads it, at build time.
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - "!out/renderer/.vite/**"
  - package.json
asar: true
npmRebuild: false

# The `edge-build` job in CI signs the release package with one self-signed
# certificate, which it names in `CSC_NAME`, so every edge build has the same
# designated requirement and the Keychain keeps trusting it after an update
# (spec 17). Elsewhere electron-builder signs with the first code-signing
# identity it finds in the keychain, which on a developer's Mac may be their
# own, and a build that finds none is signed ad hoc. The test package is always
# signed ad hoc (see `package` in package.json).
mac:
  target: dir
  # The hardened runtime applies only to a build signed with an identity; an
  # ad hoc build runs without it. Among other things, it stops a library named
  # in DYLD_INSERT_LIBRARIES from being loaded into the app. The entitlements
  # list the two exceptions Electron needs. The file replaces electron-builder's
  # default one, which also allows allow-unsigned-executable-memory, an
  # exception Electron does not need:
  #
  # - allow-jit, for V8's compiler;
  # - disable-library-validation, because a self-signed certificate has no
  #   Team ID, and with library validation on macOS refuses to load Electron's
  #   frameworks into a process whose signature names no Team ID.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# The macOS app has no icon of its own: nothing here names one, so macOS shows
# Electron's default. electron-builder reads the macOS icon from `mac.icon` and
# the Linux one from `linux.icon`; no ticket has asked for a macOS one yet.
#
# Linux. Without `executableName` the executable is named after `name` in
# package.json, `@hercule/desktop`, and comes out as `@herculedesktop`. The
# `.deb`'s package name is set to a plain Debian name rather than derived from
# that scoped name. The `.deb` is built with fpm, which needs `ar` from the
# `binutils` package on the machine that packages.
linux:
  target: deb
  executableName: hercule-desktop
  # A 512 pixel PNG, drawn from the Bureau book's app icon tile. `build/icon.svg`
  # is its source.
  icon: build/icon.png
  category: Development
  # Writes `desktopName` into the packaged package.json, so Electron sets the
  # window's class to the name of the installed `.desktop` file and the desktop
  # shows the app's icon on its window.
  syncDesktopName: true
  maintainer: Rogier Pennink <rogierpennink@users.noreply.github.com>
  synopsis: The Hercule desktop app
  # The `.desktop` file's comment, which a launcher shows under the name, and
  # the package's long description.
  description: Desktop app for the Hercule agent orchestration platform.

deb:
  packageName: hercule-desktop
  # electron-builder's own list, which a `depends` here replaces, plus two
  # libraries Electron links that the list leaves out: the sound library and
  # libgbm. On a machine that has them installed only as recommended packages,
  # or not at all, such as a minimal server, the `.deb` installs and the app
  # then fails to start. Ubuntu 24.04 names the sound library libasound2t64,
  # older releases libasound2.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1

# The file name every build of the `.deb` has, so the `edge` release can
# replace it in place. `${arch}` is Debian's name for the CPU, amd64 or arm64.
artifactName: Hercule-linux-${arch}.${ext}

# Spec 17, §Security baseline. Flipping a fuse changes the Electron binary and
# so breaks its ad hoc signature; `resetAdHocDarwinSignature` signs it again,
# without which an unsigned arm64 build does not start.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Main serves the renderer on the `app` scheme and reads its files itself,
  # so nothing is loaded over file:// and file:// pages need no privileges.
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true
