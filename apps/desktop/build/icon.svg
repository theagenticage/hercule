<?xml version="1.0" encoding="UTF-8"?>
<!-- The app icon: the Hercule mark on the lacquer tile of the Bureau book's app icon
     (docs/design/crew-bureau-2/system.css, .app-icon), 512 by 512 with transparent corners.
     The tile's corner radius is 23% of its size and its brass line sits between 6% and 7.5% in
     from the edge. The mark's 32-unit box fills 64% of the tile, so one unit is 10.24 pixels and
     the box starts 92.16 pixels in. The paths are the logo() paths of crew.js, also drawn by
     apps/desktop/src/renderer/logos/logo-mark.tsx. The colours are the book's oklch values as
     sRGB hex, as the Android launcher icon writes them: lacquer oklch(0.29 0.035 165), brass
     oklch(0.72 0.085 85), lime oklch(0.78 0.125 132) and face ink oklch(0.23 0.025 165).
     `build/icon.png` is this file rendered at 512 by 512; render it again after an edit. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="117.76" fill="#1a3127"/>
  <rect x="34.56" y="34.56" width="442.88" height="442.88" rx="83.2" fill="none" stroke="#bda165" stroke-width="7.68"/>
  <g transform="translate(92.16 92.16) scale(10.24)">
    <path fill="#99c872" d="M16 2.4c-6.3 0-10.9 7.6-10.9 14.8 0 7.1 4.8 12.4 10.9 12.4s10.9-5.3 10.9-12.4C26.9 10 22.3 2.4 16 2.4z"/>
    <g fill="#11211a">
      <circle cx="12.4" cy="14.6" r="1.55"/>
      <circle cx="19.6" cy="14.6" r="1.55"/>
      <path d="M16 19.2c-1.5-1.2-3.4-1.5-5.1-.7-.9.4-1.7.3-2.3-.4-.4-.5-1.2-.3-1.1.4.3 1.9 2 3 4 2.8 1.8-.2 3.3-.9 4.5-1.8 1.2.9 2.7 1.6 4.5 1.8 2 .2 3.7-.9 4-2.8.1-.7-.7-.9-1.1-.4-.6.7-1.4.8-2.3.4-1.7-.8-3.6-.5-5.1.7z"/>
    </g>
  </g>
</svg>
