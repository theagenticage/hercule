<!doctype html><html lang="en" data-theme="whitehaven"><head><meta charset="utf-8"><title>Sketch A: Clock and shelf</title>
<script src="../../shared/page.js"></script>
<link rel="stylesheet" href="../vendor/tokens.css"><link rel="stylesheet" href="../vendor/row-heights.css"><link rel="stylesheet" href="../vendor/base.css"><link rel="stylesheet" href="../vendor/controls.css"><link rel="stylesheet" href="../vendor/shell.css"><link rel="stylesheet" href="../vendor/sidebar.css"><link rel="stylesheet" href="sketch.css">
<style>
.page{padding:4px 24px 40px}
.head{font-size:var(--t-20);font-weight:500;margin:4px 0 18px;letter-spacing:-.005em}
.head b{font-weight:500;color:var(--you-ink)}
.noticed{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:12px;margin-top:12px}
.c{padding:12px 14px 12px;display:flex;flex-direction:column;gap:8px;min-height:116px}
.c .h{display:flex;align-items:center;gap:7px;color:var(--faint);font-size:var(--t-12)}
.c .h .br{color:var(--ink)}
.c .h .w{margin-left:auto;font-size:var(--t-14)}
.c .t{font-size:var(--t-14);font-weight:500;line-height:20px;flex:1;text-wrap:pretty}
.c .r{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:var(--t-12)}
.c .r.bad{color:var(--fail-ink)}.c .r.good{color:var(--ok)}
.shelf .g{margin-top:14px;color:var(--faint);font-size:var(--t-12);font-weight:600}
.s{padding:9px 12px;margin-top:6px;box-shadow:inset 0 0 0 1px var(--line-soft);background:var(--surface);border-radius:9px;display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start}
.s .br{color:var(--muted);margin-top:1px}
.s .t{font-weight:500;font-size:var(--t-13);line-height:18px}.s .i{color:var(--faint);font-size:var(--t-12)}
</style></head><body><div class="app"><aside class="side"></aside><main class="main">
<div class="bar">Inbox</div><div class="page">
<div class="head">Juno has waited longest. <b>Hercule noticed three things.</b></div>
<div class="noticed" id="n"></div>
<div class="split"><div><div class="sec">On the clock <i>oldest first</i></div><div class="grid" id="g"></div></div><div class="shelf"><div class="sec">On the shelf</div><div id="s"></div></div></div>
</div></main></div>
<script src="../vendor/brands.js"></script><script src="../vendor/crew.js"></script><script src="sketch.js"></script>
<script>
function wc(h){return h>=72?'hot':h>=24?'mid':h>=6?'low':'new'}
n.innerHTML=S.noticed.map(c=>`<div class="lac"><div class="h">${Crew.logo?Crew.logo(18,{mono:true}):''}${c.src.map(b=>S.br(b,14)).join('')}</div><div class="t">${c.t}</div><div class="why">${c.why}</div></div>`).join('');
g.innerHTML=S.clock.concat(S.mine).map(c=>`<div class="card c"><div class="h">${S.br(c.m,18)}<span>${c.id}</span><span class="w ${wc(c.h)}">${c.w}</span></div><div class="t">${c.t}</div><div class="r ${c.bad?'bad':c.good?'good':''}">${c.p?S.av(c.p):''}<span>${c.r}</span>${c.c?'<span style="margin-left:auto;color:var(--faint)">+'+c.c+'</span>':''}</div></div>`).join('');
s.innerHTML=S.shelf.map(gr=>`<div class="g">${gr.g}</div>`+gr.items.slice(0,3).map(i=>`<div class="s">${S.br(i.m,15)}<div><div class="t">${i.t}</div><div class="i">${i.id}</div></div></div>`).join('')+(gr.items.length>3?`<div style="color:var(--faint);font-size:12px;margin:6px 2px">${gr.items.length-3} more</div>`:'')).join('');
</script></body></html>
