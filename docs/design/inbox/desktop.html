<!doctype html>
<html lang="en" data-theme="whitehaven">
<head>
<meta charset="utf-8">
<title>Inbox</title>
<script src="../shared/page.js"></script>
<link rel="stylesheet" href="vendor/tokens.css">
<link rel="stylesheet" href="vendor/row-heights.css">
<link rel="stylesheet" href="vendor/base.css">
<link rel="stylesheet" href="vendor/controls.css">
<link rel="stylesheet" href="vendor/shell.css">
<link rel="stylesheet" href="vendor/sidebar.css">
<link rel="stylesheet" href="vendor/face.css">
<link rel="stylesheet" href="vendor/primitives.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/inbox.css">
<link rel="stylesheet" href="css/open.css">
<link rel="stylesheet" href="css/states.css">
</head>
<body>
<a class="skip" href="#page" data-skip>Skip to the cards</a>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main" tabindex="-1">
    <div class="ib-bar">
      <div class="pill" id="pill"><h1 class="pill-title">Inbox</h1><button class="ptab is-on" data-view="cards" aria-current="page">Cards</button><button class="ptab" data-view="intake">Intake</button></div>
      <div class="ib-notice" id="notice" role="status" hidden></div>
      <div class="ib-end"><div class="ib-sources" id="sources"></div><button class="ib-help" data-help title="Keys (?)" aria-label="Show the keys">?</button></div>
    </div>
    <div class="ib-page" id="page"></div>
    <div class="rail" id="rail" hidden></div>
    <div class="scrim" id="scrim" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </main>
</div>
<section class="open" id="open" role="dialog" aria-modal="true" aria-label="Open card" hidden></section>
<div class="menu" id="menu" role="menu" aria-label="Hand to" hidden></div>
<section class="tray" id="tray" role="dialog" aria-modal="true" aria-label="Folded cards" hidden></section>
<div class="sr" id="announcer" role="status" aria-live="polite"></div>
<script src="vendor/brands.js"></script>
<script src="vendor/faces.js"></script>
<script src="js/logo.js"></script>
<script src="js/kinds.js"></script>
<script src="js/world.js"></script>
<script src="js/card.js"></script>
<script src="js/stacks.js"></script>
<script src="vendor/motion.js"></script>
<script src="js/motion-extras.js"></script>
<script src="js/nav.js"></script>
<script src="js/app.js"></script>
<script src="js/pointer.js"></script>
<script src="js/landing.js"></script>
<script src="js/moves.js"></script>
<script src="js/open.js"></script>
<script src="js/tray.js"></script>
<script src="js/drag.js"></script>
<script src="js/skeleton.js"></script>
<script src="js/keys.js"></script>
<script src="js/pages.js"></script>
<script src="js/live.js"></script>
<script src="js/scenes.js"></script>
<script src="js/director.js"></script>
<script>Nav.draw(); Pointer.start(); Moves.start(); Open.start(); Tray.start(); Keys.start(); Pages.start(); Drag.start(); App.start(); Director.start(); Live.start();</script>
</body>
</html>
