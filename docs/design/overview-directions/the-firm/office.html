<!doctype html>
<html lang="en" data-theme="whitehaven">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- PROTOTYPE - The Firm's Office, the Dollhouse, alone and full-window, with a small switcher
         for the state and the theme. URL: ?state=everyday|open|swarm|away|spawn|exchange|standup,
         ?theme=whitehaven|orient-express, ?select=<session id>, ?motion=off for Reduce Motion,
         ?bar=off to hide the switcher (for captures). -->
    <script src="../../shared/page.js"></script>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../crew-bureau-2/tokens.css" />
    <link rel="stylesheet" href="the-firm-office.css" />
    <title>The Firm · the Dollhouse · Hercule</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--surface);
        font-family: var(--font-ui);
      }
      #office {
        position: fixed;
        inset: 0;
      }
      .tfo-page-bar {
        position: fixed;
        top: 12px;
        left: 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px;
        max-width: calc(100vw - 24px);
        padding: 4px;
        box-sizing: border-box;
        border-radius: var(--r-md);
        background: var(--raised);
        box-shadow:
          var(--shadow-1),
          inset 0 0 0 1px var(--line-soft);
        color: var(--ink);
        font-size: var(--t-12);
      }
      .tfo-page-bar[hidden] {
        display: none;
      }
      .tfo-page-bar b {
        margin: 0 8px 0 8px;
        font-weight: var(--w-bold);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .tfo-page-bar i {
        width: 1px;
        height: 16px;
        margin: 0 4px;
        background: var(--line-soft);
      }
      .tfo-page-bar button {
        height: 24px;
        padding: 0 9px;
        border: 0;
        border-radius: var(--r-xs);
        background: transparent;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }
      .tfo-page-bar button:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .tfo-page-bar button[aria-pressed="true"] {
        background: var(--selected);
        color: var(--ink);
        font-weight: var(--w-medium);
      }
    </style>
  </head>
  <body>
    <div id="office"></div>
    <nav class="tfo-page-bar" aria-label="State and theme">
      <b>The Dollhouse</b>
      <span data-group="state"></span>
      <i></i>
      <span data-group="theme"></span>
    </nav>

    <script src="../../sidebar-directions/shared/world.js"></script>
    <script src="../shared/world-plus.js"></script>
    <script src="the-firm-data.js"></script>
    <script src="../vendor/office-kit.js"></script>
    <script src="the-firm-office.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var root = document.documentElement;
        var states = ["everyday", "open", "swarm", "away", "spawn", "exchange", "standup"];
        var state = states.indexOf(params.get("state")) >= 0 ? params.get("state") : "everyday";
        var selected = params.get("select") || (state === "open" ? "t3ds" : null);
        var bar = document.querySelector(".tfo-page-bar");
        if (params.get("bar") === "off") bar.hidden = true;

        var handle = OfficeModes["the-firm"].mount(document.getElementById("office"), {
          world: window.WORLD,
          theme: root.dataset.theme,
          state: state,
          selected: selected,
          // office.html only: freezes a state's moment at a phase, for captures (see the module's moments).
          moment: params.get("moment"),
          reducedMotion: params.get("motion") === "off" || matchMedia("(prefers-reduced-motion: reduce)").matches,
          onSelect: function (id) {
            console.log("select", id);
          },
          onOpen: function (id) {
            console.log("open", id);
          },
        });

        function draw() {
          bar.querySelector('[data-group="state"]').innerHTML = states
            .map(function (s) {
              return '<button type="button" data-state="' + s + '" aria-pressed="' + (s === state) + '">' + s + "</button>";
            })
            .join("");
          var evening = root.dataset.theme === "orient-express" || root.dataset.theme === "dark";
          bar.querySelector('[data-group="theme"]').innerHTML =
            '<button type="button" data-theme-choice="whitehaven" aria-pressed="' + !evening + '">Whitehaven</button>' +
            '<button type="button" data-theme-choice="orient-express" aria-pressed="' + evening + '">Orient Express</button>';
        }
        bar.addEventListener("click", function (e) {
          var b = e.target.closest("button");
          if (!b) return;
          if (b.dataset.state) {
            state = b.dataset.state;
            handle.setState(state);
            if (state === "open") handle.select("t3ds");
          }
          if (b.dataset.themeChoice) root.dataset.theme = b.dataset.themeChoice;
          draw();
        });
        draw();
        if (params.get("view")) handle.show(params.get("view"));
        window.dollhouse = handle;
      })();
    </script>
  </body>
</html>
