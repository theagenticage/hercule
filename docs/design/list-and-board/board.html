<!doctype html>
<html lang="en" data-theme="whitehaven">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1440" />
    <link rel="icon" href="data:," />
    <script src="../shared/page.js"></script>
    <link rel="stylesheet" href="../crew-bureau-2/tokens.css" />
    <link rel="stylesheet" href="../crew-bureau-2/system.css" />
    <link rel="stylesheet" href="board.css" />
    <title>Kanban · Hercule</title>
    <!--
      PROTOTYPE - the Kanban module (board.js) mounted alone over the whole heavy morning, with a
      stand-in peek panel so a click visibly does something, and a Design review bar.

      URL: ?board=state|phase  ?lanes=project  ?partners=cards  ?theme=whitehaven|orient-express
           ?select=<id>  ?moment=move|move-mid  ?q=<query>  ?lens=all|following|mine|waiting
      moment=move draws By phase and, a moment after load, moves "Refactor cart totals" from
      Changing to Verifying; move-mid freezes that slide halfway, for a still.
    -->
    <style>
      /* Everything here belongs to this page, not to the module. */
      .lbb-page {
        position: fixed;
        inset: 0;
        display: flex;
        background: var(--surface);
      }
      .lbb-host {
        position: relative;
        flex: 1;
        min-width: 0;
      }

      /* ---------- the stand-in peek ---------- */
      .lbb-peek {
        flex: none;
        width: 0;
        overflow: hidden;
        background: var(--surface);
        box-shadow: inset 1px 0 0 var(--line-soft);
        transition: width var(--dur-3) var(--ease-out);
      }
      .lbb-page.is-peeking .lbb-peek {
        width: 352px;
      }
      .lbb-peek-in {
        width: 352px;
        height: 100%;
        overflow-y: auto;
        padding: 18px 22px 80px;
      }
      .lbb-peek-cap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 30px;
        color: var(--faint);
        font-size: var(--t-11);
      }
      .lbb-peek-h {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 10px 0 14px;
      }
      .lbb-peek-h b {
        font-size: var(--t-14);
        font-weight: var(--w-medium);
        line-height: 1.3;
      }
      .lbb-peek-line {
        margin: 0 0 16px;
        color: var(--muted);
      }
      .lbb-peek-line.is-you {
        color: var(--you-ink);
      }
      .lbb-peek dl {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr);
        gap: 8px 12px;
        margin: 0 0 18px;
        font-size: var(--t-12);
      }
      .lbb-peek dt {
        color: var(--faint);
      }
      .lbb-peek dd {
        margin: 0;
        color: var(--muted);
      }
      .lbb-peek-crew {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin: 8px 0 18px;
      }
      .lbb-peek-crew .who-row {
        min-height: 38px;
        padding-left: 2px;
      }
      .lbb-peek-crew .who-name {
        font-weight: var(--w-medium);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lbb-peek-crew .who-sub {
        color: var(--muted);
        font-size: var(--t-12);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lbb-peek-crew .who-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
        line-height: 1.3;
      }

      /* ---------- the Design review bar: visibly not part of the product ---------- */
      .lbb-review {
        position: fixed;
        left: 50%;
        bottom: 16px;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 6px 5px 14px;
        border-radius: var(--r-lg);
        transform: translateX(-50%);
        font-size: var(--t-12);
        white-space: nowrap;
      }
      .lbb-review-label {
        margin-right: 4px;
        color: var(--faint);
        font-size: var(--t-11);
        font-weight: var(--w-bold);
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .lbb-review .seg button {
        height: 24px;
        padding: 0 9px;
        font-size: var(--t-12);
      }
    </style>
  </head>
  <body>
    <div class="lbb-page" data-page>
      <div class="lbb-host" data-board-host></div>
      <aside class="lbb-peek" aria-label="Peek">
        <div class="lbb-peek-in" data-peek></div>
      </aside>
    </div>

    <div class="lbb-review glass" role="toolbar" aria-label="Design review">
      <span class="lbb-review-label">Design review</span>
      <div class="seg" data-review="board"><button data-v="state">By state</button><button data-v="phase">By phase</button></div>
      <div class="seg" data-review="lanes"><button data-v="off">Columns</button><button data-v="project">Lanes by project</button></div>
      <div class="seg" data-review="partners"><button data-v="fold">Partners folded</button><button data-v="cards">Partners as cards</button></div>
      <div class="seg" data-review="moment"><button data-v="still">Still</button><button data-v="move">Move a card</button></div>
      <div class="seg" data-review="theme"><button data-v="whitehaven">Light</button><button data-v="orient-express">Dark</button></div>
    </div>

    <script src="../sidebar-directions/shared/world.js"></script>
    <script src="shared/heavy-world.js"></script>
    <script src="shared/digest.js"></script>
    <script src="board.js"></script>
    <script src="../crew-bureau-2/brands.js"></script>
    <script src="../crew-bureau-2/crew.js"></script>
    <script>
      (function () {
        "use strict";
        var H = window.HEAVY;
        var D = window.Digest;
        var params = new URLSearchParams(location.search);
        var moment = params.get("moment");
        var view = {
          board: params.get("board") || (moment ? "phase" : "state"),
          lanes: params.get("lanes") === "project" ? "project" : "off",
          partners: params.get("partners") === "cards" ? "cards" : "fold",
          moment: moment === "move" || moment === "move-mid" ? "move" : "still",
          theme: document.documentElement.dataset.theme || "whitehaven",
        };

        // The window's find bar and lenses, in miniature, so a filtered board can be checked here.
        function filterSessions(list) {
          var q = D.parseQuery(params.get("q") || "");
          var lens = { waiting: "needs-you" }[params.get("lens")] || params.get("lens") || "all";
          return list.filter(function (s) { return D.matches(s, q).ok && D.lens(s, lens); });
        }

        function copy(o, extra) {
          var c = {};
          Object.keys(o).forEach(function (k) { c[k] = o[k]; });
          Object.keys(extra || {}).forEach(function (k) { c[k] = extra[k]; });
          return c;
        }

        // The moment: "Refactor cart totals" runs its tests, so its phase becomes Verifying.
        function buildMovedWorld() {
          return H.sessions.map(function (s) {
            if (s.id !== "tCart") return s;
            return copy(s, {
              last: "09:41",
              digest: copy(s.digest, { phase: "verifying", activity: "Running pnpm test cart", phaseBasis: "ran pnpm test cart" }),
            });
          });
        }

        function readWorld() {
          return filterSessions(view.moment === "move" ? buildMovedWorld() : H.sessions);
        }

        /* ---------- the stand-in peek ---------- */

        var page = document.querySelector("[data-page]");
        var peekEl = document.querySelector("[data-peek]");

        function esc(t) {
          return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
        }

        function findRun(id) {
          return H.runs.filter(function (r) { return r.id === id; })[0] || null;
        }

        function findDone(id) {
          return H.doneToday.filter(function (d) { return d.id === id; })[0] || null;
        }

        function drawCrewRow(s) {
          var line = D.line(s);
          return (
            '<div class="who-row">' + Crew.face(s.title, { pose: s.pose, size: 22 }) +
            '<span class="who-text"><span class="who-name">' + esc(s.title) + '</span><span class="who-sub"' + (line.tone === "you" ? ' style="color:var(--you-ink)"' : "") + ">" + esc((s.role ? s.role + " · " : "lead · ") + line.text) + "</span></span></div>"
          );
        }

        function drawPeek(id) {
          var s = H.session(id);
          var run = s ? null : findRun(id);
          var done = s || run ? null : findDone(id);
          var cap = '<div class="lbb-peek-cap"><span>Stand-in for the window’s peek panel</span><kbd>esc</kbd></div>';
          if (run) {
            return cap + '<div class="lbb-peek-h">' + Crew.face(run.title, { pose: "waiting", size: 28 }) + "<b>" + esc(run.title) + '</b></div><p class="lbb-peek-line is-you">' + esc(run.waiting.ask) + "</p>" +
              "<dl><dt>Run</dt><dd>" + esc(run.workflow) + "</dd><dt>Step</dt><dd>" + esc(run.waiting.step) + "</dd><dt>Machine</dt><dd>" + esc(run.machine) + "</dd></dl>";
          }
          if (done) {
            return cap + '<div class="lbb-peek-h">' + Crew.face(done.title, { pose: "done", size: 28 }) + "<b>" + esc(done.title) + '</b></div><p class="lbb-peek-line">Marked done at ' + esc(done.doneAt) + "</p>";
          }
          var line = D.line(s);
          var where = D.where(s);
          var progress = D.progress(s);
          var leadId = s.lead || s.id;
          var crew = H.teamOf(leadId);
          return (
            cap +
            '<div class="lbb-peek-h">' + Crew.face(s.title, { pose: s.pose, size: 28 }) + "<b>" + esc(s.title) + "</b></div>" +
            '<p class="lbb-peek-line' + (line.tone === "you" ? " is-you" : "") + '">' + esc(line.text) + "</p>" +
            "<dl>" +
            "<dt>Phase</dt><dd>" + esc(D.phaseLabel(D.phaseOf(s))) + "</dd>" +
            "<dt>Why</dt><dd>" + esc(s.digest.phaseBasis) + "</dd>" +
            (progress.label ? "<dt>Progress</dt><dd>" + esc(progress.label) + "</dd>" : "") +
            "<dt>Where</dt><dd>" + esc([where.focus, where.branch, where.machine].filter(Boolean).join(" · ")) + "</dd>" +
            "</dl>" +
            (crew.length > 1 ? '<h3 class="section-h">Crew <span class="faint">' + crew.length + "</span></h3>" + '<div class="lbb-peek-crew">' + crew.map(drawCrewRow).join("") + "</div>" : "") +
            '<button class="btn btn--sm" type="button">Open thread' + Crew.icon("chev-r", 13) + "</button>"
          );
        }

        function showPeek(id) {
          if (!id) {
            page.classList.remove("is-peeking");
            return;
          }
          peekEl.innerHTML = drawPeek(id);
          page.classList.add("is-peeking");
        }

        /* ---------- the board ---------- */

        var handle;
        var selected = params.get("select") || null;

        function select(id) {
          selected = id;
          showPeek(id);
          handle.select(id);
          writeUrl();
        }

        function writeUrl() {
          var p = new URLSearchParams(location.search);
          function set(k, v, dflt) { if (v && v !== dflt) p.set(k, v); else p.delete(k); }
          set("board", view.board, "state");
          set("lanes", view.lanes, "off");
          set("partners", view.partners, "fold");
          set("theme", view.theme, "whitehaven");
          set("select", selected, null);
          if (view.moment === "still") p.delete("moment");
          history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p.toString() : ""));
        }

        function pressReview() {
          document.querySelectorAll("[data-review]").forEach(function (seg) {
            seg.querySelectorAll("button").forEach(function (b) {
              b.setAttribute("aria-pressed", String(view[seg.dataset.review] === b.dataset.v));
            });
          });
        }

        document.querySelectorAll("[data-review] button").forEach(function (b) {
          b.addEventListener("click", function () {
            var key = b.parentElement.dataset.review;
            var v = b.dataset.v;
            if (view[key] === v && key !== "moment") return;
            view[key] = v;
            if (key === "board") handle.setVariant(v);
            if (key === "lanes") handle.setSwimlanes(v === "project" ? "project" : false);
            if (key === "partners") handle.setPartners(v);
            if (key === "theme") document.documentElement.dataset.theme = v;
            if (key === "moment") {
              if (v === "move" && view.board !== "phase") {
                view.board = "phase";
                handle.setVariant("phase");
              }
              handle.update(readWorld());
            }
            pressReview();
            writeUrl();
          });
        });

        document.addEventListener("DOMContentLoaded", function () {
          var host = document.querySelector("[data-board-host]");
          var startMoved = moment && view.moment === "move";
          if (startMoved) view.moment = "still";
          handle = window.LBViews.board.mount(host, {
            sessions: readWorld(),
            now: H.now,
            variant: view.board,
            swimlanes: view.lanes === "project" ? "project" : false,
            partners: view.partners,
            selected: selected,
            onSelect: select,
            onOpen: function (id) { console.log("open", id); },
          });
          if (selected) showPeek(selected);
          if (window.top === window) host.querySelector(".lb-board").focus({ preventScroll: true });
          pressReview();

          if (startMoved) {
            setTimeout(function () {
              view.moment = "move";
              pressReview();
              handle.update(readWorld());
              if (moment === "move-mid") {
                setTimeout(function () {
                  document.getAnimations().forEach(function (a) {
                    a.pause();
                    a.currentTime = 360;
                  });
                }, 20);
              }
            }, 1200);
          }
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && selected) select(null);
        });
      })();
    </script>
  </body>
</html>
