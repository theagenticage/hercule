<!doctype html>
<html lang="en" data-theme="whitehaven">
<head><meta charset="utf-8"><title>Every card state</title>
<script src="../shared/page.js"></script>
<link rel="stylesheet" href="system/tokens.css"><link rel="stylesheet" href="system/base.css"><link rel="stylesheet" href="system/primitives.css"><link rel="stylesheet" href="css/work.css">
<style>
html,body{overflow:auto;height:auto;background:var(--desk);-webkit-user-select:none;user-select:none}
.wrap{padding:30px 40px 34px;display:grid;grid-template-columns:repeat(4,216px);gap:30px 18px;justify-content:center}
.lab{font:var(--type-meta);color:var(--faint);margin-bottom:18px}
</style></head>
<body><div class="wrap" id="w"></div>
<script src="system/brands.js"></script><script src="system/faces.js"></script>
<script src="../work-views/data.js"></script><script src="js/world.js"></script><script src="js/motion.js"></script><script src="js/store.js"></script><script src="js/board.js"></script>
<script>
// Every card here is drawn by the same code as the board.
Store.loadWorld(NW.buildToday());
var t = Store.task;
t("search-feed-errors").move = "you"; t("search-feed-errors").need = "quick"; t("search-feed-errors").ask = "Fix the records, or relax the rule?"; t("search-feed-errors").now = "Found them. Which way?";
var S = [["Quick call", "pr-qty-labels"], ["Real thinking", "substitutions"], ["An agent is on it", "flake-clock"], ["An agent asks you", "search-feed-errors"], ["With a person", "pr-font"], ["Blocked", "guest-checkout"], ["Landed", "flake-report"], ["Nobody yet", "t-cancelled"]];
var w = document.getElementById("w");
S.forEach(function (s) {
  var box = document.createElement("div");
  box.innerHTML = '<div class="lab">' + s[0] + "</div>";
  box.appendChild(Board.drawCard(t(s[1])));
  w.appendChild(box);
});
</script></body></html>
