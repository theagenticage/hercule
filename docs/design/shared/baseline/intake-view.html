<!--
  PROTOTYPE - throwaway. Ticket: https://github.com/rogierpennink/hercule/issues/1 -> #30
  ROUND 4 (converged). Round 3 reaction: Page's list (lead card + condensed tiered rows) won,
  with the Drawer for detail (master/detail left too little room for the overview; the detail
  is not needed constantly; the drawer's light card look beat the dedicated page); the
  connection events view is "amazing - gives me the context I need". This file is the
  converged single design. Rounds 1-3 (e0f5f7c, 3d6a81f, f4a452a) hold the variants.
  ROUND 3 was: Round 2 reaction: Topics (tabs) won; "made from" stays. Asks: a real DETAIL VIEW for
  proposed work (dive into details + source events) and for "what came in" (an events view);
  expandable things must look expandable; urgency must be legible in a second ("Needs a call"
  read as priority - it is not: it is what triage could NOT decide); with a detail view the
  cards can carry less text; and: how are tabs curated?
  This round keeps the Topics skeleton and varies the DETAIL-VIEW PATTERN, the structural call:
    A Drawer - list page with priority tiers (Now / Today / When you can); any card, connection
               or "manage topics" opens a right-hand drawer over the rail. Stay in place.
    B Page   - list page with one LEAD card for the burning item, condensed rows for the rest;
               detail is a full page with a breadcrumb back (Intake › Login failures…).
    C Split  - master/detail: compact tiered list on the left, detail always open on the right
               (replaces the rail); arrow keys move the selection.
  Shared this round: lighter cards (title · made-from marks · gist · next), explicit "open"
  affordances, an events view per connection (every event, stamped with its verdict, held
  events included), a Topics sheet answering curation (see the note under the switcher).
  Keys: ← → variant · ↑ ↓ selection (C) · Esc close · d dataset · t theme · n name.
  Rounds 1-2 in git history (e0f5f7c, 3d6a81f).
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hercule Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: oklch(94.5% 0.0156 265); --surface: oklch(96.7% 0.0125 265); --raised: oklch(100% 0.0078 265);
    --ink: oklch(23% 0.0100 265); --muted: oklch(48% 0.0156 265); --faint: oklch(66% 0.0156 265);
    --line: oklch(23% 0.0100 265 / 0.10); --line-soft: oklch(23% 0.0100 265 / 0.055);
    --card-shadow: 0 1px 2px rgba(23,26,33,0.05); --lift-shadow: 0 1px 2px rgba(23,26,33,0.06), 0 4px 14px rgba(23,26,33,0.06);
    --drawer-shadow: -8px 0 40px rgba(23,26,33,0.12); --scrim: rgba(23,26,33,0.18);
    --attn: #8a6116; --fail: #a34e46; --ok: #48745a; --live: #48717f; --attn-soft: rgba(138,97,22,0.09);
    --proj-hercule: #7d7ab0; --proj-ops: #a67f92;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: oklch(20% 0.0288 265); --surface: oklch(22.2% 0.0288 265); --raised: oklch(25.5% 0.0259 265);
    --ink: oklch(90% 0.0080 265); --muted: oklch(68% 0.0288 265); --faint: oklch(50% 0.0288 265);
    --line: oklch(90% 0.0288 265 / 0.10); --line-soft: oklch(90% 0.0288 265 / 0.06);
    --card-shadow: 0 1px 2px rgba(0,0,0,0.35); --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
    --drawer-shadow: -8px 0 40px rgba(0,0,0,0.5); --scrim: rgba(0,0,0,0.4);
    --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8; --attn-soft: rgba(208,161,71,0.12);
    --proj-hercule: #9490c9; --proj-ops: #bd93a8; } }
  :root[data-theme="dark"] {
    --bg: oklch(20% 0.0288 265); --surface: oklch(22.2% 0.0288 265); --raised: oklch(25.5% 0.0259 265);
    --ink: oklch(90% 0.0080 265); --muted: oklch(68% 0.0288 265); --faint: oklch(50% 0.0288 265);
    --line: oklch(90% 0.0288 265 / 0.10); --line-soft: oklch(90% 0.0288 265 / 0.06);
    --card-shadow: 0 1px 2px rgba(0,0,0,0.35); --lift-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.3);
    --drawer-shadow: -8px 0 40px rgba(0,0,0,0.5); --scrim: rgba(0,0,0,0.4);
    --attn: #d0a147; --fail: #cf7b71; --ok: #7fae8e; --live: #7fa8b8; --attn-soft: rgba(208,161,71,0.12);
    --proj-hercule: #9490c9; --proj-ops: #bd93a8; }
  :root { --sans: "Onest", -apple-system, system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; --w-emph: 500; --w-urgent: 600; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  .mono { font-family: var(--mono); }
  .app { display: flex; min-height: 100vh; }
  code { font-family: var(--mono); font-size: 12px; background: var(--line-soft); padding: 1px 5px; border-radius: 4px; font-weight: 400; }
  a.ref { color: var(--ink); text-decoration: none; font-weight: var(--w-emph); border-bottom: 1px solid var(--line); }

  /* chrome */
  .side { width: 204px; flex: none; background: var(--surface); border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; padding: 16px 10px; position: sticky; top: 0; height: 100vh; }
  .logo { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px 16px; }
  .logo b { font-size: 15px; letter-spacing: 0.01em; font-weight: var(--w-emph); }
  .logo span { font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav a { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 13px; }
  .nav a.on { background: var(--line-soft); color: var(--ink); font-weight: var(--w-emph); }
  .nav a:not(.on):hover { background: var(--line-soft); }
  .nav .count { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .nav .sep { height: 1px; background: var(--line-soft); margin: 8px 10px; }
  .chrome-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .proto-badge { border: 1px dashed var(--attn); color: var(--attn); background: var(--attn-soft); border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 10px; line-height: 1.5; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: baseline; gap: 14px; padding: 24px 32px 0; }
  .topbar h1 { font-size: 18px; margin: 0; letter-spacing: -0.015em; font-weight: var(--w-emph); }
  .topbar .when { color: var(--muted); font-size: 13px; }
  .topbar .since { color: var(--faint); font-size: 12.5px; margin-left: auto; }
  .topbar .crumbs { font-size: 18px; font-weight: var(--w-emph); letter-spacing: -0.015em; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  .topbar .crumbs a { color: var(--faint); text-decoration: none; font-weight: 400; font-size: 14px; }
  .topbar .crumbs a:hover { color: var(--ink); }
  .topbar .crumbs .sepc { color: var(--faint); font-weight: 400; }
  #stage { padding: 16px 32px 150px; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 44px; align-items: start; max-width: 1100px; }
  .layout.split { grid-template-columns: 470px minmax(0, 1fr); gap: 28px; max-width: 1220px; }
  .split .drow .from, .split .prow .next, .split .crow .sum, .split .crow .n, .split .headline br { display: none; }
  .split .tabs { flex-wrap: wrap; }
  .split .prow .t { flex: 1; }
  .maincol { display: flex; flex-direction: column; min-width: 0; }
  .maincol .lane { margin-bottom: 28px; }
  .maincol .lane > .lane-label { margin-bottom: 10px; }
  .rail { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 22px; }

  /* atoms */
  .lane-label { text-transform: uppercase; letter-spacing: 0.1em; font-size: 10.5px; font-weight: var(--w-emph); color: var(--faint); display: flex; align-items: center; gap: 8px; }
  .lane-label .n { font-family: var(--mono); font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .lane-label .why { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); }
  .lane-label.now { color: var(--attn); }
  .headline { font-size: 13.5px; color: var(--muted); padding-bottom: 20px; }
  .headline b { color: var(--ink); font-weight: var(--w-emph); font-variant-numeric: tabular-nums; }
  .headline .warm { color: var(--attn); font-weight: var(--w-emph); }
  .sys { width: 12px; height: 12px; flex: none; fill: currentColor; color: var(--muted); vertical-align: -2px; display: inline-block; }
  .sys.lg { width: 14px; height: 14px; }
  .sys.faint { color: var(--faint); }
  .syst { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .eq { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 10px; width: 11px; flex: none; }
  .eq i { width: 2.5px; border-radius: 1px; background: var(--live); height: 4px; animation: eqb 1.15s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: 0.22s; } .eq i:nth-child(3) { animation-delay: 0.44s; }
  @keyframes eqb { 0%, 100% { height: 3px; } 50% { height: 9px; } }
  @keyframes pulse { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .eq i, .dot, .burn { animation: none !important; } }
  .dmark { color: var(--attn); font-size: 9px; flex: none; position: relative; top: -1px; }
  .pmark { color: var(--faint); font-size: 10px; flex: none; position: relative; top: -1px; }
  .burn { width: 7px; height: 7px; border-radius: 50%; background: var(--attn); flex: none; display: inline-block; animation: pulse 1.6s ease-in-out infinite; }
  .okg { color: var(--ok); } .failg { color: var(--fail); } .cang { color: var(--faint); }
  .pausemark { color: var(--attn); font-size: 12px; flex: none; }
  .markcell { width: 16px; flex: none; display: inline-flex; justify-content: center; align-items: center; font-size: 12px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); flex: none; animation: pulse 2.4s ease-in-out infinite; display: inline-block; }
  .idledot { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; display: inline-block; }
  .pri { display: inline-flex; align-items: center; flex: none; }
  .pri .bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 9px; }
  .pri .bars i { width: 2.5px; border-radius: 1px; background: var(--line); }
  .pri .bars i:nth-child(1) { height: 3.5px; } .pri .bars i:nth-child(2) { height: 6px; } .pri .bars i:nth-child(3) { height: 9px; }
  .pri[data-pri="low"] .bars i:nth-child(1) { background: var(--faint); }
  .pri[data-pri="normal"] .bars i:nth-child(-n+2) { background: var(--muted); }
  .pri[data-pri="high"] .bars i { background: var(--muted); }
  .pri[data-pri="urgent"] .bars i { background: var(--ink); }
  .age { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
  .age[data-age="recent"] { color: var(--muted); } .age[data-age="stale"] { color: var(--ink); } .age[data-age="old"] { color: var(--attn); font-weight: 500; }
  .qbtn { font-family: var(--sans); font-size: 12px; line-height: 1; font-weight: var(--w-emph); border: 0; background: none; color: var(--muted); padding: 6px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .qbtn:hover { background: var(--line-soft); color: var(--ink); }
  .qbtn.first { color: var(--ink); }
  .qbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .acts { display: flex; gap: 4px; align-items: center; margin-left: -9px; }
  .ent { display: inline-flex; width: 13px; justify-content: center; align-items: center; flex: none; vertical-align: -1px; }
  .ent-task i { width: 8px; height: 8px; border: 1.5px solid var(--faint); border-radius: 2.5px; display: block; }
  .fl { text-transform: uppercase; letter-spacing: 0.09em; font-size: 10px; color: var(--faint); font-weight: var(--w-emph); padding-top: 2px; }
  .fv { color: var(--muted); }
  .fv b { color: var(--ink); font-weight: var(--w-emph); }
  .fv .none { color: var(--faint); }
  .openlink { color: var(--faint); font-size: 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .openlink:hover { color: var(--ink); }
  .chev { color: var(--faint); font-size: 10px; }

  /* tabs */
  .tabs { display: flex; gap: 2px; margin-bottom: 22px; border-bottom: 1px solid var(--line-soft); align-items: baseline; }
  .tab { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 6px 10px 8px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; gap: 7px; align-items: baseline; }
  .tab .n { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .tab.on { color: var(--ink); font-weight: var(--w-emph); border-bottom-color: var(--ink); }
  .tab:hover:not(.on) { color: var(--ink); }
  .tab .burn { margin-left: -2px; }
  .tabs .manage { margin-left: auto; padding-bottom: 8px; }

  /* light proposal card */
  .pcard { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--card-shadow); padding: 11px 16px 9px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; scroll-margin-top: 20px; }
  .pcard:hover { box-shadow: var(--lift-shadow); }
  .pcard.sel { border-color: var(--muted); }
  .pcard .tline { display: flex; align-items: baseline; gap: 10px; }
  .pcard .crumb { color: var(--faint); font-size: 12px; white-space: nowrap; }
  .pcard .t { font-size: 14.5px; font-weight: var(--w-emph); letter-spacing: -0.008em; }
  .pcard[data-pri="urgent"] .t { font-size: 15.5px; font-weight: var(--w-urgent); }
  .pcard[data-pri="low"] { opacity: 0.8; }
  .pcard .tline .age { margin-left: auto; }
  .pcard .made { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .pcard .gist { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard .foot { display: flex; align-items: center; gap: 10px; }
  .pcard .foot .openlink { margin-left: auto; }
  .pcard.lead { padding: 16px 20px 12px; box-shadow: var(--lift-shadow); gap: 9px; }
  .pcard.lead .t { font-size: 17px; }
  .pcard.lead .gist { white-space: normal; font-size: 13px; color: var(--ink); }
  .pcard.lead .link { font-size: 12.5px; color: var(--muted); }
  .pstack { display: flex; flex-direction: column; gap: 8px; }
  .tier { margin-bottom: 16px; }
  .tier > .lane-label { margin-bottom: 8px; }
  /* compact proposal row (split list, B's condensed) */
  .prow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; cursor: pointer; border-top: 1px solid var(--line-soft); }
  .prow:first-child { border-top: 0; }
  .prow:hover { background: var(--line-soft); }
  .prow.sel { background: var(--raised); border-color: transparent; box-shadow: var(--card-shadow); outline: 1px solid var(--line); }
  .prow .t { font-weight: var(--w-emph); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow[data-pri="urgent"] .t { font-weight: var(--w-urgent); }
  .prow[data-pri="low"] { opacity: 0.72; }
  .prow .marks { display: inline-flex; gap: 4px; align-items: center; flex: none; }
  .prow .next { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .prow .next b { color: var(--ink); font-weight: var(--w-emph); }
  .prow .openlink { flex: none; }
  .rows { display: flex; flex-direction: column; }

  /* questions */
  .drow { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--card-shadow); }
  .drow .q { font-weight: var(--w-emph); font-size: 13.5px; white-space: nowrap; }
  .drow .from { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
  .drow .acts { margin-left: auto; gap: 2px; }
  .dstack { display: flex; flex-direction: column; gap: 6px; }

  /* what came in: connection rows with explicit open affordance */
  .crow { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line-soft); cursor: pointer; border-radius: 8px; }
  .crow:first-child { border-top: 0; }
  .crow:hover { background: var(--line-soft); }
  .crow.sel { background: var(--raised); box-shadow: var(--card-shadow); outline: 1px solid var(--line); }
  .crow b { font-weight: var(--w-emph); font-size: 13px; white-space: nowrap; }
  .crow .sum { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crow .warm { color: var(--attn); }
  .crow .n { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .fyi { display: flex; gap: 12px; align-items: baseline; padding: 5px 2px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line-soft); }
  .fyi:first-of-type { border-top: 0; }
  .fyi .when { font-family: var(--mono); font-size: 11px; color: var(--faint); width: 60px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .fyi .sys { align-self: center; }
  .fyi .by { margin-left: auto; color: var(--faint); font-size: 11.5px; white-space: nowrap; }
  .digestline { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; padding: 2px 2px; }
  .digestline b { font-weight: var(--w-emph); color: var(--ink); }

  /* ---- detail (shared content; placed in drawer / page / split pane) ---- */
  .detail { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .detail .dhead { display: flex; flex-direction: column; gap: 6px; }
  .detail .dhead .crumb { color: var(--faint); font-size: 12px; display: flex; gap: 8px; align-items: center; }
  .detail h2 { margin: 0; font-size: 18px; font-weight: var(--w-emph); letter-spacing: -0.012em; display: flex; gap: 10px; align-items: baseline; }
  .detail h2 .age { font-size: 12px; }
  .detail .dsec { display: flex; flex-direction: column; gap: 6px; }
  .detail .dsec > .lane-label { margin-bottom: 2px; }
  .detail p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink); max-width: 68ch; }
  .detail p.m { color: var(--muted); }
  .detail .kv { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 5px 14px; font-size: 12.5px; }
  .detail .acts { padding: 4px 0; }
  .detail .acts .qbtn { font-size: 13px; padding: 7px 10px; }
  .sigcard { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 8px; padding: 9px 12px; display: flex; flex-direction: column; gap: 3px; }
  .sigcard .l1 { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .sigcard .l1 b { font-weight: var(--w-emph); }
  .sigcard .l1 .kind { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .sigcard .l1 .src { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; }
  .sigcard .snip { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .sigcard .l3 { display: flex; gap: 4px; margin-left: -9px; }
  .sigcard .l3 .qbtn { font-size: 11.5px; padding: 4px 9px; }
  .hist { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); }
  .hist div { display: flex; gap: 10px; align-items: baseline; }
  .hist .when { font-family: var(--mono); font-size: 11px; color: var(--faint); width: 60px; flex: none; text-align: right; }
  .verdict { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 8px; padding: 9px 12px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); line-height: 1.6; white-space: pre-wrap; }
  .verdict b { color: var(--ink); font-weight: 500; }
  /* events list */
  .efilters { display: flex; gap: 2px; border-bottom: 1px solid var(--line-soft); margin-bottom: 4px; }
  .efilters .tab { font-size: 12.5px; padding: 4px 8px 6px; }
  .erow { display: grid; grid-template-columns: 62px 14px 44px minmax(0, 1fr) auto; gap: 0 10px; align-items: baseline; padding: 5px 2px; border-top: 1px solid var(--line-soft); font-size: 12.5px; color: var(--muted); cursor: pointer; }

  return `<div class="detail">
    <div class="dhead"><div class="crumb">${sysEl(c.sys)}<span>connection · ${c.n} events since Sunday 18:10${c.polled ? ` · polled ${c.polled} ago` : ""}</span>${closeBtn}</div>
      <h2>${c.c}</h2>${c.warm ? `<p class="m"><span style="color:var(--attn)">${c.warm}</span> - Email triage tripped its spawn bound at 07:51; held events are listed below and resume with the trigger.</p>` : ""}</div>
    <div class="dsec"><div class="efilters">${filters.filter(([k]) => k === "all" || cnt(k)).map(([k, l]) => `<button class="tab ${efilter === k ? "on" : ""}" data-efilter="${k}">${l}<span class="n">${cnt(k)}</span></button>`).join("")}</div>
      ${ev.slice(0, 60).map((e) => `<div class="erow ${e.quiet ? "quiet" : ""}"><span class="when">${e.at}</span>${sysEl(e.sys, "faint")}<span class="kind">${e.k}</span><span class="t">${e.t}</span>
        <span class="vw ${e.held ? "held" : ""}">${e.ref ? `<a href="#" data-sel="${e.ref}">${e.vw}</a>` : e.vw}</span></div>`).join("")}
      ${ev.length > 60 ? `<div class="erow quiet"><span class="when"></span><span></span><span></span><span class="t">… ${ev.length - 60} more</span><span></span></div>` : ""}</div>
  </div>`;
}
function detailTopics(d, closeBtn) {
  return `<div class="detail">
    <div class="dhead"><div class="crumb"><span>settings · topics</span>${closeBtn}</div><h2>Topics</h2>
      <p class="m">A topic is a label. Each connection files its events into one default topic; triage agents label a proposal with the connection's topic unless the content says otherwise (a Tailscale notice on your personal mailbox is <b>ops</b>, not personal). Tabs show every topic in use, in this order.</p></div>
    <div class="dsec">${Object.entries(TOPICS).map(([k, t]) => `<div class="topic"><b>${t.label}</b><span class="conns">${t.conns.filter((c) => d.conns.find((x) => x.c === c)).map((c) => `<span class="syst">${sysEl(findC(c).sys)}${c}</span>`).join("") || '<span class="none">no connection defaults here - agent-assigned only</span>'}</span><span class="acts"><button class="qbtn">Rename</button><button class="qbtn">Move up</button></span></div>`).join("")}
      <div class="acts" style="padding-top:8px"><button class="qbtn first">Add topic</button></div></div>
    <div class="dsec"><div class="lane-label">Connections without a topic</div><p class="m">None. A new connection asks for its topic during setup and can be moved here later.</p></div>
  </div>`;
}
function detailEl(d, s, closeBtn = "") {
  if (!s) return "";
  if (s.kind === "topics") return detailTopics(d, closeBtn);
  if (s.kind === "conn") { const c = findC(s.c); return c ? detailConn(c, closeBtn) : ""; }
  const p = findP(s.id); return p ? detailProp(p, closeBtn) : "";
}
const closeBtn = '<button class="qbtn close" data-close="1" aria-label="Close" style="margin-left:auto">Close ✕</button>';

/* ============ list page (shared by A and B) ============ */
function listPage(d, { lead = false } = {}) {
  const cur = get("topic") || "all";
  const inT = (x) => cur === "all" || x.topic === cur;
  const props = d.proposals.filter(inT);
  const conns = d.conns.filter((c) => cur === "all" || c.topic === cur);
  let proposals;
  if (lead) {
    const first = props.find((p) => p.pri === "urgent") || props[0];
    const rest = props.filter((p) => p !== first);
    proposals = `<section class="lane">${first ? `<div class="tier"><div class="lane-label ${first.pri === "urgent" ? "now" : ""}">${first.pri === "urgent" ? burnEl + "Now" : "First"} <span class="n">1</span></div>${pcardEl(first, true)}</div>` : ""}
      ${tiersEl(rest, prowEl)}</section>`;
  } else proposals = `<section class="lane">${tiersEl(props, pcardEl)}</section>`;
  return `${headline(d)}${tabsEl(d, cur)}${questionsEl(d.questions.filter(inT))}${proposals}${connsEl(conns)}${fyiEl(d.fyi.filter(inT))}${cur === "all" ? receiptLine(d) : ""}`;
}

/* converged: Page's list + the Drawer for detail */
function renderIntake(d) {
  const s = sel();
  document.getElementById("overlay").innerHTML = s ? `<div class="scrim" data-close="1"></div><div class="drawer">${detailEl(d, s, closeBtn)}</div>` : "";
  return `<div class="layout"><div class="maincol">${listPage(d, { lead: true })}</div><aside class="rail">${triageRail(d)}${legendEl()}</aside></div>`;
}

/* ============ page ============ */
const variants = [
  { key: "R4", name: "Intake", render: renderIntake, note: "Round 4 · converged: lead card + tiered rows (Page) with the Drawer for proposal, connection and topic detail." },
];
function params() { return new URLSearchParams(location.search); }
function get(k) { return params().get(k); }
function setParam(k, v) { const p = params(); if (v === null) p.delete(k); else p.set(k, v); try { history.replaceState(null, "", "?" + p.toString()); } catch (e) {} }
function current() { const k = (get("variant") || "A").toUpperCase(); const i = variants.findIndex((v) => v.key === k); return i === -1 ? 0 : i; }
function show(i) { setParam("variant", variants[(i + variants.length) % variants.length].key); setParam("open", null); render(); }
function navEl(d) {
  const items = [[pageName(), d.proposals.length + d.questions.length, true], ["Check-in", d.checkin.decisions, false], ["Tasks"], ["Sessions"], ["Runs"], ["Workflows"], null, ["Fleet"], ["Connections"], ["Notifications", 5], ["Settings"]];
  return items.map((it) => it === null ? '<div class="sep"></div>' : `<a href="#" class="${it[2] ? "on" : ""}">${it[0]}${it[1] !== undefined ? ` <span class="count">${it[1]}</span>` : ""}</a>`).join("");
}
function topbarEl(v) {
  const s = sel();
  return `<h1>${pageName()}</h1><span class="when">Monday 08:30</span><span class="since">since you last checked · Sunday 18:10</span>`;
}
function render() {
  const v = variants[current()];
  const d = data();
  document.getElementById("nav").innerHTML = navEl(d);
  document.getElementById("stage").innerHTML = v.render(d);
  document.getElementById("topbar").innerHTML = topbarEl(v);
  document.getElementById("swlabel").textContent = v.key + " · " + v.name;
  document.getElementById("vnote").textContent = v.note;
  document.getElementById("dsbtn").textContent = get("data") === "busy" ? "busy" : "calm";
}
document.addEventListener("click", (e) => {
  if (e.target.closest(".sw")) return;
  const close = e.target.closest("[data-close]");
  if (close) { e.preventDefault(); setParam("open", null); render(); return; }
  const ef = e.target.closest("[data-efilter]");
  if (ef) { efilter = ef.dataset.efilter; render(); return; }
  const tab = e.target.closest("[data-topic]");
  if (tab) { setParam("topic", tab.dataset.topic); render(); return; }
  const s = e.target.closest("[data-sel]");
  if (s) { e.preventDefault(); efilter = "all"; setParam("open", s.dataset.sel); render(); return; }
});
function toggleData() { setParam("data", get("data") === "busy" ? "calm" : "busy"); setParam("open", null); render(); }
function toggleTheme() { const root = document.documentElement; const dark = root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches); root.dataset.theme = dark ? "light" : "dark"; }
function cycleName() { setParam("name", ((+get("name") || 0) + 1) % NAMES.length); render(); }
function move(dir) {
  const d = data(); const cur = get("topic") || "all"; const props = d.proposals.filter((p) => cur === "all" || p.topic === cur);
  const order = TIERS.flatMap(([, , f]) => props.filter(f)); const i = order.findIndex((p) => p.id === selKey());
  const n = order[Math.max(0, Math.min(order.length - 1, i + dir))]; if (n) { setParam("open", n.id); render(); }
}
document.getElementById("dsbtn").addEventListener("click", toggleData);
document.getElementById("theme").addEventListener("click", toggleTheme);
document.getElementById("legendbtn").addEventListener("click", () => { legendOn = !legendOn; render(); });
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
  if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  if (e.key === "Escape") { setParam("open", null); render(); }
  if (e.key === "d") toggleData();
  if (e.key === "t") toggleTheme();
  if (e.key === "n") cycleName();
});
render();
</script>
