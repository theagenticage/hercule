name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # All three targets cross-compile from one Linux host (spec 15 section 11).
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Compile
        run: |
          bun run scripts/gen-version.ts
          # The web bundle is embedded file by file, so it has to exist and be
          # listed before the compile.
          pnpm --filter @hercule/web build
          bun run scripts/check-bundle-budget.ts
          bun run scripts/gen-web-bundle.ts
          for target in bun-darwin-arm64 bun-linux-x64 bun-linux-arm64; do
            bun build packages/hercule/src/main.ts \
              --compile --target="$target" \
              --outfile "dist-binary/hercule-${target#bun-}"
          done
          ls -l dist-binary

      - name: Run hercule --version (linux-x64, native)
        run: ./dist-binary/hercule-linux-x64 --version

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Run hercule --version (linux-arm64, under QEMU)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist-binary:/out" \
            debian:bookworm-slim /out/hercule-linux-arm64 --version

      # The Linux binaries are final here. The darwin one is not: it goes out
      # under its own name so nothing downstream can mistake it for the signed
      # artifact that `sign-macos` publishes.
      # A pull request builds and runs the binaries but publishes nothing.
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          # 1 day everywhere: workflow artifacts count against the account's
          # Actions storage quota, and a private repo on a personal account
          # gets 500 MB of it. Release assets do not count, so published
          # binaries belong on releases, not on retained artifacts.
          retention-days: 1
          name: hercule-linux
          path: |
            dist-binary/hercule-linux-x64
            dist-binary/hercule-linux-arm64
          if-no-files-found: error

      # This upload exists only to cross the job boundary to sign-macos.
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: hercule-darwin-arm64-unsigned
          path: dist-binary/hercule-darwin-arm64
          if-no-files-found: error

  # codesign must run on a macOS runner (spec 15 section 11).
  sign-macos:
    needs: compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: hercule-darwin-arm64-unsigned
          path: dist-binary

      - uses: ./.github/actions/codesign-binary
        with:
          path: dist-binary/hercule-darwin-arm64

      - name: Run hercule --version (darwin-arm64, native)
        run: ./dist-binary/hercule-darwin-arm64 --version

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          retention-days: 1
          name: hercule-darwin-arm64-signed
          path: dist-binary/hercule-darwin-arm64
          if-no-files-found: error
