name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Bun is pinned exactly: the compiled binary is built with it, and
      # versions at or below 1.3.12 carry the codesign signature regression
      # (spec 15 section 11).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # Mode isolation: the runner entrypoint links no controller package
      # (spec 15 section 3, ADR 0018).
      - run: pnpm dep-lint
