name: CI

# A change to Markdown files alone runs nothing: no check reads them, and
# oxfmt skips them. The book's HTML and CSS in docs/design/ still run it,
# because the desktop job compares the app with them. Agent skills and settings
# (.agents/, .claude/) are not part of the product, so they run nothing either.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", ".agents/**", ".claude/**"]
  pull_request:
    paths-ignore: ["**/*.md", ".agents/**", ".claude/**"]

# Every job's token can only read the repository, unless the job asks for more.
permissions:
  contents: read

# On a pull request, a newer push cancels the run of an older one. On `main` a
# run is never cancelled, because cancelling it halfway through publishing
# would leave no `edge` release until the next run. Runs on `main` wait their
# turn instead: one runs at a time, and a newer push replaces a run still
# waiting. So `edge` is published in push order and never goes back in time. This ordering is why the `edge` jobs live in this workflow: they
# publish the very commit that passed the checks, in the same queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The checks of `AGENTS.md` run as parallel jobs rather than one after
  # another, and the test suites are split over several runners with
  # `--shard`. Run in one job they took about 20 minutes; a pull request now
  # waits only for the slowest job.
  #
  # Every job is bounded by `timeout-minutes`. The bound stops a hung test
  # from holding the runner for GitHub's default of six hours, and a job that
  # times out keeps its logs, which a cancelled job does not.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  # The two halves of `pnpm test`. Each needs its own runtime (see
  # `vitest.config.ts`), so each is its own job, split into shards.
  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One failing shard must not cancel the others: a pull request should
      # see every failing test in one run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun --bun run vitest run --project node --project node-isolated --shard=${{ matrix.shard }}/3

  test-react:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec vitest run --project react --project desktop-main --project desktop-renderer --shard=${{ matrix.shard }}/3

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The migration immutability check diffs against the pull request's
          # base. A shallow clone does not have that history.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Mode isolation: the runner entrypoint links no controller package
      # (spec 15 section 3, ADR 0018).
      - run: pnpm dep-lint

      # A landed migration is never edited: editing one in place breaks every
      # database that already ran the old version.
      - run: bun run scripts/check-migrations.ts
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}

      # install.sh is the one shell script users run. The runner image ships
      # shellcheck.
      - run: shellcheck install.sh

      # The Vite config, the React Compiler Babel pass, the bundle budget and
      # the embedded file list are only exercised by an actual build; the
      # binary suite then runs what that build produced. The upgrade test is
      # excluded here: it downloads the previous edge binary and lives in the
      # `upgrade` job, so this job does not pay for that download twice.
      - run: pnpm build:binary
      - run: bun --bun run vitest run --project binary --exclude='**/upgrade.test.ts'

  # Tests that a database filled by the previous edge release upgrades cleanly
  # to the new binary. Runs on Linux x64, the same platform as the
  # `hercule-linux-x64` edge asset it downloads. A failed upgrade must not
  # publish (see `edge-build.needs`).
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      # The GitHub API download uses the job token to read this repository's
      # `edge` release.
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: pnpm build:binary
      - run: bun --bun run vitest run --project binary e2e/upgrade.test.ts

  # The desktop app is packaged on a macOS runner, compared with the Bureau
  # book, and the part of the end-to-end suite that does not depend on the
  # machine runs against it. Its Linux package is built and tried by
  # `desktop-linux`, and the whole suite runs on Linux in `desktop-e2e-linux`.
  # Together they let a developer check a desktop change on one platform, a
  # Mac or Linux, and leave the other to CI.
  #
  # What runs here is what a Mac behaves differently on from Linux, and what a
  # virtual Mac can check reliably: the packaged app's start, its second
  # launch and its quit (package.test.ts, refused-arguments.test.ts), its
  # security (security.test.ts: the page's policy, navigation, permissions and
  # IPC), the connect screen with its CORS check (connect.test.ts), signing
  # in and out with the token (sign-in.test.ts, sign-out.test.ts), the menu
  # bar (menu.test.ts), and the window with what closing it and activating the
  # app do (window.test.ts).
  #
  # The rest does not run here, because it checks pixels, timing or the
  # keyboard focus, and CI's virtual Macs differ from a user's Mac in all
  # three: a 1024 by 768 screen at 1x with the Dock showing, Reduce motion and
  # Reduce transparency on, a slow machine, and no one to give a window the
  # focus. In the files that do run, the tests that depend on those carry
  # `skipIf(ON_HOSTED_MAC)` with the reason beside them. A change that can
  # break the rest is checked by its author on a Mac or on Linux, and Linux
  # CI runs all of it.
  desktop:
    runs-on: macos-latest
    # A fresh runner spends a few minutes on the install and Electron's
    # 100 MB download, and the binary build and the end-to-end tests add a few
    # more. The bound stops a capture or a test that hangs, such as on a macOS
    # alert, from holding the runner for GitHub's default of six hours.
    timeout-minutes: 25
    env:
      # No signing identity exists in this job. Without this, electron-builder
      # looks for one in the keychain; the packages are signed ad hoc instead.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/cache-electron
      - uses: ./.github/actions/setup

      # install.sh runs on macOS only, so its tests that run it past the
      # platform check are skipped in the `test-node` job, on Linux. The file name
      # also matches the runner's tests of the harness installers, which run
      # here too. They run on Bun, like every backend test: the projects'
      # global setup migrates the test database with `bun:sqlite`.
      - run: bun --bun run vitest run --project node --project node-isolated install.test.ts

      # Builds the release package and the test package, and checks the
      # renderer's bundle budget and main's startup file.
      - run: pnpm build:desktop
      # Compares the app's faces, marks and icons with the Crew Bureau book in
      # docs/design/crew-bureau-2, pixel for pixel, on the book's palette.
      # It compares nothing else: the app's screens are compared with the
      # app's own goldens by the `ui-metrics` job (ADR 0047).
      - run: pnpm compare:bureau
      # When the comparison fails, its captures show why, where the log
      # cannot: the book's sheet, the app's sheet, and the difference between
      # them. They are kept for a week.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bureau-compare
          path: apps/desktop/out/bureau-compare
          retention-days: 7

      # The end-to-end tests sign in to a real controller, the compiled binary,
      # and run the test package that `pnpm build:desktop` built.
      - run: pnpm build:binary
      - name: Run the end-to-end tests that do not depend on the machine
        run: >-
          pnpm test:desktop
          e2e/desktop/package.test.ts
          e2e/desktop/refused-arguments.test.ts
          e2e/desktop/security.test.ts
          e2e/desktop/connect.test.ts
          e2e/desktop/sign-in.test.ts
          e2e/desktop/sign-out.test.ts
          e2e/desktop/menu.test.ts
          e2e/desktop/window.test.ts

  # The ratchet of the desktop UI hill climb (docs/research/ui-hill-climb.md,
  # section 4.1): `ui:metrics` measures contrast, edges, discipline, targets,
  # focus, resilience and reading on the specimen pages, in six themes, and
  # fails when any number is worse than `apps/desktop/ui-metrics.baseline.json`.
  # A regression is accepted only by editing the baseline in the pull request
  # and giving the reason in its body.
  #
  # The same pass compares the screenshots it takes (12 screens per theme, 72
  # in all) with the goldens in `apps/desktop/ui-goldens/`, pixel for pixel
  # (docs/adr/0047-the-desktop-app-is-its-own-pixel-reference.md). Each shard
  # compares only the goldens of its themes, and every shard checks
  # `provenance.json`; together the shards check every golden. A change that
  # is meant to move pixels re-records them from a full run, with
  # `pnpm --filter @hercule/desktop ui:metrics --write-goldens` (a shard
  # cannot write goldens), and every golden that moved is looked at before it
  # is committed.
  #
  # It runs on Linux in Playwright's Chromium, with no Electron and no
  # controller, so it needs no macOS runner. Its budget is 3 minutes of
  # wall-clock time per shard: it must add nothing to the longest job of this
  # workflow. The themes are split over two shards that run in parallel, each
  # a runner of its own, and each shard compares only the baseline keys of its
  # themes. The first shard holds the first theme, which also measures the
  # metrics of the whole run (`run/...`), so every key is checked on every
  # change. Balance the shards by their measured time. If a change makes a
  # shard slower, add a shard or move the slowest variants to a nightly run
  # rather than raising the bound.
  #
  # It runs only when something it reads can have changed. On `main` it
  # always runs. The first step decides, without a third-party action, and the
  # later steps skip when it says no, so the job still succeeds and a
  # required check on it can pass.
  ui-metrics:
    name: ui-metrics (${{ matrix.themes }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # A failure in one shard must not hide the numbers of the other.
      fail-fast: false
      # Three themes each. The first shard also measures the run-wide
      # metrics, and on 2026-10-26 a split of three and two took 99 s and
      # 50 s to measure. With six themes, run on one machine on 2026-10-28,
      # each shard took 36 s. A test (scripts/ui-screens.test.ts) fails
      # unless every theme is in exactly one shard.
      matrix:
        themes:
          - whitehaven,styles,blue-train
          - orient-express,nile,end-house
    steps:
      - uses: actions/checkout@v7
        with:
          # The first step diffs against the pull request's base. A shallow
          # clone does not have that history.
          fetch-depth: 0

      - name: Decide whether the UI metrics apply
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # What the metrics read: the renderer (its styles, tokens and
          # fonts), the scripts that load, measure and compare it, what the
          # specimens import from other packages (the IPC types and the
          # default appearance, the theme lists), and the toolchain.
          touched=$(git diff --name-only "$BASE_SHA"...HEAD | grep -E '^(apps/desktop/src/renderer/|apps/desktop/src/ipc/|apps/desktop/scripts/ui-|apps/desktop/scripts/capture-ui\.ts$|apps/desktop/scripts/sheet-server\.ts$|apps/desktop/vite\.renderer\.config\.ts$|apps/desktop/package\.json$|apps/desktop/ui-metrics\.baseline\.json$|apps/desktop/ui-goldens/|pnpm-lock\.yaml$|package\.json$|\.bun-version$|packages/client-core/|packages/contract/|\.github/workflows/ci\.yml$|\.github/actions/)' || true)
          if [ -n "$touched" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "The UI metrics apply, because of:"
            echo "$touched"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No file the UI metrics read changed, so they are skipped."
          fi

      - if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/setup

      # Chromium is about 150 MB, and changes only with Playwright's version,
      # which the lockfile pins. The system libraries are not cached: they
      # come from apt, and `install` below fetches them in seconds.
      - name: Read the Playwright version
        if: steps.changes.outputs.run == 'true'
        id: playwright
        run: echo "version=$(grep -m1 -oE '^  playwright@[0-9.]+' pnpm-lock.yaml | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - if: steps.changes.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @hercule/desktop ui:metrics --themes ${{ matrix.themes }}

      # The log shows the report. The screenshots, the diff images of the
      # goldens (`golden-diff/`, the differing pixels in magenta) and the
      # numbers of the run show what moved, and `metrics.json` is what to
      # write into the baseline when the change is meant. They are kept for a
      # week.
      - if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ui-metrics-${{ matrix.themes }}
          path: apps/desktop/out/ui-metrics
          retention-days: 7

  # The Android app's check (spec 18, Testing). It runs on every change, like
  # every other job: the path filter at the top applies to the whole
  # workflow, not to single jobs.
  #
  # It runs on a macOS runner because the Roborazzi goldens are recorded on a
  # Mac. On Linux, five of them differ by the anti-aliasing at the edge of
  # vector shapes. Recording them on Linux would fail the check on every
  # developer's Mac, and a tolerance would loosen the comparison.
  #
  # The runner image ships the Android SDK packages the app builds against.
  # When an image update drops one, the Android Gradle plugin downloads it.
  android:
    runs-on: macos-latest
    # A run with no cache takes about five minutes.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/android
    steps:
      # The build runs third-party Gradle plugins, so the job's token is not
      # left on disk for them to read.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Newer JDKs are too new for the Android Gradle plugin.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle's downloads and checks the wrapper's checksum. A pull
      # request reads the cache that `main` writes and writes none of its own.
      # The `basic` provider is the open-source cache on `actions/cache`; the
      # default since v6 is a closed-source library under Gradle's terms.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Robolectric downloads its Android framework jar, about 200 MB, into
      # Maven's folder rather than Gradle's, so setup-gradle does not cache it.
      # The jar changes only with Robolectric's version or the SDK level it
      # runs, which these two files pin.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('apps/android/gradle/libs.versions.toml', 'apps/android/app/src/test/resources/robolectric.properties') }}

      - run: ./gradlew assembleDebug testDebugUnitTest verifyRoborazziDebug lintDebug

      # The log shows only a summary of a failure. When a golden differs,
      # Roborazzi writes the new screenshot and an image of the difference;
      # the reports hold each failed test's stack trace and every lint
      # warning. They are kept for a week.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-check
          path: |
            apps/android/app/build/outputs/roborazzi
            apps/android/app/build/reports
          retention-days: 7

  # Cross-compiles the Linux binaries for edge: x64 natively, arm64 under QEMU,
  # both smoke-tested with --version. Runs on pull requests so the edge pipeline
  # can be tested before merge. Uploads the binaries so edge-linux-install can
  # test the same artifact, and so edge-build can publish it on main.
  edge-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Cross-compile Linux binaries
        run: |
          bun run scripts/gen-version.ts
          pnpm --filter @hercule/web build
          bun run scripts/check-bundle-budget.ts
          bun run scripts/gen-web-bundle.ts
          for target in bun-linux-x64 bun-linux-arm64; do
            bun build packages/hercule/src/main.ts \
              --compile --splitting --target="$target" \
              --outfile "dist-binary/hercule-${target#bun-}"
          done

      - name: Run hercule --version (linux-x64, native)
        run: ./dist-binary/hercule-linux-x64 --version

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Run hercule --version (linux-arm64, under QEMU)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist-binary:/out" \
            debian:bookworm-slim /out/hercule-linux-arm64 --version

      # One day is enough for edge-linux-install on the same run, and for
      # edge-build on main. Uploading on pull requests too lets the installer
      # check consume this artifact instead of rebuilding.
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: hercule-linux
          path: |
            dist-binary/hercule-linux-x64
            dist-binary/hercule-linux-arm64
          if-no-files-found: error

  # Tests install.sh on Linux x64 with the binary edge-linux built. Runs on
  # pull requests so the installer can be tested before merge. Consumes the
  # artifact edge-linux uploaded, so the tested binary is the one that gets
  # published.
  edge-linux-install:
    needs: [edge-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: hercule-linux
          path: linux-binaries

      - name: Assemble release directory for install.sh test
        run: |
          mkdir test-release
          cp linux-binaries/hercule-linux-x64 test-release/
          cd test-release
          sha256sum hercule-linux-x64 > SHA256SUMS
          cat SHA256SUMS

      - name: Test install.sh on Linux x64
        run: |
          HERCULE_RELEASE_URL="file://$PWD/test-release" sh install.sh
          ~/.local/bin/hercule --version
          # The installer needs no root, so it installs no app on Linux. It
          # only prints how to install the `.deb`.
          [ ! -d /Applications ]
          [ ! -e /opt/Hercule ]

  # The desktop app's whole end-to-end suite, `pnpm test:desktop`, on Linux in
  # the container of `apps/desktop/container`: Ubuntu 24.04 with a virtual
  # screen, a window manager and a D-Bus session. It builds the compiled binary
  # and the desktop app in the container, then runs every test. A developer
  # runs the same command on any Linux machine with Docker, so a failure here
  # can be reproduced there.
  #
  # `desktop-linux` installs the `.deb` on a real host and starts it, which a
  # container cannot show. This job runs the app's behaviour. Together with the
  # `desktop` job on macOS, which runs the part of the suite that does not
  # depend on the machine, they let a pull request be checked on one platform.
  #
  # It runs on every change, like `desktop`: the path filter at the top
  # applies to the whole workflow. The tests start the real controller, so
  # almost any file can change their result.
  #
  # The host installs the dependencies, which the container mounts. The
  # container downloads Electron and Playwright's Chromium into a Docker volume
  # that lives only as long as the runner, so every run downloads them again,
  # about 250 MB, which takes seconds on a runner.
  desktop-e2e-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:desktop:container

  # Builds the desktop app's Linux packages, a `.deb` and an Arch Linux
  # package, installs each the way a user would, and starts the app. The `.deb`
  # goes on a real Ubuntu 24.04 host, the Arch package in an `archlinux`
  # container. The `edge` release publishes these very files
  # (`edge-build.needs`), so a package that does not install or start blocks
  # the release.
  #
  # The `.deb` needs a real host, not a container. Ubuntu 24.04 sets
  # `kernel.apparmor_restrict_unprivileged_userns=1`, which stops Chromium's
  # sandbox from starting unless an AppArmor profile allows it. The `.deb`
  # installs that profile, and only a host that enforces the sysctl shows
  # whether it works. The app refuses `--no-sandbox`, so a broken profile
  # shows as an app that aborts at start.
  #
  # Arch has no AppArmor, so a container tells what a real Arch host would:
  # whether pacman installs the package with only its dependencies, whether
  # every library is found, and whether the app starts with its sandbox.
  # `apps/desktop/container/arch-install-check.sh` does that.
  #
  # It runs only when something the build reads can have changed, and always on
  # `main`. The first step decides, as in `ui-metrics`, and the later steps
  # skip when it says no, so the job still succeeds and `edge-build` can wait
  # for it.
  desktop-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The first step diffs against the pull request's base. A shallow
          # clone does not have that history.
          fetch-depth: 0

      - name: Decide whether the Linux package applies
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # What the build reads: the app, the packages it links, the bundle
          # budget check, and the toolchain.
          touched=$(git diff --name-only "$BASE_SHA"...HEAD | grep -E '^(apps/desktop/|packages/client-core/|packages/contract/|scripts/check-bundle-budget\.ts$|pnpm-lock\.yaml$|package\.json$|\.bun-version$|\.github/workflows/ci\.yml$|\.github/actions/)' || true)
          if [ -n "$touched" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "The Linux package applies, because of:"
            echo "$touched"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No file the Linux package reads changed, so it is skipped."
          fi

      - if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/setup

      # An update replaces an installed package only when the new one has a
      # higher version, and `package.json` holds a constant one. So the
      # version carries the run number, which only grows. electron-builder
      # turns `0.1.0-edge.9` into the Debian version `0.1.0~edge.9`, which
      # sorts below `0.1.0~edge.10` and below a plain `0.1.0`. Every build
      # of the `.deb` needs the suffix: a plain `0.1.0` would sort above all
      # edge builds, and no later edge build could replace it. For the Arch
      # package the version is `0.1.0_edge.9`, which pacman sorts above a
      # plain `0.1.0`: Arch has no `~`. The change stays in this runner's
      # checkout.
      - name: Give the package a version that grows with every run
        if: steps.changes.outputs.run == 'true'
        run: |
          base=$(node -p 'require("./apps/desktop/package.json").version')
          (cd apps/desktop && npm pkg set "version=$base-edge.${{ github.run_number }}")

      # fpm builds the Arch package with `bsdtar` and compresses it with
      # `zstd`; the runner image has neither guaranteed.
      - name: Install the tools that build the Arch Linux package
        if: steps.changes.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools zstd

      # Builds the release `.deb` and Arch package and the test package, and
      # checks the renderer's bundle budget and main's startup file.
      - name: Build the packages
        if: steps.changes.outputs.run == 'true'
        run: pnpm build:desktop

      # The gate. The app is installed with apt, started as the normal user
      # with a scratch HOME and no sandbox switch, and must show a window and
      # stay up. Then a second build with a higher version is installed over
      # it, and the same check runs again, so the upgrade path of the package
      # is tested too. The second build is the first one repacked with a
      # higher version number: the files are the same, but the install
      # scripts, the AppArmor profile and dpkg's version order all run.
      - name: Install the package, start the app, upgrade the package, start it again
        if: steps.changes.outputs.run == 'true'
        run: |
          first=$PWD/apps/desktop/dist/release/Hercule-linux-amd64.deb
          debug_dir=$RUNNER_TEMP/desktop-linux-debug
          mkdir -p "$debug_dir"

          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils dbus-x11 imagemagick

          # The check means something only on a host that enforces AppArmor
          # and restricts unprivileged user namespaces, as Ubuntu 24.04 does by
          # default. A runner image may change that, so the job turns the
          # restriction on and fails when it cannot, rather than passing
          # without testing the profile.
          apparmor_enabled=$(cat /sys/module/apparmor/parameters/enabled 2> /dev/null || echo missing)
          echo "AppArmor enabled: $apparmor_enabled"
          if [ "$apparmor_enabled" != Y ]; then
            echo "::error::AppArmor is not enabled on this runner, so the package's AppArmor profile cannot be tested."
            exit 1
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          restrict=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          echo "kernel.apparmor_restrict_unprivileged_userns = $restrict"
          if [ "$restrict" != 1 ]; then
            echo "::error::kernel.apparmor_restrict_unprivileged_userns is $restrict, not 1, so the sandbox check would not need the package's AppArmor profile."
            exit 1
          fi

          first_version=$(dpkg-deb -f "$first" Version)
          echo "Package version: $first_version"
          case "$first_version" in
            *"~edge."*) ;;
            *)
              echo "::error::The package version is $first_version. An edge package must carry the ~edge.<run> suffix, or a later edge build cannot replace it."
              exit 1
              ;;
          esac

          # The screen and the D-Bus session the app needs. Both are stopped
          # by the process ids kept here when the step ends.
          export DISPLAY=:99
          Xvfb "$DISPLAY" -screen 0 1920x1080x24 -nolisten tcp > "$debug_dir/xvfb.log" 2>&1 &
          xvfb_pid=$!
          eval "$(dbus-launch --sh-syntax)"
          trap 'kill "$xvfb_pid" "$DBUS_SESSION_BUS_PID" 2> /dev/null || true' EXIT
          for _ in $(seq 100); do
            xprop -root > /dev/null 2>&1 && break
            sleep 0.1
          done
          xprop -root > /dev/null || { echo "::error::Xvfb did not start."; cat "$debug_dir/xvfb.log"; exit 1; }

          # Saves what a person would look at, then stops the job.
          fail() {
            echo "::error::$*"
            import -window root "$debug_dir/screen.png" 2> /dev/null || true
            xwininfo -root -tree > "$debug_dir/windows.txt" 2>&1 || true
            pgrep -af '^/opt/Hercule/' | cut -c1-200 || true
            exit 1
          }

          # Prints the AppArmor status and fails unless the package installed a
          # profile for the app and the kernel has loaded it. Without it the
          # restriction above stops the app's sandbox from starting.
          require_apparmor_profile() {
            echo "--- AppArmor profile files"
            find /etc/apparmor.d -maxdepth 1 -iname '*hercule*' -ls | grep . || fail "The package installed no AppArmor profile in /etc/apparmor.d."
            echo "--- AppArmor profiles loaded for the app"
            sudo grep -i hercule /sys/kernel/security/apparmor/profiles || fail "The kernel has no loaded AppArmor profile for the app."
            sudo aa-status 2>&1 | grep -E 'profiles are loaded|profiles are in enforce mode' || true
          }

          # Checks that the app has a window on the screen: one whose
          # class instance is hercule-desktop, that is mapped and viewable
          # (IsViewable), and at least 200 by 200 pixels. A hidden window, or
          # one of the small helper windows Chromium makes, does not count.
          # There is no window manager in this job, so the check reads X
          # itself.
          has_viewable_window() {
            for id in $(xwininfo -root -tree | awk '/\("hercule-desktop" / { print $1 }'); do
              info=$(xwininfo -id "$id" 2> /dev/null) || continue
              width=$(echo "$info" | awk '/^ *Width:/ { print $2 }')
              height=$(echo "$info" | awk '/^ *Height:/ { print $2 }')
              if echo "$info" | grep -q 'Map State: IsViewable' && [ "${width:-0}" -ge 200 ] && [ "${height:-0}" -ge 200 ]; then
                return 0
              fi
            done
            return 1
          }

          # Starts the installed app, waits for a window, checks that it stays
          # up without the sandbox switched off, and quits it.
          start_and_check() {
            label=$1
            log=$debug_dir/app-$label.log
            home=$(mktemp -d)
            # `env` replaces itself with the app, so $! is the app's own pid.
            # The app is not given the switches that turn the sandbox off. The
            # runner sets XDG_CONFIG_HOME, which Chromium reads before HOME, so
            # without these the app would keep its state in the runner's own
            # folders and the second start would reuse the first one's.
            env -u ELECTRON_DISABLE_SANDBOX HOME="$home" XDG_CONFIG_HOME="$home/.config" \
              XDG_CACHE_HOME="$home/.cache" XDG_DATA_HOME="$home/.local/share" \
              /opt/Hercule/hercule-desktop > "$log" 2>&1 &
            app_pid=$!

            window_found=false
            for _ in $(seq 60); do
              kill -0 "$app_pid" 2> /dev/null || { cat "$log"; fail "The app ($label) exited before it showed a window. Its log is above."; }
              if has_viewable_window; then
                window_found=true
                break
              fi
              sleep 1
            done
            $window_found || { cat "$log"; fail "The app ($label) showed no window within 60 seconds."; }

            # The window can be a splash that is followed by a crash.
            sleep 10
            kill -0 "$app_pid" 2> /dev/null || { cat "$log"; fail "The app ($label) showed a window and then exited."; }
            has_viewable_window || fail "The app ($label) is running, but its window is gone."

            if tr '\0' '\n' < "/proc/$app_pid/environ" | grep -q '^ELECTRON_DISABLE_SANDBOX='; then
              fail "The app ($label) runs with ELECTRON_DISABLE_SANDBOX set."
            fi
            pgrep -af '^/opt/Hercule/hercule-desktop' | cut -c1-160
            if pgrep -f '^/opt/Hercule/hercule-desktop .*--no-sandbox' > /dev/null; then
              fail "A process of the app ($label) runs with --no-sandbox."
            fi
            echo "The app ($label) shows a window, has been up for 10 seconds, and runs with its sandbox."

            kill -TERM "$app_pid"
            for _ in $(seq 30); do
              kill -0 "$app_pid" 2> /dev/null || break
              sleep 1
            done
            if kill -0 "$app_pid" 2> /dev/null; then
              kill -KILL "$app_pid"
              fail "The app ($label) did not quit within 30 seconds of SIGTERM."
            fi
            rm -rf "$home"
          }

          sudo apt-get install -y "$first"
          echo "Installed: $(dpkg-query -W -f='${Version}' hercule-desktop)"
          require_apparmor_profile
          start_and_check first

          second_version="$first_version.1"
          dpkg --compare-versions "$second_version" gt "$first_version"
          work=$(mktemp -d)
          sudo dpkg-deb -R "$first" "$work/package"
          sudo sed -i "s/^Version: .*/Version: $second_version/" "$work/package/DEBIAN/control"
          sudo dpkg-deb --root-owner-group -b "$work/package" "$work/Hercule-upgrade.deb"
          sudo apt-get install -y "$work/Hercule-upgrade.deb"
          installed=$(dpkg-query -W -f='${Version}' hercule-desktop)
          if [ "$installed" != "$second_version" ]; then
            fail "After the upgrade the installed version is $installed, not $second_version."
          fi
          echo "Upgraded: $first_version -> $installed"
          require_apparmor_profile
          start_and_check upgraded

      # The same check for the Arch package, in a bare `archlinux` container:
      # pacman installs it with only its dependencies, ldd finds every
      # library, and the app starts without a sandbox switch. The second
      # package is the same files built again with a higher version, from the
      # unpacked app (`--prepackaged`), so pacman's version order and the
      # install script's upgrade run too.
      #
      # An Arch host has no AppArmor, so the restriction the Ubuntu check set
      # is lifted: the container shares the host's kernel, and with the
      # restriction on, the app's sandbox in the container would depend on how
      # Docker confines it, which no Arch user has. Docker's default seccomp
      # profile blocks the user namespaces the sandbox needs, which a real
      # Arch kernel allows, so the profile is switched off for this container.
      - name: Install the Arch package in a bare Arch container, start the app, upgrade it, start it again
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          packages=$RUNNER_TEMP/arch-packages
          mkdir -p "$packages" "$RUNNER_TEMP/arch-upgrade" "$RUNNER_TEMP/arch-debug"
          cp apps/desktop/dist/release/Hercule-linux-x86_64.pkg.tar.zst "$packages/first.pkg.tar.zst"
          version=$(node -p 'require("./apps/desktop/package.json").version')
          (cd apps/desktop && pnpm exec electron-builder --linux pacman \
            --prepackaged dist/release/linux-unpacked \
            --config.directories.output="$RUNNER_TEMP/arch-upgrade" \
            --config.extraMetadata.version="$version.1")
          cp "$RUNNER_TEMP/arch-upgrade/Hercule-linux-x86_64.pkg.tar.zst" "$packages/second.pkg.tar.zst"
          docker run --rm --security-opt seccomp=unconfined --shm-size=1g \
            -v "$PWD/apps/desktop/container":/check:ro \
            -v "$packages":/packages:ro \
            -v "$RUNNER_TEMP/arch-debug":/debug \
            archlinux:latest \
            bash /check/arch-install-check.sh /packages/first.pkg.tar.zst /packages/second.pkg.tar.zst /debug

      # The screen, the window list and the app's logs, which show why the
      # check failed where the log cannot. They are kept for a week.
      - if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-debug
          path: |
            ${{ runner.temp }}/desktop-linux-debug
            ${{ runner.temp }}/arch-debug
          retention-days: 7
          if-no-files-found: ignore

      # Only the two packages. The build also writes `latest-linux.yml` for an
      # updater that does not exist. One day is enough for `edge-build`.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: hercule-desktop-linux
          path: |
            apps/desktop/dist/release/Hercule-linux-amd64.deb
            apps/desktop/dist/release/Hercule-linux-x86_64.pkg.tar.zst
          retention-days: 1
          if-no-files-found: error

  # Builds the rolling `edge` prerelease: the binary and the desktop app for
  # macOS on Apple silicon, and the Linux binaries and the desktop app's
  # `.deb` and Arch package, from the commit that just passed the jobs above
  # (spec 15 section 1). `edge-publish` then publishes what it built.
  #
  # The asset names and the format of SHA256SUMS are what `install.sh` reads;
  # change them together.
  edge-build:
    # Edge publishes only a commit that passed every check, the upgrade test,
    # the Linux install test, the Linux package's install and start, and the
    # desktop app's end-to-end suite on Linux.
    needs:
      - typecheck
      - lint
      - test-node
      - test-react
      - check
      - desktop
      - android
      - edge-linux
      - edge-linux-install
      - desktop-linux
      - desktop-e2e-linux
      - upgrade
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    # The signing certificate's secrets live in this environment, which only
    # `main` may use. docs/signing-certificate.md describes it.
    environment: desktop-signing
    env:
      APP: apps/desktop/dist/release/mac-arm64/Hercule.app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-electron
      - uses: ./.github/actions/setup

      - run: pnpm build:binary
      - uses: ./.github/actions/codesign-binary
        with:
          path: hercule
      - run: ./hercule --version

      # The certificate goes into a keychain made for this job. macOS does not
      # trust a self-signed certificate until told to, and electron-builder
      # only signs with an identity that `security find-identity -v` lists as
      # valid, so this runner trusts it. The runner is thrown away after the
      # job, with its keychain and trust settings. Users' Macs never need to
      # trust the certificate: the Keychain compares the app's designated
      # requirement, which names the certificate by its hash.
      #
      # electron-builder can import a certificate itself, from CSC_LINK, but
      # version 26 then passes the certificate's password to
      # `security set-key-partition-list`, which needs the keychain's, and
      # fails.
      - name: Install the signing certificate on this runner
        id: signing
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          # Without the certificate electron-builder signs the app ad hoc and
          # carries on. Every build would then be a different app to the
          # Keychain, and each update would sign the user out (spec 17).
          if [ -z "$SIGNING_CERTIFICATE" ] || [ -z "$SIGNING_CERTIFICATE_PASSWORD" ]; then
            echo "::error::The secrets SIGNING_CERTIFICATE and SIGNING_CERTIFICATE_PASSWORD are not set in the desktop-signing environment. They hold the desktop app's signing certificate; docs/signing-certificate.md describes how to make it."
            exit 1
          fi
          p12="$RUNNER_TEMP/signing.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "$SIGNING_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          # With no options, the keychain never locks itself during the build.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # `-x` makes the private key impossible to export, so the build
          # steps after this one, which run third-party code, can sign with
          # the key but cannot copy it.
          security import "$p12" -k "$keychain" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -x
          # Lets codesign use the private key without a password dialog.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          # codesign looks for identities in the keychains on this list. The
          # existing list is split into words on purpose: each keychain is
          # its own argument.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          # macOS's own LibreSSL, not Homebrew's OpenSSL 3 that comes first on
          # the PATH: OpenSSL 3 cannot read a .p12 encrypted with the legacy
          # ciphers an export from Keychain Access can use.
          /usr/bin/openssl pkcs12 -in "$p12" -nokeys -clcerts \
            -passin env:SIGNING_CERTIFICATE_PASSWORD -out "$RUNNER_TEMP/signing.pem"
          rm "$p12"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '$1 == "1)" { print $2 }')
          if [ -z "$identity" ]; then
            echo "::error::The certificate in SIGNING_CERTIFICATE is not a valid code-signing identity. It may have expired; docs/signing-certificate.md describes how to replace it."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # electron-builder signs the release package with the identity whose
      # hash CSC_NAME holds. The test package is signed ad hoc.
      - run: pnpm build:desktop
        env:
          CSC_NAME: ${{ steps.signing.outputs.identity }}

      # A designated requirement that names the certificate is what keeps the
      # Keychain trusting the app across updates; the hardened runtime is what
      # keeps other code from being loaded into it (spec 17).
      - name: Check that the app is signed with the certificate, under the hardened runtime
        run: |
          signature=$(codesign --display --verbose=2 --requirements - "$APP" 2>&1)
          echo "$signature"
          if ! echo "$signature" | grep -q "^designated => .*certificate leaf"; then
            echo "::error::$APP is not signed with the certificate in SIGNING_CERTIFICATE: its designated requirement names no certificate."
            exit 1
          fi
          if ! echo "$signature" | grep -q "^CodeDirectory .*flags=.*runtime"; then
            echo "::error::$APP is signed without the hardened runtime."
            exit 1
          fi

      # The release package's fuses, its app.asar, its signature, and that it
      # starts and quits, on the signed package. The rest of the desktop suite
      # runs in the `desktop` and `desktop-e2e-linux` jobs, on the unsigned one.
      - run: pnpm exec vitest run --project desktop e2e/desktop/package.test.ts

      # Download the Linux binaries that edge-linux built, and the `.deb` that
      # desktop-linux built and installed (same workflow run).
      - uses: actions/download-artifact@v8
        with:
          name: hercule-linux
          path: linux-binaries
      - uses: actions/download-artifact@v8
        with:
          name: hercule-desktop-linux
          path: linux-desktop

      # `ditto --keepParent` keeps the bundle's symlinks and signature intact,
      # which a plain `zip` does not. SHA256SUMS lists bare file names, so
      # `shasum -c` can check it from the folder the assets are downloaded to.
      - name: Assemble the assets
        run: |
          mkdir edge-assets
          cp hercule edge-assets/hercule-darwin-arm64
          cp linux-binaries/hercule-linux-x64 edge-assets/
          cp linux-binaries/hercule-linux-arm64 edge-assets/
          cp linux-desktop/Hercule-linux-amd64.deb edge-assets/
          cp linux-desktop/Hercule-linux-x86_64.pkg.tar.zst edge-assets/
          ditto -c -k --keepParent "$APP" edge-assets/Hercule-darwin-arm64.zip
          cd edge-assets
          shasum -a 256 hercule-darwin-arm64 hercule-linux-x64 hercule-linux-arm64 Hercule-darwin-arm64.zip Hercule-linux-amd64.deb Hercule-linux-x86_64.pkg.tar.zst > SHA256SUMS
          cat SHA256SUMS

      # Installs what is about to be published, the way a user would, with a
      # scratch Hercule Home: the download and checksum check, the binary and
      # the app. This runner has no Hercule service yet, so it is a first
      # install, which starts nothing.
      - name: Install the assets with install.sh (macOS)
        env:
          HERCULE_HOME: ${{ runner.temp }}/hercule-home
        run: HERCULE_RELEASE_URL="file://$PWD/edge-assets" sh install.sh

      # The next step install.sh prints: the installed binary installs the
      # service unit for the same scratch Home, and returns once the
      # controller has started and stays up.
      #
      # A running process does not prove the boot finished: a keychain prompt
      # for the master key would hold the boot with the process still up. So
      # the step waits for `<home>/setup-url`, which the boot writes after it
      # has read the master key, and calls `setup.read` at the address in it.
      # The desktop app does not read that file: it asks the binary, taking
      # the address from `controllerUrl` in `hercule service status --json`
      # and the setup token from `hercule setup-url`. The unit is removed
      # again afterwards, though the runner is thrown away after the job
      # anyway.
      - name: Run Hercule as a service with the installed binary
        env:
          HERCULE_HOME: ${{ runner.temp }}/hercule-home
        run: |
          hercule="$HOME/.local/bin/hercule"
          "$hercule" service install
          status=$("$hercule" service status --json)
          echo "$status"
          if ! echo "$status" | jq -e '.running == true and .role == "serve"' > /dev/null; then
            echo "::error::hercule service install returned, but the service is not running the controller. See $HERCULE_HOME/logs/controller.log and controller.stderr.log."
            exit 1
          fi
          setup_url_file="$HERCULE_HOME/setup-url"
          for _ in $(seq 30); do
            [ -s "$setup_url_file" ] && break
            sleep 1
          done
          if [ ! -s "$setup_url_file" ]; then
            echo "::error::The controller runs, but did not write $setup_url_file within 30 seconds, so its boot is stuck, for example on a keychain prompt. See $HERCULE_HOME/logs/controller.log."
            exit 1
          fi
          # The setup URL holds a setup token, so only its origin is printed.
          origin=$(sed -E 's#^(https?://[^/]+)/.*#\1#' "$setup_url_file")
          echo "The setup URL points at $origin"
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 "$origin/api/v1/setup"
          echo
          "$hercule" service uninstall

      - uses: actions/upload-artifact@v7
        with:
          name: edge-assets
          path: edge-assets
          retention-days: 1

  # Publishes what `edge-build` built as the `edge` prerelease. It runs apart
  # from the build, on Linux, so the one job that can write to the repository
  # runs no build tools and never sees the signing certificate.
  edge-publish:
    needs: [edge-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Deletes the `edge` release and its tag, and creates them again.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: edge
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: edge-assets
          path: edge-assets

      # The tag cannot be moved: GitHub refuses to let this job's token point
      # a tag at a commit whose workflow files differ from those of the commit
      # the tag points at now. So each publish deletes the release and its
      # tag, and creates both again. An install in the minute between finds no
      # release and refuses.
      #
      # GitHub also refuses to create the tag on a commit whose workflow files
      # differ from those on `main`. So when `main` has moved on since this
      # run started, the job publishes nothing and leaves the current release
      # in place: deleting it first would leave no release at all, and the
      # `upgrade` job, which every later run needs, fails without one. The run
      # for the newer commit publishes instead.
      - name: Publish the edge prerelease
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at ${main_sha::7} now, not ${GITHUB_SHA::7}, so the run for the newer commit publishes edge."
            exit 0
          fi
          title="$TAG (${GITHUB_SHA::7})"
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<EOF
          The rolling build of \`main\` at [\`${GITHUB_SHA::7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA), published by [CI run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Every push to \`main\` that passes CI replaces it.

          Install or update on macOS on Apple silicon or on Linux (x86_64 and aarch64):

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/install.sh | sh
          \`\`\`

          On macOS this installs the desktop app too. On Linux it prints the commands that install the desktop app's \`.deb\` or Arch package, which need root.
          EOF
          # The release or the tag may be gone already, after a run that
          # stopped halfway. A tag that is still there is caught below.
          gh release delete "$TAG" --yes > /dev/null 2>&1 || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" > /dev/null 2>&1 || true
          # `--target` is ignored when the tag still exists, and the new
          # release would then point at an older commit than its assets.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::Deleting the $TAG tag failed, so nothing was published. Delete the $TAG release and tag, then run this job again."
            exit 1
          fi
          gh release create "$TAG" edge-assets/* --target "$GITHUB_SHA" --prerelease \
            --title "$title" --notes-file "$notes"
          # Checks the result itself, whatever went wrong on the way.
          tagged_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
            echo "::error::The $TAG tag points at $tagged_sha instead of $GITHUB_SHA. Delete the $TAG release and tag, then run this job again."
            exit 1
          fi
